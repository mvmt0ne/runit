<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>runit — 마이페이지</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#202020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./transitions.js"></script>
  <style>
    .input-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .input-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    }

    .input-scroll::-webkit-scrollbar {
      display: none;
    }

    .input-section {
      padding: 24px 20px 8px;
    }

    .input-section+.input-section {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      margin-top: 8px;
    }

    .input-label {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-2);
      font-family: 'Pretendard Variable', sans-serif;
      margin-bottom: 8px;
      display: block;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      margin-bottom: 8px;
    }

    .ghost-btn {
      padding: 10px 14px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: var(--slate-gray);
      font-size: 15px;
      font-family: 'Pretendard Variable', sans-serif;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .ghost-btn:active {
      background: rgba(255, 255, 255, 0.06);
    }

    .zone-input {
      flex: 1;
      min-width: 0;
      box-sizing: border-box;
      padding: 12px 2px;
      color: var(--slate-gray);
      font-size: 16px;
      font-family: 'Pretendard Variable', sans-serif;
    }

    .saved-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .saved-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .saved-item:last-child {
      border-bottom: none;
    }

    .saved-date {
      font-size: 16px;
      color: var(--bone);
    }

    .saved-tags {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .saved-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--slate-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .delete-btn {
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--text-2);
      font-size: 13px;
      font-family: 'Pretendard Variable', sans-serif;
      cursor: pointer;
    }

    .delete-btn:active {
      color: var(--accent);
    }

    .saved-empty {
      color: var(--text-2);
      font-size: 13px;
      padding: 12px 0;
      opacity: 0.5;
      text-align: center;
      font-family: 'Pretendard Variable', sans-serif;
    }

    .toast {
      position: fixed;
      bottom: calc(40px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 14px 22px;
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      color: var(--bone);
      font-size: 14px;
      font-family: 'Pretendard Variable', sans-serif;
      z-index: 100;
      opacity: 0;
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 프로필 */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding-top: 28px;
    }

    .app-version {
      margin-left: auto;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--text-2);
      opacity: 0.6;
      font-family: 'Orbitron', sans-serif;
    }

    .mp-avatar {
      position: relative;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--slate-gray);
      cursor: pointer;
    }

    .mp-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mp-avatar-edit {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 0;
      background: rgba(0, 0, 0, 0.55);
      color: var(--bone);
      font-size: 14px;
      text-align: center;
      font-family: 'Pretendard Variable', sans-serif;
    }

    .mp-avatar-wrap {
      position: relative;
    }

    /* 휴지통 — 아바타 우상단에 겹치는 원형 버튼 */
    .mp-avatar-remove {
      position: absolute;
      top: 6px;
      right: 0px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--dark-gray);
      color: var(--slate-gray);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mp-avatar-remove:active {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <div class="phone">
    <div class="phone-inner bg-dark">
      <div class="input-page">
        <div class="back-header back-header--dark">
          <button class="back-btn" onclick="goBackSmart()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 19-7-7 7-7" />
              <path d="M19 12H5" />
            </svg>
          </button>
          <span class="back-title">마이페이지</span>
          <span class="app-version" id="app-version">runit</span>
        </div>

        <div class="input-scroll">
          <!-- ── 프로필 ── -->
          <div class="input-section profile-section">
            <div class="mp-avatar-wrap">
              <div class="mp-avatar" id="mp-avatar" onclick="document.getElementById('avatar-file').click()">
                <svg id="mp-avatar-ph" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" />
                </svg>
                <img id="mp-avatar-img" alt="" style="display:none">
                <span class="mp-avatar-edit">변경</span>
              </div>
              <button class="mp-avatar-remove" id="mp-avatar-remove" onclick="onRemoveAvatar()" style="display:none"
                aria-label="사진 삭제">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18" />
                  <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                  <path d="M10 11v6M14 11v6" />
                </svg>
              </button>
            </div>
            <input type="file" id="avatar-file" accept="image/*" style="display:none" onchange="onAvatarPick(event)">
          </div>

          <!-- ── 설정 (상단) ── -->
          <!-- 심박존 경계 -->
          <div class="input-section">
            <label class="input-label">심박존 경계 (러닝강도 분류)</label>
            <div class="saved-item">
              <span class="saved-date" id="zone-current">—</span>
            </div>
            <div class="field-row" style="margin-top:8px">
              <input id="z2max" class="zone-input" type="number" inputmode="numeric" placeholder="저/중 경계(존2 상한)">
              <input id="z3max" class="zone-input" type="number" inputmode="numeric" placeholder="중/고 경계(존3 상한)">
            </div>
            <div class="field-row">
              <div class="date-wrap">
                <input id="zfrom" class="zone-input" type="date" onclick="try{this.showPicker()}catch(e){}">
                <svg class="date-wrap-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                  <path d="M16 2v4M8 2v4M3 10h18" />
                </svg>
              </div>
              <button class="ghost-btn" onclick="onSaveZones()" style="color:var(--accent)">적용</button>
            </div>
            <div
              style="font-size:13px;color:var(--text-2);opacity:0.6;margin-top:6px;font-family:'Pretendard Variable',sans-serif">
              적용 시작일 이후 기록부터 새 존이 적용됩니다. 이전 기록은 당시 존 기준으로 유지됩니다.
            </div>
            <ul class="saved-list" id="zone-hist"></ul>
          </div>

          <!-- 계정 -->
          <div class="input-section">
            <label class="input-label">계정</label>
            <div class="saved-item">
              <span class="saved-date" id="acct-email">로그인 안 됨</span>
              <button class="ghost-btn" id="logout-btn" onclick="onLogout()">로그아웃</button>
            </div>
          </div>

          <!-- ── 데이터 관리 (하단) ── -->
          <!-- 신발장 요약 -->
          <div class="input-section">
            <label class="input-label">내 러닝화</label>
            <div class="saved-item">
              <span class="saved-date" id="shoe-count">0개</span>
              <button class="ghost-btn" onclick="goTo('shoes.html')">러닝화 관리 ›</button>
            </div>
          </div>

          <!-- 수동 추가 활동 -->
          <div class="input-section">
            <label class="input-label">직접 추가한 활동</label>
            <ul class="saved-list" id="acts-list"></ul>
          </div>

          <!-- 메타 오버라이드 -->
          <div class="input-section">
            <label class="input-label">메타 오버라이드 (이름·타입·러닝화)</label>
            <ul class="saved-list" id="meta-list"></ul>
          </div>

          <!-- 전체 삭제 -->
          <div class="input-section">
            <div class="field-row">
              <button class="ghost-btn" onclick="onClearAll()"
                style="flex:1;color:var(--accent);border-color:rgba(255,76,49,0.3)">활동·메타 전체 삭제</button>
            </div>
            <div
              style="font-size:12px;color:var(--text-2);opacity:0.6;margin-top:6px;font-family:'Pretendard Variable',sans-serif">
              러닝화는 전체 삭제에서 제외됩니다(자산). CSV 마스터(data/activities.csv)는 영향 없습니다.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
  <script src="./data/cloud.js"></script>
  <script src="./data/store.js"></script>
  <script>
    function goBackSmart() {
      if (window.history.length > 1) { history.back(); return; }
      goBack('input.html');
    }

    // 실제 활성 서비스워커 캐시 이름(runit-vXXX)을 읽어 표시 — 기기에서 배포 버전 확인용
    (async function showVersion() {
      const el = document.getElementById('app-version');
      if (!el || !('caches' in window)) return;
      try {
        const keys = await caches.keys();
        const v = keys.map(k => (k.match(/runit-v(\d+)/) || [])[1])
          .filter(Boolean).map(Number).sort((a, b) => b - a)[0];
        if (v != null) el.textContent = 'runit · v' + v;
      } catch (e) { /* ignore */ }
    })();
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('visible');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('visible'), 2000);
    }

    function render() {
      // 직접 추가 활동
      const actsEl = document.getElementById('acts-list');
      const acts = listManualActivities();
      actsEl.innerHTML = acts.length ? acts.map(a => `
        <li class="saved-item">
          <div>
            <div class="saved-date">${fmtDateDot(a.date)} · ${a.km ?? '?'}km</div>
            <div class="saved-tags">
              <span class="saved-tag">${a.name || a.type || '활동'}</span>
              ${a.id && a.id.startsWith('csv-') ? '<span class="saved-tag">CSV</span>' : '<span class="saved-tag">수동</span>'}
            </div>
          </div>
          <button class="delete-btn" onclick="onRemoveManual('${a.id}')">삭제</button>
        </li>`).join('') : '<div class="saved-empty">없음</div>';

      // 메타 오버라이드
      const metaEl = document.getElementById('meta-list');
      const items = listSavedDates();
      metaEl.innerHTML = items.length ? items.map(item => {
        const m = getMeta(item.date) || {};
        const tags = [];
        if (m.name) tags.push(`<span class="saved-tag">${m.name}</span>`);
        if (m.type) tags.push(`<span class="saved-tag">${m.type}</span>`);
        if (m.shoeId) tags.push('<span class="saved-tag">신발</span>');
        if (m.note) tags.push('<span class="saved-tag">메모</span>');
        return `
        <li class="saved-item">
          <div>
            <div class="saved-date">${fmtDateDot(item.date)}</div>
            <div class="saved-tags">${tags.join('') || '<span class="saved-tag">메타</span>'}</div>
          </div>
          <button class="delete-btn" onclick="onRemove('${item.date}')">삭제</button>
        </li>`;
      }).join('') : '<div class="saved-empty">없음</div>';

      document.getElementById('shoe-count').textContent = (typeof listShoes === 'function' ? listShoes().length : 0) + '개';

      renderZones();
      renderProfile();
    }

    /* ── 프로필 이미지 ── */
    function renderProfile() {
      const p = (typeof getProfile === 'function') ? getProfile() : {};
      const img = document.getElementById('mp-avatar-img');
      const ph = document.getElementById('mp-avatar-ph');
      const rm = document.getElementById('mp-avatar-remove');
      if (p && p.avatar) {
        img.src = p.avatar; img.style.display = 'block'; ph.style.display = 'none'; rm.style.display = '';
      } else {
        img.removeAttribute('src'); img.style.display = 'none'; ph.style.display = ''; rm.style.display = 'none';
      }
    }

    // 선택 이미지를 정사각형 240px로 리사이즈 → JPEG dataURL (Firestore 1MB 한도 내)
    function onAvatarPick(e) {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const im = new Image();
        im.onload = () => {
          const S = 240;
          const c = document.createElement('canvas');
          c.width = S; c.height = S;
          const ctx = c.getContext('2d');
          const side = Math.min(im.width, im.height);
          const sx = (im.width - side) / 2, sy = (im.height - side) / 2;
          ctx.drawImage(im, sx, sy, side, side, 0, 0, S, S);
          const dataURL = c.toDataURL('image/jpeg', 0.82);
          setProfile({ avatar: dataURL });
          renderProfile();
          showToast('프로필 사진 변경됨');
        };
        im.onerror = () => showToast('이미지를 불러올 수 없습니다');
        im.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function onRemoveAvatar() {
      setProfile({});
      renderProfile();
      showToast('프로필 사진 삭제됨');
    }

    function _today() { return new Date().toISOString().slice(0, 10); }

    function renderZones() {
      const cur = (typeof getZoneConfigFor === 'function') ? getZoneConfigFor(_today()) : { z2Max: 151, z3Max: 163 };
      document.getElementById('zone-current').textContent =
        `저 ≤${cur.z2Max} / 중 ${cur.z2Max + 1}~${cur.z3Max} / 고 ${cur.z3Max + 1}+`;
      const z2 = document.getElementById('z2max'), z3 = document.getElementById('z3max'), zf = document.getElementById('zfrom');
      if (document.activeElement !== z2) z2.value = cur.z2Max;
      if (document.activeElement !== z3) z3.value = cur.z3Max;
      if (!zf.value) zf.value = _today();
      const hist = (typeof getZoneHistory === 'function') ? getZoneHistory() : [];
      document.getElementById('zone-hist').innerHTML = hist.length
        ? hist.slice().reverse().map(h => `
          <li class="saved-item">
            <span class="saved-date">${fmtDateDot(h.from)}부터</span>
            <span class="saved-tag">저≤${h.z2Max} · 중≤${h.z3Max}</span>
          </li>`).join('')
        : '';
    }

    function onSaveZones() {
      const z2 = parseInt(document.getElementById('z2max').value, 10);
      const z3 = parseInt(document.getElementById('z3max').value, 10);
      const from = document.getElementById('zfrom').value || _today();
      if (!Number.isFinite(z2) || !Number.isFinite(z3) || z2 >= z3) {
        showToast('경계값을 확인하세요 (저/중 경계 < 중/고 경계)', true); return;
      }
      addZoneConfig(from, z2, z3);
      showToast(`${fmtDateDot(from)}부터 새 심박존 적용`);
      renderZones();
    }

    function onRemoveManual(id) { removeManualActivity(id); showToast('활동 삭제됨'); render(); }
    function onRemove(date) { removeSaved(date); showToast(`${date} 메타 삭제됨`); render(); }
    function onClearAll() {
      if (!confirm('직접 추가한 활동·메타를 모두 삭제할까요? (러닝화 제외)')) return;
      clearAllSaved();
      showToast('전체 삭제 완료');
      render();
    }

    function onLogout() {
      if (window.RUNIT_CLOUD && window.RUNIT_CLOUD.enabled) {
        window.RUNIT_CLOUD.signOut().then(() => location.replace('./login.html'));
      }
    }
    // 계정 표시 + 클라우드 동기화 시 재렌더
    if (window.RUNIT_CLOUD && window.RUNIT_CLOUD.enabled) {
      window.RUNIT_CLOUD.ready.then(u => {
        const el = document.getElementById('acct-email');
        if (el) el.textContent = u ? u.email : '로그인 안 됨';
        document.getElementById('logout-btn').style.display = u ? '' : 'none';
      });
      window.addEventListener('runit-cloud-sync', render);
    } else {
      document.getElementById('logout-btn').style.display = 'none';
    }

    render();
  </script>

  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').then(function (r) { if (r) { setInterval(function () { r.update(); }, 60000); } }); (function () { var _rf = false; navigator.serviceWorker.addEventListener('controllerchange', function () { if (_rf) return; _rf = true; location.reload(); }); })(); }
  </script>
</body>

</html>
