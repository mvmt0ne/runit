<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>runit — 러닝화 비교</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#202020" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="runit" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css"
    rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./transitions.js"></script>
  <style>
    .sc-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sc-scroll {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    }

    .sc-scroll::-webkit-scrollbar {
      display: none;
    }

    /* 신발 헤더 행 */
    .sc-heads {
      display: flex;
      gap: 8px;
      position: sticky;
      /* 컴팩트 스티키 헤더(lp-header) 바로 아래에 붙음 */
      top: calc(env(safe-area-inset-top, 0px) + 28px);
      z-index: 2;
      background: var(--bone);
      padding: 16px;
      border-radius: 0 0 16px 16px;
    }

    .sc-head {
      padding: 0 10px 0 0;
    }

    .sc-head:active {
      opacity: 0.7;
    }

    .sc-head-img {
      display: none;
      width: 70%;
      height: 36px;
      object-fit: contain;
    }

    .sc-head-ph {
      width: 100%;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--slate-gray);
    }

    .sc-head-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--asphalt-black);
      text-transform: uppercase;
      line-height: 1.1;
      word-break: break-word;
    }

    .sc-head.sc-add {
      background: transparent;
      margin-left: auto;
      margin-right: auto;
    }

    .sc-head-remove {
      color: var(--asphalt-black);
      margin-top: 16px;
    }

    .sc-head-edit {
      position: absolute;
      top: 6px;
      left: 8px;
      color: var(--asphalt-black);
      cursor: pointer;
      padding: 2px;
    }

    .sc-head-edit:active {
      color: var(--bone);
    }

    /* 러닝화별 러닝 활동 — 어코디언 */
    .sc-acc {
      background: var(--dark-gray);
      border-radius: 12px;
      padding: 0 16px;
    }

    .sc-acc-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 2px;
      cursor: pointer;
    }

    .sc-acc-head:active {
      opacity: 0.6;
    }

    .sc-acc-title {
      flex: 1;
      min-width: 0;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.5em;
      color: var(--bone);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sc-acc-title em {
      font-size: 12px;
      font-style: normal;
      font-weight: 600;
      color: var(--asphalt-black);
      background: var(--accent);
      margin-left: 8px;
      padding: 2px 7px;
      border-radius: 100px;
    }

    .sc-acc-edit {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: var(--slate-gray);
      cursor: pointer;
    }

    .sc-acc-edit:active {
      color: var(--accent);
    }

    .sc-acc-chev {
      flex-shrink: 0;
      color: var(--cloudy-gray);
      display: flex;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sc-acc.open .sc-acc-chev {
      transform: rotate(180deg);
    }

    .sc-acc-body {
      display: none;
      padding-bottom: 8px;
    }

    .sc-acc.open .sc-acc-body {
      display: block;
    }

    .sc-run {
      font-family: 'Space Mono', monospace;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 2px;
      border-bottom: 0px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
    }

    .sc-run:active {
      opacity: 0.55;
    }

    .sc-run-date {
      width: 80px;
      flex-shrink: 0;
      font-size: 14px;
      color: var(--cloudy-gray);
    }

    .sc-run-name {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      color: var(--bone);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sc-run-km,
    .sc-run-pace {
      flex-shrink: 0;
      font-size: 14px;
      color: var(--slate-gray);
      text-align: right;
    }

    .sc-run-km {
      width: 52px;
    }

    .sc-run-pace {
      width: 44px;
      color: var(--cloudy-gray);
    }

    .sc-head-wrap {
      position: relative;
      min-width: 0;
      width: 33.3%;
    }

    /* 지표 행 */
    .sc-metric {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px 0;
      margin: 0 20px;
    }

    .sc-metric-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
      margin-bottom: 8px;
    }

    .sc-metric-label svg {
      width: 15px;
      height: 15px;
    }

    .sc-vals {
      display: grid;
      gap: 6px;
    }

    .sc-val {
      text-align: center;
      font-size: 18px;
      font-weight: 500;
      color: var(--bone);
      font-family: 'Space Mono', monospace;
    }

    .sc-val u {
      font-size: 11px;
      font-weight: 400;
      color: var(--slate-gray);
      text-decoration: none;
      margin-left: 2px;
    }

    .sc-val.sc-best {
      color: var(--accent);
    }

    .sc-val.sc-empty {
      color: var(--asphalt-gray);
    }

    .sc-note {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--asphalt-gray);
      margin: 20px;
      font-family: 'Pretendard Variable', sans-serif;
    }

    .sc-empty-page {
      padding: 60px 24px;
      text-align: center;
      color: var(--cloudy-gray);
      font-size: 14px;
      font-family: 'Pretendard Variable', sans-serif;
      line-height: 1.6;
    }

    .sc-empty-page a {
      color: var(--accent);
      cursor: pointer;
    }

    /* 선택 시트 리스트 — 높이는 JS 지정 (공유 .month-list max-height:300 해제) */
    #sc-pick-list {
      max-height: none;
      min-height: 0;
    }

    /* 선택 시트 안 러닝화 항목 */
    .sc-pick {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      cursor: pointer;
      border-radius: 10px;
    }

    .sc-pick:active {
      background: rgba(128, 128, 128, 0.18);
    }

    .sc-pick.sc-picked {
      background: rgba(128, 128, 128, 0.08);
    }

    .sc-pick-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .sc-pick-name {
      flex: 1;
      font-size: 15px;
      color: var(--bone);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .sc-pick-km {
      font-size: 13px;
      color: var(--cloudy-gray);
      font-family: 'Urbanist', sans-serif;
    }
  </style>
</head>

<body>
  <div class="phone">
    <div class="phone-inner bg-dark" style="background: var(--asphalt-black);">
      <div class="sc-page">
        <div class="sc-scroll" id="sc-scroll">
          <!-- Compact sticky header -->
          <div class="lp-header">
            <span class="lp-header-title-compact">러닝화</span>
          </div>
          <!-- Large title -->
          <div class="lp-hero">
            <h1 class="lp-hero-title">러닝화</h1>
          </div>
          <div id="sc-body">
            <div class="sc-empty-page">불러오는 중…</div>
          </div>
        </div>
      </div>

      <!-- 러닝화 선택 시트 -->
      <div class="sf-backdrop" id="sc-backdrop" onclick="closeCmpPicker()"></div>
      <div class="month-modal" id="sc-sheet">
        <div class="sf-handle"><span class="sf-handle-bar"></span></div>
        <div class="sf-sheet-header" style="padding: 2px 20px 12px;">
          <span class="sf-sheet-title" id="sc-sheet-title">러닝화 선택</span>
        </div>
        <div class="month-list" id="sc-pick-list" style="overflow-y:auto; padding:4px 10px 12px;"></div>
      </div>
    </div>
  </div>

  <script src="./data/store.js"></script>
  <script src="./data/activities.js"></script>
  <script>
    let SC_SHOES = [];
    let SC_ACTS = [];
    let scSlots = [];        // 비교 슬롯의 shoeId (최대 3)
    let _scActiveSlot = -1;  // 시트로 편집 중인 슬롯 인덱스

    function scSecToPace(sec) {
      if (sec == null) return '--';
      const t = Math.round(sec);
      return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
    }

    const SC_METRICS = [
      { key: 'totalKm', label: '총 거리', unit: 'K', icon: '<path d="M9 20l-5.4-2.3a1 1 0 0 1-.6-.9V5.2a1 1 0 0 1 1.4-.9L9 6m0 14l6-2m-6 2V6m6 12l5.4 2.3a1 1 0 0 0 1.4-.9V6.8a1 1 0 0 0-.6-.9L15 4m0 14V4m0 0L9 6" />', better: 'high', fmt: v => v },
      { key: 'avgPace', label: '평균 페이스', unit: '/km', icon: '<circle cx="12" cy="13" r="8"/><path d="M12 13V9"/><path d="M9 3h6"/>', better: 'low', fmt: scSecToPace },
      { key: 'bestPace', label: '최고 페이스', unit: '/km', icon: '<path d="M13 2 3 14h7l-1 8 10-12h-7z"/>', better: 'low', fmt: scSecToPace },
      { key: 'avgSpm', label: '평균 케이던스', unit: 'spm', icon: '<path d="M3 12h4l3 8 4-16 3 8h4"/>', better: 'high', fmt: v => v },
      { key: 'maxSpm', label: '최고 케이던스', unit: 'spm', icon: '<path d="M3 12h4l3 8 4-16 3 8h4"/>', better: 'high', fmt: v => v },
      { key: 'avgBpm', label: '평균 심박', unit: 'bpm', icon: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A3.5 3.5 0 0 0 12 5 3.5 3.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>', better: 'low', fmt: v => v },
      { key: 'maxBpm', label: '최고 심박', unit: 'bpm', icon: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A3.5 3.5 0 0 0 12 5 3.5 3.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>', better: 'none', fmt: v => v },
      { key: 'avgStride', label: '평균 보폭', unit: 'm', icon: '<path d="M3 6h18M3 6l3-3M3 6l3 3M21 18H3m18 0-3-3m3 3-3 3"/>', better: 'high', fmt: v => (v == null ? '--' : v.toFixed(2)) },
    ];

    function scStats(shoe) {
      const from = shoe.mileageFrom || '';
      const base = Number(shoe.baseMileage) || 0;
      // 착용 활동 = shoeId 가 이 신발인 모든 활동 (횟수·평균·최고 집계 기준)
      const acts = SC_ACTS.filter(a => {
        const m = (typeof getMeta === 'function') ? (getMeta(a.date) || {}) : {};
        return m.shoeId === shoe.id;
      });
      let km = 0, pS = 0, pN = 0, best = null, sS = 0, sN = 0, bS = 0, bN = 0, tS = 0, tN = 0, maxS = null, maxB = null;
      acts.forEach(a => {
        // 마일리지 합산만 기준일 이후 (기준 마일리지에 이전 거리가 이미 포함돼 있어 이중 계산 방지)
        if (!from || a.date >= from) km += a.km || 0;
        if (a.paceV) { pS += a.paceV; pN++; if (best == null || a.paceV < best) best = a.paceV; }
        if (a.spm) { sS += a.spm; sN++; }
        if (a.bpm) { bS += a.bpm; bN++; }
        if (a.stride) { tS += a.stride; tN++; }
        if (a.maxSpm && (maxS == null || a.maxSpm > maxS)) maxS = a.maxSpm;
        if (a.maxBpm && (maxB == null || a.maxBpm > maxB)) maxB = a.maxBpm;
      });
      return {
        id: shoe.id, name: shoe.name, image: shoe.image, runs: acts.length,
        acts: acts.slice().sort((a, b) => (a.date < b.date ? 1 : -1)),
        totalKm: Math.round(base + km),
        avgPace: pN ? Math.round(pS / pN) : null,
        bestPace: best,
        avgSpm: sN ? Math.round(sS / sN) : null,
        maxSpm: maxS,
        avgBpm: bN ? Math.round(bS / bN) : null,
        maxBpm: maxB,
        avgStride: tN ? (tS / tN) : null,
      };
    }

    function scEsc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    function renderCompare() {
      const body = document.getElementById('sc-body');
      if (!SC_SHOES.length) {
        body.innerHTML = `<div class="sc-empty-page">등록된 러닝화가 없습니다.<br><a onclick="goTo('shoes.html')">러닝화 등록하러 가기 ›</a></div>`;
        return;
      }
      // 슬롯의 통계 (빈 슬롯 포함, 최대 3)
      const canAdd = scSlots.length < 3 && scSlots.length < SC_SHOES.length;
      const cols = scSlots.length + (canAdd ? 1 : 0);
      const stats = scSlots.map(id => {
        const sh = SC_SHOES.find(s => s.id === id);
        return sh ? scStats(sh) : null;
      }).filter(Boolean);

      const gridCols = `grid-template-columns: repeat(${cols}, minmax(0,1fr));`;

      // 헤더 행
      let heads = `<div class="sc-heads" style="${gridCols}">`;
      stats.forEach((st, i) => {
        const img = st.image
          ? `<img class="sc-head-img" src="${st.image}" alt="">`
          : `<span class="sc-head-ph"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12s3-6 9-6 9 6 9 6" stroke-linecap="round"/></svg></span>`;
        heads += `<div class="sc-head-wrap">
          <div class="sc-head" onclick="openCmpPicker(${i})">
            ${img}
            <span class="sc-head-name">${scEsc(st.name)}</span>
          </div>
           
          ${scSlots.length > 1 ? `<div class="sc-head-remove" onclick="removeSlot(${i});event.stopPropagation();"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M0.707031 0.707092L8.70703 8.70709M8.70703 8.70709L16.707 16.7071M8.70703 8.70709L0.707031 16.7071M8.70703 8.70709L16.707 0.707092"/></svg></div>` : ''}
        </div>`;
      });
      if (canAdd) {
        heads += `<div class="sc-head sc-add" onclick="openCmpPicker(${scSlots.length})">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M24 8V40M8 24H40"/></svg>
        </div>`;
      }
      heads += `</div>`;

      // 지표 행들
      let rows = '';
      SC_METRICS.forEach(m => {
        const vals = stats.map(st => st[m.key]);
        const nums = vals.filter(v => v != null);
        let bestVal = null;
        if (nums.length && (m.better === 'low' || m.better === 'high')) bestVal = m.better === 'low' ? Math.min(...nums) : Math.max(...nums);
        let cells = `<div class="sc-vals" style="${gridCols}">`;
        vals.forEach(v => {
          if (v == null) { cells += `<div class="sc-val sc-empty">--</div>`; return; }
          const isBest = nums.length > 1 && v === bestVal;
          cells += `<div class="sc-val${isBest ? ' sc-best' : ''}">${m.fmt(v)}<u>${m.unit}</u></div>`;
        });
        if (canAdd) cells += `<div></div>`;
        cells += `</div>`;
        rows += `<div class="sc-metric">
          <div class="sc-metric-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${m.icon}</svg>${m.label}</div>
          ${cells}
        </div>`;
      });

      // 러닝화별 러닝 활동 — 어코디언 (헤더 탭 → 펼침/접힘, 편집 버튼 포함)
      let history = '';
      stats.forEach((st, si) => {
        if (!st.acts.length) return;
        const items = st.acts.map(a => {
          const meta = (typeof getMeta === 'function') ? (getMeta(a.date) || {}) : {};
          const nm = (meta.name && meta.name.trim()) || a.name || '러닝';
          return `<div class="sc-run" onclick="goTo('detail.html?date=${a.date}')">
            <span class="sc-run-date">${fmtDateDot(a.date)}</span>
            <span class="sc-run-name">${scEsc(nm)}</span>
            <span class="sc-run-km">${(a.km || 0).toFixed(1)} K</span>
            <span class="sc-run-pace">${a.pace || '--'}</span>
          </div>`;
        }).join('');
        history += `<div class="sc-acc${si === 0 ? ' open' : ''}">
          <div class="sc-acc-head" onclick="toggleAcc(this)">
            <span class="sc-acc-title">${scEsc(st.name)}<em>${st.runs}</em></span>
            <button class="sc-acc-edit" onclick="goTo('shoes.html?edit=${st.id}');event.stopPropagation();" aria-label="러닝화 편집">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
            </button>
            <span class="sc-acc-chev"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
          <div class="sc-acc-body">${items}</div>
        </div>`;
      });

      body.innerHTML = heads + rows + `<div class="sc-note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3a6 6 0 0 0-4 10.5V16h8v-2.5A6 6 0 0 0 12 3zM9 20h6M10 22h4"/></svg>액센트 = 지표별 더 나은 값 · 최고 페이스는 단일 활동 최고 평균</div>` + `<div class="sc-acc-list">${history}</div>`;
    }

    // 어코디언 펼침/접힘
    function toggleAcc(headEl) {
      const acc = headEl.closest('.sc-acc');
      if (acc) acc.classList.toggle('open');
    }

    function removeSlot(i) {
      scSlots.splice(i, 1);
      renderCompare();
    }

    // ── 러닝화 선택 시트 ──
    function openCmpPicker(slotIdx) {
      _scActiveSlot = slotIdx;
      const wrap = document.getElementById('sc-pick-list');
      wrap.innerHTML = SC_SHOES.map(s => {
        const inUse = scSlots.indexOf(s.id);
        const here = inUse === slotIdx;
        const disabledElsewhere = inUse >= 0 && inUse !== slotIdx;
        const km = scStats(s).totalKm;
        const img = s.image ? `<img class="sc-pick-img" src="${s.image}" alt="">`
          : `<span class="sc-pick-img"></span>`;
        return `<div class="sc-pick${here ? ' sc-picked' : ''}" style="${disabledElsewhere ? 'opacity:0.35;pointer-events:none;' : ''}" onclick="pickShoe('${s.id}')">
          ${img}<span class="sc-pick-name">${scEsc(s.name)}</span><span class="sc-pick-km">${km} K</span>
        </div>`;
      }).join('');
      document.getElementById('sc-backdrop').classList.add('open');
      const sheet = document.getElementById('sc-sheet');
      sheet.style.transition = ''; sheet.style.height = '';
      sheet.classList.add('open');
      const list = document.getElementById('sc-pick-list');
      const sh = document.getElementById('sc-sheet');
      const chrome = sh.querySelector('.sf-handle').offsetHeight + sh.querySelector('.sf-sheet-header').offsetHeight
        + (parseFloat(getComputedStyle(sh).paddingBottom) || 0);
      list.style.height = Math.max(120, Math.round(window.innerHeight * 0.5 - chrome)) + 'px';
    }

    function pickShoe(id) {
      if (_scActiveSlot < 0) return;
      if (_scActiveSlot >= scSlots.length) scSlots.push(id);
      else scSlots[_scActiveSlot] = id;
      closeCmpPicker();
      renderCompare();
    }

    function closeCmpPicker() {
      document.getElementById('sc-backdrop').classList.remove('open');
      document.getElementById('sc-sheet').classList.remove('open');
    }

    // 핸들 드래그로 시트 높이 조절 — 리스트 높이를 직접 변경 (다른 시트와 동일)
    (function () {
      const handle = document.querySelector('#sc-sheet .sf-handle');
      const list = document.getElementById('sc-pick-list');
      if (!handle || !list) return;
      let startY = 0, startH = 0, dragging = false;
      function down(e) {
        dragging = true;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startH = list.getBoundingClientRect().height;
        if (e.cancelable) e.preventDefault();
      }
      function move(e) {
        if (!dragging) return;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        let h = startH - (y - startY);          // 위로 끌면 커짐
        h = Math.max(40, Math.min(h, window.innerHeight * 0.9));
        list.style.height = h + 'px';
      }
      function up() {
        if (!dragging) return;
        dragging = false;
        if (list.getBoundingClientRect().height < 70) closeCmpPicker();
      }
      handle.addEventListener('touchstart', down, { passive: false });
      window.addEventListener('touchmove', move, { passive: false });
      window.addEventListener('touchend', up);
      handle.addEventListener('mousedown', down);
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', up);
    })();

    function scInit(list) {
      SC_ACTS = list || [];
      SC_SHOES = (typeof getShoes === 'function') ? getShoes() : [];
      scSlots = SC_SHOES.slice(0, 1).map(s => s.id);   // 기본은 1족, + 로 최대 3족 비교
      renderCompare();
    }

    if (typeof loadActivities === 'function') {
      loadActivities().then(scInit).catch(() => scInit([]));
    } else {
      scInit([]);
    }

    // 다른 탭과 동일한 접히는 대형 타이틀
    if (typeof setupCollapsingHeader === 'function') {
      setupCollapsingHeader(document.getElementById('sc-scroll'));
    }

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').then(function (r) { if (r) { setInterval(function () { r.update(); }, 60000); } }); (function () { var _rf = false; navigator.serviceWorker.addEventListener('controllerchange', function () { if (_rf) return; _rf = true; location.reload(); }); })(); }
  </script>
</body>
