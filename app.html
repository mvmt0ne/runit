  <style>
    /* ─── SPA 셸 ─── */
    .phone-inner {
      height: 100dvh;
      min-height: 100dvh;
      position: relative;
    }

    /* 스와이퍼는 phone-inner 전체를 채운다 — 탭바 뒤까지 확장 */
    .app-swiper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .app-swiper .swiper-wrapper {
      height: 100%;
    }

    .app-swiper .swiper-slide {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* 각 슬라이드는 페이지의 .phone-inner 콘텐츠를 직접 호스트 — 내부에서 100% 사용 */
    .app-swiper .swiper-slide>* {
      box-sizing: border-box;
    }

    .swiper-slide.loading {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      font-family: 'Pretendard Variable', sans-serif;
      font-size: 14px;
      opacity: 0.4;
    }

    .swiper-slide.loading::after {
      content: '로딩중...';
    }

    /* 슬라이드는 자체적으로 flex column 레이아웃을 가진다 (페이지의 .phone-inner 역할) */
    .swiper-slide:not(.loading) {
      display: flex;
      flex-direction: column;
    }

    /* ─── 스플래시 (앱 실행 시 로고 모션) ─── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #202020;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #splash.splash-hide {
      opacity: 0;
      pointer-events: none;
    }

    /* 러너 영상 — 소스로만 사용(화면엔 안 보임). 캔버스가 도트로 재구성 */
    #splash .sp-video {
      position: absolute;
      width: 2px;
      height: 2px;
      opacity: 0.001;
      pointer-events: none;
    }

    /* 도트-매트릭스 캔버스 — 러너 실루엣을 점으로 표현 */
    #splash .sp-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transform: scale(1.1);
      animation: sp-canvas-in 1s ease both, sp-canvas-zoom 3s cubic-bezier(0.16, 1, 0.3, 1) both;
      pointer-events: none;
    }

    /* 비네트 + 로고 뒤 소프트 스크림 → 가독성 */
    #splash .sp-scrim {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(38% 26% at 50% 50%, rgba(0, 0, 0, 0.55) 0%, transparent 70%),
        radial-gradient(115% 80% at 50% 46%, transparent 26%, rgba(0, 0, 0, 0.72) 100%);
    }

    #splash svg {
      position: relative;
      width: 220px;
      height: auto;
    }

    @keyframes sp-canvas-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes sp-canvas-zoom {
      from { transform: scale(1.1); }
      to   { transform: scale(1); }
    }

    #splash .sp-mark,
    #splash .sp-wm {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
    }

    #splash .sp-mark {
      fill: var(--accent);
      animation: sp-mark-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    #splash .sp-wm {
      fill: var(--bone);
      animation: sp-wm-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.32s both;
    }

    @keyframes sp-mark-in {
      from { opacity: 0; transform: translateY(-12px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes sp-wm-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .sp-mark,
      #splash .sp-wm {
        animation: sp-fade 0.3s ease both;
      }
      #splash .sp-wm { animation-delay: 0s; }
      @keyframes sp-fade { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>
</head>

  <!-- 액체 유리 SVG 필터 컨테이너 (liquid-glass.js 가 동적으로 채움) -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0"
    style="position:absolute;width:0;height:0;overflow:hidden" color-interpolation-filters="sRGB" aria-hidden="true">
    <defs id="svg-defs"></defs>
  </svg>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    (async function () {
      const TABS = ['home', 'list', 'stats', 'shoes'];

      /**
       * 페이지 CSS 를 portal 대상(modal/sheet 등)용 전역 룰과 슬라이드 한정 룰로 분리.
       * portal 대상 엘리먼트는 document.body 로 이동하기 때문에 @scope 안에 두면 스타일이 안 먹음.
       */
      const PORTAL_RE = /[.#](month-modal|month-sheet|sf-sheet|sf-handle|sf-grabber|sf-backdrop|sf-section|sf-divider|sf-reset|sf-apply|sf-sort|wheel-|month-list|month-item|filter-|sort-sheet|range-|zone-|ctrl-|sc-pick|sc-sheet)/;
      function splitPageCSS(css) {
        let depth = 0, buf = '', global = '', scoped = '';
        for (let i = 0; i < css.length; i++) {
          const c = css[i];
          buf += c;
          if (c === '{') depth++;
          else if (c === '}') {
            depth--;
            if (depth === 0) {
              if (PORTAL_RE.test(buf)) global += buf + '\n';
              else scoped += buf + '\n';
              buf = '';
            }
          }
        }
        if (buf.trim()) scoped += buf; // 잔여
        return { global, scoped };
      }

      /**
       * 각 탭 페이지(예: runit-home.html)를 fetch 해서:
       *   1. <head> <style> → @scope (.slide-<name>) 로 감싸 head에 주입 (격리)
       *      + portal 대상 셀렉터는 별도로 un-scoped 주입
       *   2. .phone-inner 콘텐츠 → 슬라이드 div 안에 직접 삽입
       *   3. <body> inline <script> → IIFE 로 감싸 body에 추가 (전역 격리)
       *   4. 모달/시트/백드롭 → document.body 로 portal 이동
       */
      async function loadSlide(slide) {
        if (!slide.dataset.src || slide.dataset.loaded === '1') return;
        slide.dataset.loaded = '1';

        const url = slide.dataset.src;
        const tab = slide.dataset.tab;
        const scope = `.slide-${tab}`;

        try {
          const html = await fetch(url).then(r => r.text());
          const doc = new DOMParser().parseFromString(html, 'text/html');

          // 1) 페이지 인라인 스타일 → portal 대상은 un-scoped, 나머지는 @scope 로 격리
          doc.querySelectorAll('head style').forEach(styleEl => {
            const css = styleEl.textContent || '';
            const { global, scoped: scopedCss } = splitPageCSS(css);

            if (scopedCss.trim()) {
              const ns = document.createElement('style');
              ns.textContent = `@scope (${scope}) {\n${scopedCss}\n}`;
              ns.dataset.fromSlide = tab;
              document.head.appendChild(ns);
            }
            if (global.trim()) {
              const ns = document.createElement('style');
              ns.textContent = global;
              ns.dataset.fromSlide = tab + ':global';
              document.head.appendChild(ns);
            }
          });

          // 2) 콘텐츠 주입 (.phone-inner 의 자식들을 슬라이드로 옮김)
          const phoneInner = doc.querySelector('.phone-inner');
          slide.classList.remove('loading');
          slide.innerHTML = phoneInner ? phoneInner.innerHTML : `<div style="padding:20px;color:#888">${url} 로드 실패</div>`;

          // 2.5) 페이지의 외부 데이터 스크립트(./data/*.js)를 전역 로드.
          //      (loadActivities/buildStatsData 등 데이터 의존성 — 인라인 부트스트랩 전에 필요)
          //      중복 방지(같은 src 재선언 에러 방지) + 문서 순서 보존.
          window.__appLoadedSrc = window.__appLoadedSrc || new Set();
          const extSrcs = [...doc.querySelectorAll('script[src]')]
            .map(s => s.getAttribute('src'))
            .filter(src => src && /\.\/data\//.test(src));
          for (const src of extSrcs) {
            if (window.__appLoadedSrc.has(src)) continue;
            window.__appLoadedSrc.add(src);
            await new Promise(res => {
              const sc = document.createElement('script');
              sc.src = src;
              sc.onload = res;
              sc.onerror = () => { console.error('[loadSlide] 외부 스크립트 로드 실패', src); res(); };
              document.head.appendChild(sc);
            });
          }

          // 3) 페이지의 inline script 들을 하나의 IIFE 로 묶어 실행 (전역 격리)
          //    + IIFE 안 top-level 함수 선언들은 window 에 expose
          //      (onclick="fn()" 같은 인라인 핸들러가 작동하려면 전역 노출 필요)
          const inlineCode = [...doc.querySelectorAll('body script:not([src])')]
            .map(s => s.textContent).join('\n;\n');
          if (inlineCode.trim()) {
            const fnNames = new Set();
            for (const m of inlineCode.matchAll(/^\s*function\s+(\w+)\s*\(/gm)) {
              fnNames.add(m[1]);
            }
            const exposeCode = [...fnNames]
              .map(n => `try{window.${n}=${n};}catch(e){}`).join('\n');
            const ns = document.createElement('script');
            ns.textContent = `;(function(){\n${inlineCode}\n${exposeCode}\n})();`;
            ns.dataset.fromSlide = tab;
            document.body.appendChild(ns);
          }

          // 4) 모달/백드롭/시트를 document.body 로 portal 이동.
          //    Swiper 슬라이드는 transform 이 걸려 있어 자식의 position:fixed 가
          //    슬라이드 박스에 갇힘 → 탭바를 못 덮음. body 직속으로 옮기면 viewport 기준 fixed 로 동작.
          slide.querySelectorAll('.sf-backdrop, .month-modal, .sf-sheet, .pb-sheet-backdrop, .pb-sheet').forEach(el => {
            el.dataset.portalFrom = tab;
            document.body.appendChild(el);
          });
        } catch (e) {
          console.error('[loadSlide]', tab, e);
          slide.classList.remove('loading');
          slide.innerHTML = `<div style="padding:20px;color:#f88">로드 실패: ${url}</div>`;
        }
      }

      const slides = [...document.querySelectorAll('.swiper-slide[data-src]')];
      const hash = (location.hash || '').replace('#', '');
      const initialIdx = Math.max(0, TABS.indexOf(hash));

      // 초기 슬라이드는 동기적으로 먼저 로드 (Swiper init 전에 콘텐츠 준비)
      await loadSlide(slides[initialIdx]);

      const swiper = new Swiper('#app-swiper', {
        initialSlide: initialIdx,
        slidesPerView: 1,
        spaceBetween: 0,
        threshold: 8,
        speed: 280,
        resistanceRatio: 0.5,
        longSwipesRatio: 0.25,
        touchAngle: 35,
        followFinger: true,
        // 내부 스와이프/드래그가 필요한 영역에선 SPA 스와이프 비활성화
        // - .calendar: 홈 캘린더 그리드만 (hero 영역은 SPA 스와이프 허용)
        // - .chart-swipe-wrap: 마일리지 주/월/년 차트 가로 스와이프
        // - .range-slider-wrap, input[type=range]: 리스트 거리/페이스 슬라이더
        // - .month-modal, .sf-sheet, .month-list, .wheel-col: 모달/시트 내부 스크롤
        noSwipingSelector: '.calendar, .chart-swipe-wrap, .range-slider-wrap, input[type="range"], .month-modal, .sf-sheet, .month-list, .wheel-col',
        on: {
          slideChange() {
            updateActiveTab(this.activeIndex);
            history.replaceState(null, '', '#' + TABS[this.activeIndex]);
            // 인접 슬라이드 미리 로드
            preloadNeighbors(this.activeIndex);
            // 탭 전환 시 chrome 표시 (auto-hide 상태 리셋)
            document.getElementById('app-tab-bar').classList.remove('chrome-hidden');
            document.querySelectorAll('.float-bar-wrap.chrome-hidden').forEach(el => {
              el.classList.remove('chrome-hidden');
            });
            // iOS Safari 리페인트 강제 — 다른 슬라이드(특히 PB의 3D/GPU 레이어)에서 넘어오면
            // 대상 슬라이드가 paint 안 되고 비어 보이는 합성 글리치가 있음(탭을 눌러야 보임).
            // 활성 슬라이드를 한 프레임 살짝 흔들어 강제로 다시 그리게 함.
            forceRepaint(this.slides[this.activeIndex]);
          },
          // 전환 완료 시점에도 한 번 더 (iOS는 transition 직후에야 paint가 필요한 경우가 있음)
          slideChangeTransitionEnd() {
            forceRepaint(this.slides[this.activeIndex]);
          }
        }
      });

      // iOS 합성 글리치 대응 — 레이아웃에 영향 없이 paint만 강제 트리거
      function forceRepaint(el) {
        if (!el) return;
        el.style.transform = 'translateZ(0)';
        void el.offsetHeight; // reflow
        requestAnimationFrame(() => { el.style.transform = ''; });
      }

      function updateActiveTab(idx) {
        document.querySelectorAll('#app-tab-bar [data-idx]').forEach(el => {
          el.classList.toggle('active', parseInt(el.dataset.idx) === idx);
        });
        // 홈(idx 0)에서만 어두운 탭바
        document.getElementById('app-tab-bar').classList.toggle('tabbar-dark', idx === 0);
      }

      function preloadNeighbors(idx) {
        [idx - 1, idx + 1].forEach(i => {
          if (i >= 0 && i < slides.length) loadSlide(slides[i]);
        });
      }

      document.querySelectorAll('#app-tab-bar [data-idx]').forEach(el => {
        el.addEventListener('click', e => {
          e.preventDefault();
          swiper.slideTo(parseInt(el.dataset.idx));
        });
      });

      updateActiveTab(initialIdx);
      preloadNeighbors(initialIdx);

      // 외부에서 hash 바뀌면 슬라이드 동기화
      window.addEventListener('hashchange', () => {
        const h = (location.hash || '').replace('#', '');
        const idx = TABS.indexOf(h);
        if (idx >= 0 && idx !== swiper.activeIndex) swiper.slideTo(idx);
      });

      // goTo 가로채기 — 탭 페이지로의 이동은 SPA 밖으로 나가지 않고 탭 전환
      const TAB_PAGES = { 'runit-home.html': 'home', 'list.html': 'list', 'stats.html': 'stats', 'shoe-compare.html': 'shoes' };
      const _origGoTo = window.goTo;
      window.goTo = function (url) {
        const base = String(url).split(/[?#]/)[0].replace(/^\.\//, '');
        const tab = TAB_PAGES[base];
        if (tab != null) {
          const idx = TABS.indexOf(tab);
          if (idx >= 0) {
            loadSlide(slides[idx]);
            swiper.slideTo(idx);
            return;
          }
        }
        return _origGoTo ? _origGoTo(url) : (location.href = url);
      };

      // 백그라운드에서 나머지 슬라이드 lazy 로드
      setTimeout(() => {
        slides.forEach((s, i) => { if (i !== initialIdx) loadSlide(s); });
      }, 600);

      // 탭바: 풀폭 솔리드 + concave 코너 디자인 (액체 유리 미적용)
    })();
  </script>

  <script>
    // 스플래시 — 세션당 1회(앱 실행 시)만 모션. 이후 재로드(PTR 등)에선 즉시 제거해 깜빡임 방지.
    (function () {
      var sp = document.getElementById('splash');
      if (!sp) return;
      if (sessionStorage.getItem('splashShown')) { sp.remove(); return; }
      sessionStorage.setItem('splashShown', '1');

      // ── 러너를 도트-매트릭스로 재구성 (밝기→도트 크기 + 딥블루→화이트→accent 스펙트럼) ──
      var video = document.getElementById('sp-video');
      var canvas = document.getElementById('sp-canvas');
      var rafId = 0;
      if (video && canvas && canvas.getContext) {
        var ctx = canvas.getContext('2d');
        var CELL = 11;                 // 도트 간격(px)
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var cols = 0, rows = 0;
        var oc = document.createElement('canvas');
        var octx = oc.getContext('2d', { willReadFrequently: true });

        function resize() {
          var w = sp.clientWidth, h = sp.clientHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          cols = Math.ceil(w / CELL); rows = Math.ceil(h / CELL);
          oc.width = cols; oc.height = rows;
        }
        resize();
        window.addEventListener('resize', resize);

        // object-fit: cover 로 비디오를 그리드 해상도에 다운스케일
        function drawCover() {
          var vw = video.videoWidth, vh = video.videoHeight;
          if (!vw || !vh) return false;
          var scale = Math.max(cols / vw, rows / vh);
          var dw = vw * scale, dh = vh * scale;
          octx.drawImage(video, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
          return true;
        }

        // 밝기 → 색 (딥블루 → 화이트 → accent 레드)
        function ramp(t) { // t: 0~1
          var a = [10, 22, 48], b = [235, 238, 245], c = [15, 255, 84];
          var p, q, k;
          if (t < 0.55) { k = t / 0.55; p = a; q = b; }
          else { k = (t - 0.55) / 0.45; p = b; q = c; }
          var r = Math.round(p[0] + (q[0] - p[0]) * k);
          var g = Math.round(p[1] + (q[1] - p[1]) * k);
          var bl = Math.round(p[2] + (q[2] - p[2]) * k);
          return 'rgb(' + r + ',' + g + ',' + bl + ')';
        }

        function frame() {
          rafId = requestAnimationFrame(frame);
          if (!drawCover()) return;
          var data = octx.getImageData(0, 0, cols, rows).data;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (var y = 0; y < rows; y++) {
            for (var x = 0; x < cols; x++) {
              var i = (y * cols + x) * 4;
              var lum = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
              if (lum < 0.08) continue;                 // 어두운 배경은 비움 → 실루엣
              var rad = 0.6 + lum * (CELL * 0.62);      // 밝을수록 큰 도트
              ctx.fillStyle = ramp(lum);
              ctx.beginPath();
              ctx.arc(x * CELL + CELL / 2, y * CELL + CELL / 2, rad, 0, 6.2832);
              ctx.fill();
            }
          }
        }
        video.play().catch(function () {});
        frame();
      }

      var HOLD = 3000;  // 러너 도트 모션 + 로고 (약 3s)
      setTimeout(function () {
        sp.classList.add('splash-hide');
        function done() { if (rafId) cancelAnimationFrame(rafId); if (sp.parentNode) sp.remove(); }
        sp.addEventListener('transitionend', done, { once: true });
        setTimeout(done, 800); // 폴백
      }, HOLD);
    })();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(function(r){ if(r){ setInterval(function(){ r.update(); }, 60000); } }); (function(){ var _rf=false; navigator.serviceWorker.addEventListener('controllerchange', function(){ if(_rf) return; _rf=true; location.reload(); }); })();
    }
  </script>
