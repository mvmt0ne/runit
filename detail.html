<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>runit — 활동 상세</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#222222">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="runit">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./transitions.js"></script>
  <style>
    .detail-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--asphalt-black);
      position: relative;
    }

    /* 상단 고정 헤더 — 콘텐츠 위에 투명하게 떠 있음 */
    .detail-page .back-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 25;
      background: transparent;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      pointer-events: none;
    }

    /* 버튼만 클릭 가능 (투명 헤더는 스크롤 통과) */
    .detail-page .back-header .back-btn,
    .detail-page .back-header .header-action-btn {
      pointer-events: auto;
    }

    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      /* 떠 있는 투명 헤더/하단 탭바 뒤로 콘텐츠가 가리지 않도록 여백 */
      padding-top: calc(env(safe-area-inset-top, 0px) + 50px);
      padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    }

    .detail-scroll::-webkit-scrollbar {
      display: none;
    }

    /* ─── Hero ─── */
    .d-hero {
      padding: 20px 20px 24px;
      background: var(--asphalt-black);
    }

    .d-meta-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .d-date {
      font-size: 13px;
      font-family: 'Urbanist', sans-serif;
      color: var(--cloudy-gray);
    }

    .d-type-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: 'Pretendard Variable', sans-serif;
    }

    .d-name {
      font-size: 30px;
      font-weight: 500;
      color: var(--bone);
      line-height: 1.1;
      margin: 0;
      font-family: 'Pretendard Variable', sans-serif;
    }

    .d-km-row {
      margin-top: 18px;
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
    }

    .d-km {
      font-size: 64px;
      font-weight: 300;
      color: var(--bone);
      line-height: 1;
      font-family: 'Urbanist', sans-serif;
      letter-spacing: -1px;
    }

    .d-km sup {
      font-size: 18px;
      font-weight: 400;
      color: var(--slate-gray);
      margin-left: 2px;
    }

    .d-km-side {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .d-km-side-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .d-km-side-val {
      font-size: 20px;
      font-weight: 400;
      color: var(--bone);
      font-family: 'Urbanist', sans-serif;
    }

    .d-km-side-label {
      font-size: 11px;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ─── Card ─── */
    .d-card {
      background: var(--dark-gray);
      padding: 18px 20px;
    }

    /* 카드 사이 구분선 (하단 여백은 통일, 카드끼리만 라인) */
    .d-card+.d-card {
      border-top: 1px solid var(--asphalt-black);
    }

    .d-card-title {
      font-size: 20px;
      font-weight: 300;
      color: var(--slate-gray);
      margin-bottom: 24px;
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ─── 온도 (hero) ─── */
    .d-temp {
      font-size: 13px;
      color: var(--cloudy-gray);
      font-family: 'Urbanist', sans-serif;
    }

    /* ─── 평균 대비 비교 카드 ─── */
    .d-compare-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 9px 0;
    }

    .d-compare-row+.d-compare-row {
      border-top: 1px solid rgba(0, 0, 0, 0.06);
    }

    .d-compare-label {
      flex: 1;
      font-size: 14px;
      color: var(--slate-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .d-compare-val {
      font-size: 18px;
      color: var(--bone);
      font-family: 'Urbanist', sans-serif;
    }

    .d-compare-val i {
      font-style: normal;
      font-size: 11px;
      color: var(--cloudy-gray);
      margin-left: 2px;
    }

    .d-compare-delta {
      min-width: 70px;
      text-align: right;
      font-size: 13px;
      font-family: 'Urbanist', sans-serif;
      color: var(--cloudy-gray);
    }

    .d-compare-delta.cmp-good {
      color: var(--accent);
    }

    .d-compare-delta.cmp-bad {
      color: var(--cloudy-gray);
    }

    /* ─── 최근 러닝 목록 ─── */
    .d-recent-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 0;
      cursor: pointer;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .d-recent-row:first-child {
      border-top: none;
    }

    .d-recent-row:active {
      opacity: 0.55;
    }

    .d-recent-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--cloudy-gray);
    }

    .d-recent-dot.type-race {
      background: var(--type-race-text);
    }

    .d-recent-dot.type-tempo,
    .d-recent-dot.type-interval,
    .d-recent-dot.type-tt {
      background: var(--type-dark-bg);
    }

    .d-recent-dot.type-easy {
      background: var(--type-easy-bg);
    }

    .d-recent-dot.type-jogging {
      background: var(--type-jog-bg);
    }

    .d-recent-dot.type-long {
      background: var(--type-long-bg);
    }

    .d-recent-date {
      width: 38px;
      flex-shrink: 0;
      font-size: 13px;
      color: var(--cloudy-gray);
      font-family: 'Urbanist', sans-serif;
    }

    .d-recent-name {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      color: var(--bone);
      font-family: 'Pretendard Variable', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .d-recent-km,
    .d-recent-pace {
      flex-shrink: 0;
      font-size: 13px;
      font-family: 'Urbanist', sans-serif;
      color: var(--slate-gray);
    }

    .d-recent-km {
      width: 48px;
      text-align: right;
    }

    .d-recent-pace {
      width: 48px;
      text-align: right;
      color: var(--cloudy-gray);
    }

    .d-recent-list {
      gap: 12px;
    }

    /* ─── 메모 ─── */
    .d-note {
      font-size: 15px;
      line-height: 1.6;
      color: var(--asphalt-black);
      font-family: 'Pretendard Variable', sans-serif;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ─── Stats grid ─── */
    .d-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 12px;
    }

    .d-stat {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .d-stat-value {
      font-size: 18px;
      font-weight: 400;
      color: var(--bone);
      font-family: 'Urbanist', sans-serif;
      font-feature-settings: "tnum";
      line-height: 1;
    }

    .d-stat-value sup {
      font-size: 11px;
      font-weight: 400;
      color: var(--cloudy-gray);
      margin-left: 2px;
    }

    .d-stat-label {
      font-size: 12px;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ─── Hero 신발 (누끼컷) ─── */
    .d-hero-shoe {
      position: relative;
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
    }

    /* 받침대 글로우 */
    .d-hero-shoe::before {
      content: '';
      position: absolute;
      left: 8px;
      bottom: -6px;
      width: 150px;
      height: 30px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.45) 0%, transparent 70%);
      filter: blur(2px);
      z-index: 0;
    }

    .d-hero-shoe-img {
      position: relative;
      z-index: 1;
      width: 160px;
      max-height: 100px;
      object-fit: contain;
      transform: rotate(-7deg);
      filter: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.55));
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .d-hero-shoe:active .d-hero-shoe-img {
      transform: rotate(-7deg) scale(0.96);
    }

    .d-hero-shoe-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 1;
    }

    .d-hero-shoe-label {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .d-hero-shoe-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--bone);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .d-hero-shoe-add {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 100px;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      background: transparent;
      color: var(--cloudy-gray);
      font-size: 14px;
      font-family: 'Pretendard Variable', sans-serif;
      cursor: pointer;
    }

    .d-hero-shoe-add:active {
      background: rgba(255, 255, 255, 0.05);
    }

    /* ─── 신발 선택 시트 (롤링) ─── */
    .shoe-sheet-backdrop {
      position: fixed;
      top: calc(-1 * env(safe-area-inset-top, 0px));
      left: 0;
      right: 0;
      bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
      background: rgba(9, 9, 9, 0.45);
      backdrop-filter: blur(50px) saturate(100%);
      -webkit-backdrop-filter: blur(50px) saturate(100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 60;
    }

    .shoe-sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .shoe-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 61;
      background: var(--bg-modal);
      border-radius: 16px 16px 0 0;
      padding: 18px 0 calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .shoe-sheet.open {
      transform: translateY(0);
    }

    .shoe-sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      margin-bottom: 16px;
    }

    .shoe-sheet-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--bone);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .shoe-sheet-add {
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      font-family: 'Pretendard Variable', sans-serif;
      padding: 7px 14px;
      border-radius: 100px;
      cursor: pointer;
    }

    .shoe-sheet-add:active {
      background: rgba(255, 255, 255, 0.16);
    }

    .shoe-sheet-actions {
      display: flex;
      gap: 8px;
    }

    .shoe-carousel {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 0 32px 8px;
      scrollbar-width: none;
    }

    .shoe-carousel::-webkit-scrollbar {
      display: none;
    }

    .shoe-card {
      flex: 0 0 62%;
      scroll-snap-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .shoe-card.selected {
      background: var(--accent);
    }

    .shoe-card-img {
      width: 100%;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5));
    }

    .shoe-card-name {
      font-size: 16px;
      color: var(--slate-gray);
      font-family: 'Pretendard Variable', sans-serif;
      text-align: center;
    }

    .shoe-sheet-empty {
      text-align: center;
      color: var(--cloudy-gray);
      font-size: 13px;
      font-family: 'Pretendard Variable', sans-serif;
      padding: 20px;
    }

    .shoe-sheet-empty a {
      color: var(--accent);
      cursor: pointer;
    }

    /* ─── Empty / error ─── */
    .d-empty {
      padding: 24px 20px;
      text-align: center;
      color: var(--cloudy-gray);
      font-size: 13px;
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ─── Type badge colors (styles.css 의 type-* 변수 사용) ─── */
    .d-type-badge.type-race {
      background: var(--type-race-bg);
      color: var(--type-race-text);
    }

    .d-type-badge.type-tempo,
    .d-type-badge.type-interval,
    .d-type-badge.type-tt {
      background: var(--type-dark-bg);
      color: var(--type-dark-text);
    }

    .d-type-badge.type-steady {
      background: var(--type-steady-bg);
      color: var(--type-steady-text);
    }

    .d-type-badge.type-easy {
      background: var(--type-easy-bg);
      color: var(--type-easy-text);
    }

    .d-type-badge.type-jogging {
      background: var(--type-jog-bg);
      color: var(--type-jog-text);
    }

    .d-type-badge.type-long {
      background: var(--type-long-bg);
      color: var(--type-long-text);
    }

    /* ══════════════════════════════════════
       새 상세 디자인 (nd-)
    ══════════════════════════════════════ */
    .d-edit-btn {
      font-size: 14px;
      font-weight: 400;
      font-family: 'Pretendard Variable', sans-serif;
      color: var(--slate-gray);
      width: auto;
    }

    .nd {
      padding: 20px 0;
      color: var(--cloudy-gray);
    }

    /* 좌우 여백은 상단/히어로/요약에만 (평균기록·prev/next는 꽉 채움) */
    .nd-top,
    .nd-hero,
    .nd-divider,
    .nd-summary {
      padding-left: 20px;
      padding-right: 20px;
    }

    .nd-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      color: var(--slate-gray);
    }

    /* 브랜드 로고 — 등록 색상 무시하고 cloudy-gray 단색으로 마스킹 */
    .nd-brand-logo {
      display: block;
      height: 16px;
      width: 120px;
      background: var(--cloudy-gray);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: left center;
      mask-position: left center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .nd-weather {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-family: 'Urbanist', sans-serif;
    }

    /* 히어로 — 신발 모델명(고스트) + 신발 이미지 겹침 */
    .nd-hero {
      position: relative;
      cursor: pointer;
      padding-bottom: 8px;
    }

    .nd-title {
      font-size: 64px;
      line-height: 0.92;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: rgb(218, 218, 218, 0.2);
      text-transform: uppercase;
      margin: 0;
      word-break: break-word;
      position: relative;
      z-index: 0;
    }

    /* ─── 러닝화 미선택 상태 ─── */
    .nd-hero-empty {
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 28px 20px 20px;
    }

    .nd-shoe-ghost {
      width: 62%;
      max-width: 280px;
      height: auto;
      color: rgba(218, 218, 218, 0.22);
    }

    .nd-add-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      background: transparent;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s, transform 0.18s;
    }

    .nd-add-btn svg {
      width: 24px;
      height: 24px;
    }

    .nd-hero-empty:active .nd-add-btn {
      background: rgba(255, 90, 54, 0.12);
      transform: scale(0.94);
    }

    .nd-empty-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--slate-gray);
      letter-spacing: 0.02em;
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* 래퍼: 크기/위치만 (transform·filter 없음 → 자식 그림자를 자르지 않음) */
    .nd-shoe-wrap {
      display: block;
      width: 75%;
      margin: -14px auto -40px;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    /* 그림자 — filter(drop-shadow)를 transform 없는 래퍼에 적용.
       회전은 자식 img 에만 → iOS 의 "transform+filter 동일요소 박스 클립" 버그 회피.
       실루엣을 따르는 실제 그림자라 신발 뒤로 가려지지 않고 보임. */
    .nd-shoe-inner {
      display: block;
      filter: drop-shadow(0 22px 22px rgba(0, 0, 0, 0.75));
      animation: shoe-blur 1.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes shoe-blur {
      0% {
        filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.75)) blur(22px) contrast(1.4);
      }

      100% {
        filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.75)) blur(0) contrast(1);
      }
    }

    .nd-shoe {
      display: block;
      width: 100%;
      transform: rotate(-35deg);
      animation: shoe-develop 1.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* 현상 리빌 — 확대·페이드 (회전 유지, filter 없음) */
    @keyframes shoe-develop {
      0% {
        opacity: 0;
        transform: rotate(-35deg) scale(1.08);
      }

      35% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform: rotate(-35deg) scale(1);
      }
    }

    /* 인터레이스 스캔라인 — 이미지 위 오버레이(마스킹 아님). 이미지와 동일하게 회전시켜 정렬 */
    @property --sv {
      syntax: '<length>';
      inherits: false;
      initial-value: 0px;
    }

    .nd-shoe-scan {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      transform: rotate(-35deg);
      --sv: 9px;
      background: repeating-linear-gradient(to bottom, var(--asphalt-black) 0, var(--asphalt-black) var(--sv), transparent var(--sv), transparent 9px);
      animation: shoe-scan 1.05s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes shoe-scan {
      from {
        --sv: 9px;
      }

      to {
        --sv: 0px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .nd-shoe-inner {
        animation: none;
        filter: drop-shadow(0 22px 22px rgba(0, 0, 0, 0.75));
      }

      .nd-shoe {
        animation: none;
        transform: rotate(-35deg);
      }

      .nd-shoe-scan {
        display: none;
      }
    }

    .nd-mileage {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      margin-top: -8px;
    }

    .nd-mileage-label {
      font-size: 13px;
      color: var(--cloudy-gray);
      font-family: 'Urbanist', sans-serif;
    }

    .nd-mileage-val {
      font-size: 18px;
      font-weight: 900;
      font-family: 'Urbanist', sans-serif;
    }

    .nd-mileage-val em {
      font-style: normal;
    }

    .nd-stat-val em,
    .nd-avg-val em {
      font-style: normal;
      font-size: 0.5em;
      vertical-align: super;
      margin-left: 2px;
    }

    .nd-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 18px 20px 8px;
      padding: 0 !important;
    }

    /* 요약 — 좌 활동명 / 우 스탯 스택 */
    .nd-summary {
      display: flex;
      gap: 20px;
    }

    .nd-actname {
      flex: 1;
      min-width: 0;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .nd-stats {
      flex: 0 0 46%;
      display: flex;
      flex-direction: column;
    }

    .nd-stat {
      padding: 4px 0 14px;
    }

    .nd-stat+.nd-stat {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 14px;
    }

    .nd-stat-val {
      display: block;
      font-size: 20px;
      font-weight: 500;
      font-family: 'Urbanist', sans-serif;
    }

    .nd-stat-label {
      font-size: 12px;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* 평균 기록 카드 */
    .nd-avg {
      margin-top: 26px;
      padding: 24px 22px 10px;
      background: var(--dark-gray);
    }

    .nd-avg-title {
      font-size: 20px;
      font-weight: 300;
      color: var(--slate-gray);
      font-family: 'Pretendard Variable', sans-serif;
      margin-bottom: 8px;
    }

    .nd-avg-row {
      display: flex;
      align-items: baseline;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .nd-avg-row:last-child {
      border-bottom: none;
    }

    .nd-avg-label {
      flex: 1;
      font-size: 15px;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .nd-avg-val {
      font-size: 18px;
      font-weight: 500;
      font-family: 'Urbanist', sans-serif;
      color: var(--slate-gray);
    }

    .nd-avg-delta {
      width: 64px;
      text-align: right;
      font-size: 12px;
      font-weight: 500;
      color: var(--cloudy-gray);
      font-family: 'Urbanist', sans-serif;
    }

    /* 평균보다 높을 때만 포인트 컬러 */
    .nd-avg-delta.is-higher {
      color: var(--accent);
    }

    /* 콘텐츠 전환 애니메이션 (이전/다음 시) */
    .d-body-in {
      animation: d-body-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes d-body-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ─── 하단 고정 탭바: 이전 · 목록 · 다음 ─── */
    /* 홈 탭바와 동일 스타일 — 콘텐츠 위에 떠 있는 투명 바 + 다크 글래스 알약 */
    .d-tabbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
      background: transparent;
      pointer-events: none;
    }

    .d-tab {
      pointer-events: auto;
    }

    /* 홈 화면 탭바(.tab-bar.tabbar-dark .tab-item)와 컬러·사이즈 동일한 다크 글래스 알약 */
    .d-tab {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      /* 홈 알약(tab-item 패딩8·14 + tab-icon 30px) 총 크기 58×46 과 동일하게 (아이콘 28px 기준) */
      padding: 9px 15px;
      border: none;
      border-radius: 8px;
      background: rgba(28, 28, 28, 0.55);
      backdrop-filter: blur(12px) saturate(140%);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      color: var(--slate-gray);
      font-family: 'Pretendard Variable', sans-serif;
      cursor: pointer;
      transition: background 0.25s, opacity 0.2s;
    }

    /* 아이콘 — 홈 .tab-icon(30px 박스, svg 28px)과 동일 */
    .d-tab svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    .d-tab:active {
      background: rgba(70, 70, 70, 0.7);
    }

    .d-tab:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* 가운데 목록 버튼 — 홈 탭바 활성 알약과 동일 */
    .d-tab-list {
      color: var(--bone);
      background: rgba(70, 70, 70, 0.7);
    }
  </style>
</head>

<body>
  <div class="phone">
    <div class="phone-inner bg-dark" style="background: var(--asphalt-black);">
      <div class="detail-page">
        <div class="back-header back-header--dark">
          <button class="back-btn" onclick="goBackSmart()" aria-label="닫기">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
          <span class="back-title" id="d-header-date">활동 상세</span>
          <button class="header-action-btn d-edit-btn" onclick="goEdit()" aria-label="수정">Edit</button>
        </div>

        <div class="detail-scroll" id="detail-scroll">
          <div id="detail-body">
            <div class="d-empty">불러오는 중…</div>
          </div>
        </div>

        <!-- 하단 고정 탭바: 이전 · 목록 · 다음 -->
        <div class="d-tabbar">
          <button class="d-tab" id="d-prev" onclick="navDetail(_prevDate)">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5" />
              <path d="m12 19-7-7 7-7" />
            </svg>
          </button>
          <button class="d-tab d-tab-list" onclick="goTo('app.html#list')">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6" />
              <line x1="8" y1="12" x2="21" y2="12" />
              <line x1="8" y1="18" x2="21" y2="18" />
              <circle cx="4" cy="6" r="1" />
              <circle cx="4" cy="12" r="1" />
              <circle cx="4" cy="18" r="1" />
            </svg>
          </button>
          <button class="d-tab" id="d-next" onclick="navDetail(_nextDate)">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 신발 선택 시트 (롤링) -->
  <div class="shoe-sheet-backdrop" id="shoe-backdrop" onclick="closeShoePicker()"></div>
  <div class="shoe-sheet" id="shoe-sheet">
    <div class="shoe-sheet-head">
      <span class="shoe-sheet-title">러닝화 선택</span>
      <div class="shoe-sheet-actions">
        <button class="shoe-sheet-add" onclick="goEditShoe()">편집</button>
        <button class="shoe-sheet-add" onclick="goTo('shoes.html')">+ 등록</button>
      </div>
    </div>
    <div id="shoe-carousel-wrap"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
  <script src="./data/cloud.js"></script>
  <script src="./data/store.js"></script>
  <script src="./data/activities.js"></script>
  <script>
    const _qs = new URLSearchParams(location.search);
    let _date = _qs.get('date');
    let _curShoeId = null;
    let _prevDate = null, _nextDate = null;

    function goEdit() {
      goTo(`input.html?date=${_date || ''}`);
    }

    // 이전/다음 활동으로 — 제자리 전환(history 미적립). 탭바 고정.
    function navDetail(date) {
      if (!date) return;
      _date = date;
      history.replaceState(null, '', 'detail.html?date=' + date);
      const sc = document.getElementById('detail-scroll');
      if (sc) sc.scrollTop = 0;
      render();
    }

    // 하단 탭바 이전/다음 버튼 활성 상태 갱신
    function updateDetailTabbar() {
      const p = document.getElementById('d-prev');
      const n = document.getElementById('d-next');
      if (p) p.disabled = !_prevDate;
      if (n) n.disabled = !_nextDate;
    }

    // 현재 신발 편집 화면으로 (없으면 러닝화 관리로)
    function goEditShoe() {
      goTo(_curShoeId ? `shoes.html?edit=${_curShoeId}` : 'shoes.html');
    }

    // 뒤로 — 들어온 화면(홈/리스트 등)으로 복귀
    function goBackSmart() {
      if (window.history.length > 1) { history.back(); return; }
      goBack('app.html#list');
    }

    async function render() {
      const list = await loadActivities();
      if (!list.length) {
        document.getElementById('detail-body').innerHTML =
          '<div class="d-empty">활동 데이터가 없습니다.<br>data/activities.csv 를 확인하세요.</div>';
        return;
      }
      if (!_date) _date = list[0].date;

      const act = list.find(a => a.date === _date);
      if (!act) {
        document.getElementById('detail-body').innerHTML =
          `<div class="d-empty">${_date} 활동을 찾을 수 없습니다.</div>`;
        return;
      }

      const meta = (typeof getMeta === 'function') ? (getMeta(_date) || {}) : {};
      const body = document.getElementById('detail-body');
      body.innerHTML = renderHTML(act, meta, list);
      updateDetailTabbar();
      // 전환 애니메이션 (팝업 느낌)
      body.classList.remove('d-body-in');
      void body.offsetWidth;
      body.classList.add('d-body-in');
      fetchRealTemp(_date, meta.startTime || act.startTime);
    }

    // 초→"M:SS"
    function secToPace(sec) {
      const t = Math.round(sec);
      return `${Math.floor(t / 60)}:${String(Math.abs(t) % 60).padStart(2, '0')}`;
    }
    function avgOf(list, key) {
      const vals = list.map(a => a[key]).filter(v => v != null && !isNaN(v));
      return vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : null;
    }
    // 평균 대비 비교 행
    function compareRow(label, val, unit, avg, opts) {
      if (val == null || avg == null) return '';
      const lowerBetter = opts && opts.lowerBetter;
      const isPace = opts && opts.pace;
      const diff = val - avg;
      const better = lowerBetter ? diff < 0 : diff > 0;
      const arrow = diff === 0 ? '·' : diff < 0 ? '▼' : '▲';
      const diffStr = isPace ? secToPace(Math.abs(diff)) : Math.abs(Math.round(diff * 10) / 10);
      const valStr = isPace ? secToPace(val) : (Math.round(val * 10) / 10);
      const cls = diff === 0 ? '' : (better ? 'cmp-good' : 'cmp-bad');
      return `<div class="d-compare-row">
        <span class="d-compare-label">${label}</span>
        <span class="d-compare-val">${valStr}<i>${unit}</i></span>
        <span class="d-compare-delta ${cls}">${arrow} ${diffStr}</span>
      </div>`;
    }
    // 러닝한 시각의 실제 기온 — open-meteo 시간별 조회 (홈 저장 좌표, 시각별 캐시)
    async function fetchRealTemp(date, startTime) {
      const el = document.getElementById('d-temp');
      if (!el || !date) return;
      const hh = (startTime && /^\d{1,2}:/.test(startTime)) ? String(parseInt(startTime)).padStart(2, '0') : '12'; // 시각 없으면 정오
      const cacheKey = `${date}T${hh}`;
      let cache = {};
      try { cache = JSON.parse(localStorage.getItem('runit-wxtemp') || '{}'); } catch (e) { }
      if (cache[cacheKey]) { el.textContent = String(cache[cacheKey]).replace(/[^\d.\-°]/g, '').trim(); return; }
      let coords;
      try { coords = JSON.parse(localStorage.getItem('runit-coords')); } catch (e) { }
      // 저장된 좌표 없으면 직접 위치 요청 (허용 시 저장)
      if (!coords || coords.lat == null) {
        if (!navigator.geolocation) return;
        try {
          const pos = await new Promise((res, rej) =>
            navigator.geolocation.getCurrentPosition(res, rej, { timeout: 8000, maximumAge: 6e5 }));
          coords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
          localStorage.setItem('runit-coords', JSON.stringify(coords));
        } catch (e) { return; } // 거부/실패 시 온도 미표시
      }
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const daysAgo = Math.round((today - new Date(date + 'T00:00:00')) / 86400000);
      // 최근(아카이브 지연 고려)은 forecast, 과거는 archive
      const base = daysAgo <= 10 ? 'https://api.open-meteo.com/v1/forecast' : 'https://archive-api.open-meteo.com/v1/archive';
      const url = `${base}?latitude=${coords.lat}&longitude=${coords.lon}&start_date=${date}&end_date=${date}&hourly=temperature_2m&timezone=auto`;
      try {
        const j = await fetch(url).then(r => r.json());
        const times = j.hourly && j.hourly.time;
        const temps = j.hourly && j.hourly.temperature_2m;
        if (!times || !temps) return;
        let idx = times.indexOf(`${date}T${hh}:00`);
        if (idx < 0) idx = times.indexOf(`${date}T12:00`);
        const t = idx >= 0 ? temps[idx] : null;
        if (t == null) return;
        const txt = `${Math.round(t)}°`;
        el.textContent = txt;
        cache[cacheKey] = txt;
        try { localStorage.setItem('runit-wxtemp', JSON.stringify(cache)); } catch (e) { }
      } catch (e) { /* ignore */ }
    }

    // 평균 대비 행 (심박/케이던스/보폭/접지)
    function ndAvgRow(label, val, unit, avg) {
      if (val == null || val === '' || isNaN(val)) return '';
      let delta = '';
      if (avg != null && avg !== 0) {
        const pct = ((val - avg) / avg) * 100;
        const arrow = Math.abs(pct) < 0.05 ? '·' : (pct < 0 ? '▼' : '▲');
        const higher = pct >= 0.05;
        delta = `<span class="nd-avg-delta${higher ? ' is-higher' : ''}">${arrow} ${Math.abs(Math.round(pct * 10) / 10)}</span>`;
      }
      return `<div class="nd-avg-row">
        <span class="nd-avg-label">${label}</span>
        <span class="nd-avg-val">${Math.round(val)}<em>${unit}</em></span>
        ${delta}
      </div>`;
    }

    function renderHTML(act, meta, list) {
      list = list || [];
      const displayName = (meta.name && meta.name.trim()) || act.name || '러닝';

      // 헤더 중앙: 날짜 · 시각
      const timeStr = meta.startTime || act.startTime || '';
      const headerDate = (act.date || '').replace(/-/g, '.') + (timeStr ? ' · ' + timeStr : '');
      const hd = document.getElementById('d-header-date');
      if (hd) hd.textContent = headerDate;

      // 신발
      const shoeObj = (meta.shoeId && typeof getShoe === 'function') ? getShoe(meta.shoeId) : null;
      _curShoeId = shoeObj ? shoeObj.id : null;
      const shoeImg = shoeObj ? shoeObj.image : (meta.shoe || null);
      const shoeName = shoeObj ? shoeObj.name : '';
      const noShoe = !shoeObj && !shoeImg;

      // 신발 마일리지 — 기준 마일리지 + 시작일 이후 이 신발 활동 km 자동 합산
      let shoeMileage = null;
      if (shoeObj) {
        const base = Number(shoeObj.baseMileage) || 0;
        const from = shoeObj.mileageFrom || '';
        let sum = 0;
        list.forEach(a => {
          const m = (typeof getMeta === 'function') ? (getMeta(a.date) || {}) : {};
          if (m.shoeId === shoeObj.id && (!from || a.date >= from)) sum += (a.km || 0);
        });
        shoeMileage = Math.round(base + sum);
      }

      const titleText = shoeName ? escapeHTML(shoeName.toUpperCase()) : '러닝화 선택';

      // 평균 기록 (전체 활동 평균 대비)
      const avgRows = [
        ndAvgRow('심박', act.bpm, 'bpm', avgOf(list, 'bpm')),
        ndAvgRow('케이던스', act.spm, 'spm', avgOf(list, 'spm')),
        ndAvgRow('보폭', act.stride != null ? Math.round(act.stride * 100) : null, 'cm',
          avgOf(list, 'stride') != null ? avgOf(list, 'stride') * 100 : null),
        ndAvgRow('접지시간', act.ground, 'ms', avgOf(list, 'ground')),
      ].filter(Boolean).join('');
      const avgCard = avgRows ? `
        <div class="nd-avg round-box">
          <div class="nd-avg-title">나의 평균 기록</div>
          ${avgRows}
        </div>` : '';

      // 이전/다음 활동 날짜 저장 (list: 최신순) — 하단 고정 탭바가 사용
      const idx = list.findIndex(a => a.date === act.date);
      _prevDate = (idx >= 0 && idx < list.length - 1) ? list[idx + 1].date : null;  // prev(과거)
      _nextDate = idx > 0 ? list[idx - 1].date : null;                              // next(최근)

      return `
        <div class="nd">
          <div class="nd-top">
            <span class="nd-brand">${shoeObj && shoeObj.logo ? `<span class="nd-brand-logo" role="img" aria-label="brand" style="-webkit-mask-image:url('${shoeObj.logo}');mask-image:url('${shoeObj.logo}')"></span>` : ''}</span>
            <span class="nd-weather"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 2A4 4 0 0 0 6.5 19Z"/></svg><span id="d-temp"></span></span>
          </div>

          ${noShoe ? `
          <div class="nd-hero nd-hero-empty" onclick="openShoePicker()">
            <svg class="nd-shoe-ghost" viewBox="0 0 200 92" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
              <path d="M12 46 C12 38 18 34 28 34 L52 34 C60 34 66 31 74 25 C82 19 90 14 100 15 C106 15.6 110 19 112 24 L118 39 C120 44 124 46 130 47 L168 52 C180 53.6 190 58 190 66 C190 72 186 76 176 76 L30 76 C18 76 12 70 12 62 Z"/>
              <path d="M12 62 L190 66" opacity="0.5"/>
              <path d="M78 27 L86 37 M90 22 L99 33 M103 18 L112 30" opacity="0.5"/>
            </svg>
            <button class="nd-add-btn" type="button" aria-label="러닝화 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
            <span class="nd-empty-label">러닝화 선택</span>
          </div>` : `
          <div class="nd-hero" onclick="openShoePicker()">
            <h1 class="nd-title">${titleText}</h1>
            ${shoeImg ? `<span class="nd-shoe-wrap"><span class="nd-shoe-inner"><img class="nd-shoe" src="${shoeImg}" alt="러닝화"></span><span class="nd-shoe-scan"></span></span>` : ''}
            <div class="nd-mileage"><span class="nd-mileage-label">MILEAGE</span><span class="nd-mileage-val">${shoeMileage != null ? shoeMileage : '--'}<em>K</em></span></div>
          </div>`}

          <div class="nd-divider"></div>

          <div class="nd-summary">
            <div class="nd-actname">${escapeHTML(displayName)}</div>
            <div class="nd-stats">
              <div class="nd-stat"><span class="nd-stat-val">${act.dur || '--'}</span><span class="nd-stat-label">시간</span></div>
              <div class="nd-stat"><span class="nd-stat-val">${act.pace || '--'}</span><span class="nd-stat-label">페이스</span></div>
              <div class="nd-stat"><span class="nd-stat-val">${fmtNum(act.km, 2)}<em>K</em></span><span class="nd-stat-label">거리</span></div>
            </div>
          </div>

          ${avgCard}
        </div>`;
    }

    /* ── 신발 선택 시트 (롤링) ── */
    function openShoePicker() {
      const shoes = (typeof listShoes === 'function') ? listShoes() : [];
      const meta = getMeta(_date) || {};
      const wrap = document.getElementById('shoe-carousel-wrap');
      if (!shoes.length) {
        wrap.innerHTML = `<div class="shoe-sheet-empty">등록된 러닝화가 없습니다.<br><a onclick="goTo('shoes.html')">러닝화 등록하러 가기 ›</a></div>`;
      } else {
        wrap.innerHTML = `<div class="shoe-carousel">${shoes.map(s => `
          <div class="shoe-card${meta.shoeId === s.id ? ' selected' : ''}" onclick="selectShoe('${s.id}')">
            <img class="shoe-card-img" src="${s.image}" alt="${escapeHTML(s.name)}">
            <span class="shoe-card-name">${escapeHTML(s.name)}</span>
          </div>`).join('')}</div>`;
      }
      document.getElementById('shoe-backdrop').classList.add('open');
      document.getElementById('shoe-sheet').classList.add('open');
    }

    function closeShoePicker() {
      document.getElementById('shoe-backdrop').classList.remove('open');
      document.getElementById('shoe-sheet').classList.remove('open');
    }

    function selectShoe(id) {
      const meta = getMeta(_date) || {};
      // 같은 신발 다시 선택 → 해제
      meta.shoeId = (meta.shoeId === id) ? null : id;
      setMeta(_date, meta);
      closeShoePicker();
      render();
    }

    function fmtNum(n, d) {
      if (n == null || !Number.isFinite(n)) return '--';
      return d != null ? n.toFixed(d) : String(n);
    }

    function escapeHTML(s) {
      return String(s || '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    render();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>

</html>
