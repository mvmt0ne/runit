<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>runit — 활동 상세</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#222222">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="runit">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./transitions.js"></script>
  <style>
    .detail-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--asphalt-black);
    }

    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    }

    .detail-scroll::-webkit-scrollbar { display: none; }

    /* ─── Hero ─── */
    .d-hero {
      padding: 20px 20px 24px;
    }

    .d-meta-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .d-date {
      font-size: 13px;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--cloudy-gray);
    }

    .d-type-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: 'Pretendard Variable', sans-serif;
    }

    .d-name {
      font-size: 30px;
      font-weight: 500;
      color: var(--bone);
      line-height: 1.1;
      margin: 0;
      font-family: 'Pretendard Variable', sans-serif;
    }

    .d-km-row {
      margin-top: 18px;
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
    }

    .d-km {
      font-size: 64px;
      font-weight: 300;
      color: var(--bone);
      line-height: 1;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -1px;
    }

    .d-km sup {
      font-size: 18px;
      font-weight: 400;
      color: var(--slate-gray);
      margin-left: 2px;
    }

    .d-km-side {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .d-km-side-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .d-km-side-val {
      font-size: 20px;
      font-weight: 400;
      color: var(--bone);
      font-family: 'Space Grotesk', sans-serif;
    }

    .d-km-side-label {
      font-size: 11px;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ─── Card ─── */
    .d-card {
      background: var(--slate-gray);
      padding: 18px 20px;
      margin-bottom: 1px;
    }

    .d-card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cloudy-gray);
      margin-bottom: 12px;
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ─── Stats grid ─── */
    .d-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 12px;
    }

    .d-stat {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .d-stat-value {
      font-size: 18px;
      font-weight: 400;
      color: var(--asphalt-black);
      font-family: 'Space Grotesk', sans-serif;
      font-feature-settings: "tnum";
      line-height: 1;
    }

    .d-stat-value sup {
      font-size: 11px;
      font-weight: 400;
      color: var(--cloudy-gray);
      margin-left: 2px;
    }

    .d-stat-label {
      font-size: 12px;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ─── TE ─── */
    .d-te-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .d-te-val {
      font-size: 32px;
      font-weight: 400;
      color: var(--asphalt-black);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1;
    }

    .d-te-scale {
      font-size: 14px;
      color: var(--cloudy-gray);
      font-family: 'Space Grotesk', sans-serif;
    }

    /* ─── Hero 신발 (누끼컷) ─── */
    .d-hero-shoe {
      position: relative;
      margin-top: 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
    }

    /* 받침대 글로우 */
    .d-hero-shoe::before {
      content: '';
      position: absolute;
      left: 8px;
      bottom: -6px;
      width: 150px;
      height: 30px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.45) 0%, transparent 70%);
      filter: blur(2px);
      z-index: 0;
    }

    .d-hero-shoe-img {
      position: relative;
      z-index: 1;
      width: 160px;
      max-height: 100px;
      object-fit: contain;
      transform: rotate(-7deg);
      filter: drop-shadow(0 12px 16px rgba(0, 0, 0, 0.55));
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .d-hero-shoe:active .d-hero-shoe-img {
      transform: rotate(-7deg) scale(0.96);
    }

    .d-hero-shoe-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 1;
    }

    .d-hero-shoe-label {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .d-hero-shoe-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--bone);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .d-hero-shoe-add {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 100px;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      background: transparent;
      color: var(--cloudy-gray);
      font-size: 14px;
      font-family: 'Pretendard Variable', sans-serif;
      cursor: pointer;
    }

    .d-hero-shoe-add:active { background: rgba(255, 255, 255, 0.05); }

    /* ─── 신발 선택 시트 (롤링) ─── */
    .shoe-sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 60;
    }
    .shoe-sheet-backdrop.open { opacity: 1; pointer-events: auto; }

    .shoe-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 61;
      background: var(--dark-gray);
      border-radius: 22px 22px 0 0;
      padding: 18px 0 calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .shoe-sheet.open { transform: translateY(0); }

    .shoe-sheet-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--bone);
      text-align: center;
      font-family: 'Pretendard Variable', sans-serif;
      margin-bottom: 16px;
    }

    .shoe-carousel {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 0 32px 8px;
      scrollbar-width: none;
    }
    .shoe-carousel::-webkit-scrollbar { display: none; }

    .shoe-card {
      flex: 0 0 62%;
      scroll-snap-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .shoe-card.selected {
      border-color: var(--accent);
      background: rgba(255, 76, 49, 0.08);
    }

    .shoe-card-img {
      width: 100%;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5));
    }
    .shoe-card-name {
      font-size: 14px;
      color: var(--bone);
      font-family: 'Pretendard Variable', sans-serif;
      text-align: center;
    }

    .shoe-sheet-empty {
      text-align: center;
      color: var(--cloudy-gray);
      font-size: 13px;
      font-family: 'Pretendard Variable', sans-serif;
      padding: 20px;
    }
    .shoe-sheet-empty a { color: var(--accent); cursor: pointer; }

    /* ─── Empty / error ─── */
    .d-empty {
      padding: 24px 20px;
      text-align: center;
      color: var(--cloudy-gray);
      font-size: 13px;
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ─── Type badge colors (styles.css 의 type-* 변수 사용) ─── */
    .d-type-badge.type-race { background: var(--type-race-bg); color: var(--type-race-text); }
    .d-type-badge.type-tempo,
    .d-type-badge.type-interval,
    .d-type-badge.type-tt { background: var(--type-dark-bg); color: var(--type-dark-text); }
    .d-type-badge.type-steady { background: var(--type-steady-bg); color: var(--type-steady-text); }
    .d-type-badge.type-easy { background: var(--type-easy-bg); color: var(--type-easy-text); }
    .d-type-badge.type-jogging { background: var(--type-jog-bg); color: var(--type-jog-text); }
    .d-type-badge.type-long { background: var(--type-long-bg); color: var(--type-long-text); }
  </style>
</head>

<body>
  <div class="phone">
    <div class="phone-inner bg-dark" style="background: var(--asphalt-black);">
      <div class="detail-page">
        <div class="back-header back-header--dark">
          <button class="back-btn" onclick="goBack('app.html#list')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 19-7-7 7-7" />
              <path d="M19 12H5" />
            </svg>
          </button>
          <span class="back-title">활동 상세</span>
          <button class="header-action-btn" onclick="goEdit()" aria-label="수정">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </button>
        </div>

        <div class="detail-scroll" id="detail-scroll">
          <div id="detail-body">
            <div class="d-empty">불러오는 중…</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 신발 선택 시트 (롤링) -->
  <div class="shoe-sheet-backdrop" id="shoe-backdrop" onclick="closeShoePicker()"></div>
  <div class="shoe-sheet" id="shoe-sheet">
    <div class="shoe-sheet-title">신발 선택</div>
    <div id="shoe-carousel-wrap"></div>
  </div>

  <script src="./data/store.js"></script>
  <script src="./data/activities.js"></script>
  <script>
    const _qs = new URLSearchParams(location.search);
    let _date = _qs.get('date');

    function goEdit() {
      goTo(`input.html?date=${_date || ''}`);
    }

    async function render() {
      const list = await loadActivities();
      if (!list.length) {
        document.getElementById('detail-body').innerHTML =
          '<div class="d-empty">활동 데이터가 없습니다.<br>data/activities.csv 를 확인하세요.</div>';
        return;
      }
      if (!_date) _date = list[0].date;

      const act = list.find(a => a.date === _date);
      if (!act) {
        document.getElementById('detail-body').innerHTML =
          `<div class="d-empty">${_date} 활동을 찾을 수 없습니다.</div>`;
        return;
      }

      const meta = (typeof getMeta === 'function') ? (getMeta(_date) || {}) : {};
      document.getElementById('detail-body').innerHTML = renderHTML(act, meta);
    }

    function renderHTML(act, meta) {
      const displayName = (meta.name && meta.name.trim()) || act.name || '러닝';
      const effType = meta.type || act.type;   // 타입 오버라이드 반영 (list 와 일치)
      const typeText = effType.toUpperCase();

      // 신발 — meta.shoeId 로 신발장 조회 (레거시 meta.shoe dataURL 호환)
      const shoeObj = (meta.shoeId && typeof getShoe === 'function') ? getShoe(meta.shoeId) : null;
      const shoeImg = shoeObj ? shoeObj.image : (meta.shoe || null);
      const shoeName = shoeObj ? shoeObj.name : '';
      const heroShoe = shoeImg
        ? `<div class="d-hero-shoe" onclick="openShoePicker()">
             <img class="d-hero-shoe-img" src="${shoeImg}" alt="러닝화">
             <div class="d-hero-shoe-meta">
               <span class="d-hero-shoe-label">러닝화</span>
               <span class="d-hero-shoe-name">${shoeName ? escapeHTML(shoeName) : '탭하여 변경'} ›</span>
             </div>
           </div>`
        : `<button class="d-hero-shoe-add" onclick="openShoePicker()">+ 신발 선택하기</button>`;

      const hero = `
        <div class="d-hero">
          <div class="d-meta-line">
            <span class="d-date">${act.date}${act.startTime ? ' · ' + act.startTime : ''}</span>
            <span class="d-type-badge type-${effType}">${typeText}</span>
          </div>
          <h1 class="d-name">${escapeHTML(displayName)}</h1>
          <div class="d-km-row">
            <div><span class="d-km">${fmtNum(act.km, 2)}</span><sup>K</sup></div>
            <div class="d-km-side">
              <div class="d-km-side-row"><span class="d-km-side-val">${act.dur || '--'}</span><span class="d-km-side-label">시간</span></div>
              <div class="d-km-side-row"><span class="d-km-side-val">${act.pace || '--'}</span><span class="d-km-side-label">평균 페이스</span></div>
            </div>
          </div>
          ${heroShoe}
        </div>`;

      const statsCells = [
        ['심박',       act.bpm,       'BPM'],
        ['최대 심박',  act.maxBpm,    'BPM'],
        ['케이던스',   act.spm,       'SPM'],
        ['최대 케이던스', act.maxSpm, 'SPM'],
        ['최대 페이스', act.maxPace,  '/K'],
        ['GAP',        act.avgGAP,    '/K'],
        ['보폭',       act.stride,    'M'],
        ['접지시간',   act.ground,    'MS'],
        ['수직 진동',  act.vertOsc,   'CM'],
        ['수직 비율',  act.vertRatio, '%'],
        ['칼로리',     act.calories,  'KCAL'],
        ['걸음',       act.steps,     ''],
        ['상승',       act.ascent,    'M'],
        ['하강',       act.descent,   'M'],
      ].filter(([, v]) => v != null && v !== '');

      const stats = statsCells.length ? `
        <div class="d-card">
          <div class="d-card-title">스탯</div>
          <div class="d-stats-grid">
            ${statsCells.map(([label, val, unit]) => `
              <div class="d-stat">
                <div class="d-stat-value">${val}${unit ? `<sup>${unit}</sup>` : ''}</div>
                <div class="d-stat-label">${label}</div>
              </div>`).join('')}
          </div>
        </div>` : '';

      const te = (act.teAerobic != null) ? `
        <div class="d-card">
          <div class="d-card-title">유산소 훈련 효과</div>
          <div class="d-te-row">
            <span class="d-te-val">${act.teAerobic}</span>
            <span class="d-te-scale">/ 5.0</span>
          </div>
        </div>` : '';

      return hero + stats + te;
    }

    /* ── 신발 선택 시트 (롤링) ── */
    function openShoePicker() {
      const shoes = (typeof listShoes === 'function') ? listShoes() : [];
      const meta = getMeta(_date) || {};
      const wrap = document.getElementById('shoe-carousel-wrap');
      if (!shoes.length) {
        wrap.innerHTML = `<div class="shoe-sheet-empty">등록된 신발이 없습니다.<br><a onclick="goEdit()">입력 화면에서 신발 등록하기 ›</a></div>`;
      } else {
        wrap.innerHTML = `<div class="shoe-carousel">${shoes.map(s => `
          <div class="shoe-card${meta.shoeId === s.id ? ' selected' : ''}" onclick="selectShoe('${s.id}')">
            <img class="shoe-card-img" src="${s.image}" alt="${escapeHTML(s.name)}">
            <span class="shoe-card-name">${escapeHTML(s.name)}</span>
          </div>`).join('')}</div>`;
      }
      document.getElementById('shoe-backdrop').classList.add('open');
      document.getElementById('shoe-sheet').classList.add('open');
    }

    function closeShoePicker() {
      document.getElementById('shoe-backdrop').classList.remove('open');
      document.getElementById('shoe-sheet').classList.remove('open');
    }

    function selectShoe(id) {
      const meta = getMeta(_date) || {};
      // 같은 신발 다시 선택 → 해제
      meta.shoeId = (meta.shoeId === id) ? null : id;
      setMeta(_date, meta);
      closeShoePicker();
      render();
    }

    function fmtNum(n, d) {
      if (n == null || !Number.isFinite(n)) return '--';
      return d != null ? n.toFixed(d) : String(n);
    }

    function escapeHTML(s) {
      return String(s || '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    render();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>

</html>
