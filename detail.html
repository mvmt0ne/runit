<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>runit — 활동 상세</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#222222">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="runit">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./transitions.js"></script>
  <style>
    .detail-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--asphalt-black);
    }

    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    }

    .detail-scroll::-webkit-scrollbar { display: none; }

    /* ─── Hero ─── */
    .d-hero {
      padding: 20px 20px 24px;
    }

    .d-meta-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .d-date {
      font-size: 13px;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--cloudy-gray);
    }

    .d-type-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: 'Pretendard Variable', sans-serif;
    }

    .d-name {
      font-size: 30px;
      font-weight: 500;
      color: var(--bone);
      line-height: 1.1;
      margin: 0;
      font-family: 'Pretendard Variable', sans-serif;
    }

    .d-km-row {
      margin-top: 18px;
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
    }

    .d-km {
      font-size: 64px;
      font-weight: 300;
      color: var(--bone);
      line-height: 1;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -1px;
    }

    .d-km sup {
      font-size: 18px;
      font-weight: 400;
      color: var(--slate-gray);
      margin-left: 2px;
    }

    .d-km-side {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .d-km-side-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .d-km-side-val {
      font-size: 20px;
      font-weight: 400;
      color: var(--bone);
      font-family: 'Space Grotesk', sans-serif;
    }

    .d-km-side-label {
      font-size: 11px;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ─── Card ─── */
    .d-card {
      background: var(--slate-gray);
      padding: 18px 20px;
      margin-bottom: 1px;
    }

    .d-card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cloudy-gray);
      margin-bottom: 12px;
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ─── Stats grid ─── */
    .d-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 12px;
    }

    .d-stat {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .d-stat-value {
      font-size: 18px;
      font-weight: 400;
      color: var(--asphalt-black);
      font-family: 'Space Grotesk', sans-serif;
      font-feature-settings: "tnum";
      line-height: 1;
    }

    .d-stat-value sup {
      font-size: 11px;
      font-weight: 400;
      color: var(--cloudy-gray);
      margin-left: 2px;
    }

    .d-stat-label {
      font-size: 12px;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ─── TE ─── */
    .d-te-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .d-te-val {
      font-size: 32px;
      font-weight: 400;
      color: var(--asphalt-black);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1;
    }

    .d-te-scale {
      font-size: 14px;
      color: var(--cloudy-gray);
      font-family: 'Space Grotesk', sans-serif;
    }

    /* ─── 러닝화 이미지 ─── */
    .d-shoe-img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      background: rgba(34, 34, 34, 0.06);
      display: block;
    }

    .d-shoe-empty {
      margin: 12px 20px 20px;
      aspect-ratio: 16 / 9;
      border: 1.5px dashed rgba(34, 34, 34, 0.25);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--cloudy-gray);
      cursor: pointer;
      font-size: 13px;
      font-family: 'Pretendard Variable', sans-serif;
      transition: background 0.15s, border-color 0.15s;
    }

    .d-shoe-empty:active {
      background: rgba(34, 34, 34, 0.04);
      border-color: var(--asphalt-black);
    }

    /* ─── Empty / error ─── */
    .d-empty {
      padding: 24px 20px;
      text-align: center;
      color: var(--cloudy-gray);
      font-size: 13px;
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ─── Type badge colors (styles.css 의 type-* 변수 사용) ─── */
    .d-type-badge.type-race { background: var(--type-race-bg); color: var(--type-race-text); }
    .d-type-badge.type-tempo,
    .d-type-badge.type-interval,
    .d-type-badge.type-tt { background: var(--type-dark-bg); color: var(--type-dark-text); }
    .d-type-badge.type-steady { background: var(--type-steady-bg); color: var(--type-steady-text); }
    .d-type-badge.type-easy { background: var(--type-easy-bg); color: var(--type-easy-text); }
    .d-type-badge.type-jogging { background: var(--type-jog-bg); color: var(--type-jog-text); }
    .d-type-badge.type-long { background: var(--type-long-bg); color: var(--type-long-text); }
  </style>
</head>

<body>
  <div class="phone">
    <div class="phone-inner bg-dark" style="background: var(--asphalt-black);">
      <div class="detail-page">
        <div class="back-header back-header--dark">
          <button class="back-btn" onclick="goBack('app.html#list')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 19-7-7 7-7" />
              <path d="M19 12H5" />
            </svg>
          </button>
          <span class="back-title">활동 상세</span>
          <button class="header-action-btn" onclick="goEdit()" aria-label="수정">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
          </button>
        </div>

        <div class="detail-scroll" id="detail-scroll">
          <div id="detail-body">
            <div class="d-empty">불러오는 중…</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./data/store.js"></script>
  <script src="./data/activities.js"></script>
  <script>
    const _qs = new URLSearchParams(location.search);
    let _date = _qs.get('date');

    function goEdit() {
      goTo(`input.html?date=${_date || ''}`);
    }

    async function render() {
      const list = await loadActivities();
      if (!list.length) {
        document.getElementById('detail-body').innerHTML =
          '<div class="d-empty">활동 데이터가 없습니다.<br>data/activities.csv 를 확인하세요.</div>';
        return;
      }
      if (!_date) _date = list[0].date;

      const act = list.find(a => a.date === _date);
      if (!act) {
        document.getElementById('detail-body').innerHTML =
          `<div class="d-empty">${_date} 활동을 찾을 수 없습니다.</div>`;
        return;
      }

      const meta = (typeof getMeta === 'function') ? (getMeta(_date) || {}) : {};
      document.getElementById('detail-body').innerHTML = renderHTML(act, meta);
    }

    function renderHTML(act, meta) {
      const displayName = (meta.name && meta.name.trim()) || act.name || '러닝';
      const typeText = act.type.toUpperCase();
      const hero = `
        <div class="d-hero">
          <div class="d-meta-line">
            <span class="d-date">${act.date}${act.startTime ? ' · ' + act.startTime : ''}</span>
            <span class="d-type-badge type-${act.type}">${typeText}</span>
          </div>
          <h1 class="d-name">${escapeHTML(displayName)}</h1>
          <div class="d-km-row">
            <div><span class="d-km">${fmtNum(act.km, 2)}</span><sup>K</sup></div>
            <div class="d-km-side">
              <div class="d-km-side-row"><span class="d-km-side-val">${act.dur || '--'}</span><span class="d-km-side-label">시간</span></div>
              <div class="d-km-side-row"><span class="d-km-side-val">${act.pace || '--'}</span><span class="d-km-side-label">평균 페이스</span></div>
            </div>
          </div>
        </div>`;

      const statsCells = [
        ['심박',       act.bpm,       'BPM'],
        ['최대 심박',  act.maxBpm,    'BPM'],
        ['케이던스',   act.spm,       'SPM'],
        ['최대 케이던스', act.maxSpm, 'SPM'],
        ['최대 페이스', act.maxPace,  '/K'],
        ['GAP',        act.avgGAP,    '/K'],
        ['보폭',       act.stride,    'M'],
        ['접지시간',   act.ground,    'MS'],
        ['수직 진동',  act.vertOsc,   'CM'],
        ['수직 비율',  act.vertRatio, '%'],
        ['칼로리',     act.calories,  'KCAL'],
        ['걸음',       act.steps,     ''],
        ['상승',       act.ascent,    'M'],
        ['하강',       act.descent,   'M'],
      ].filter(([, v]) => v != null && v !== '');

      const stats = statsCells.length ? `
        <div class="d-card">
          <div class="d-card-title">스탯</div>
          <div class="d-stats-grid">
            ${statsCells.map(([label, val, unit]) => `
              <div class="d-stat">
                <div class="d-stat-value">${val}${unit ? `<sup>${unit}</sup>` : ''}</div>
                <div class="d-stat-label">${label}</div>
              </div>`).join('')}
          </div>
        </div>` : '';

      const te = (act.teAerobic != null) ? `
        <div class="d-card">
          <div class="d-card-title">유산소 훈련 효과</div>
          <div class="d-te-row">
            <span class="d-te-val">${act.teAerobic}</span>
            <span class="d-te-scale">/ 5.0</span>
          </div>
        </div>` : '';

      const shoe = `
        <div class="d-card" style="padding: 0;">
          <div class="d-card-title" style="padding: 18px 20px 0;">러닝화</div>
          ${meta.shoe
            ? `<img class="d-shoe-img" src="${meta.shoe}" alt="러닝화">`
            : `<div class="d-shoe-empty" onclick="goEdit()">
                 <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                   <rect x="3" y="3" width="18" height="18" rx="2"/>
                   <circle cx="9" cy="9" r="2"/>
                   <path d="m21 15-5-5L5 21"/>
                 </svg>
                 <span>이미지 없음 · 탭하여 추가</span>
               </div>`}
        </div>`;

      return hero + stats + te + shoe;
    }

    function fmtNum(n, d) {
      if (n == null || !Number.isFinite(n)) return '--';
      return d != null ? n.toFixed(d) : String(n);
    }

    function escapeHTML(s) {
      return String(s || '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    render();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>

</html>
