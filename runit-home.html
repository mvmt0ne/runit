<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>runit — Home</title>
  <script>if (location.protocol !== 'file:') { document.write('<link rel="manifest" href="./manifest.json">') }</script>
  <meta name="theme-color" content="#202020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="runit">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./transitions.js"></script>
  <style>
    /* 홈 전용: phone-inner overflow visible (FAB, 월 모달 드롭다운용) */
    .phone-inner {
      overflow: visible;
    }

    .dynamic-island {
      display: none;
      /* 실제 기기에서는 OS가 처리 */
    }



    /* ─── Screen system ───────────────────── */
    .screen {
      display: none;
      flex: 1;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 0 22px 32px;
      scrollbar-width: none;
    }

    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    /* ─── Header ──────────────────────────── */
    .s-header {
      padding: 28px 22px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    /* Profile row */
    .profile-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-avatar {
      width: 34px;
      height: 34px;
      border-radius: 0;
      background: var(--surface-3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-avatar-fallback {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-2);
      letter-spacing: 0;
      line-height: 1;
      transition: color 0.3s;
    }

    .profile-id {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: 0;
      transition: color 0.3s;
    }

    /* ─── Hero mileage row ───────────────── */
    .hero-row {
      padding: 0 22px 0;
      margin-top: auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      cursor: pointer;
    }

    .hero-date {
      padding-bottom: 10px;
    }

    .header-month {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: 0;
      line-height: 1;
      transition: color 0.3s;
    }

    .header-year {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-2);
      margin-top: 3px;
      transition: color 0.3s;
    }

    /* ─── Weather Widget ─────────────────── */
    .weather-widget {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-family: 'Urbanist', sans-serif;
      text-align: right;
    }

    .weather-top {
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1;
    }

    .weather-icon {
      display: inline-flex;
      color: var(--bone);
    }

    .weather-icon svg {
      display: block;
    }

    .weather-temp {
      font-size: 20px;
      font-weight: 500;
      color: var(--bone);
    }


    .weather-bottom {
      display: flex;
      gap: 8px;
      font-size: 11px;
      color: var(--slate-gray);
      font-weight: 500;
    }

    .weather-pm-val {
      font-weight: 700;
    }

    .weather-pm-label {
      opacity: 0.8;
      margin-right: 2px;
    }

    .pm-good {
      color: #00b894;
    }

    .pm-moderate {
      color: #e1b12c;
    }

    .pm-bad {
      color: #e17055;
    }

    .hero-km {
      font-size: 68px;
      font-weight: 900;
      color: var(--text-1);
      letter-spacing: 0;
      line-height: 1;
      transition: color 0.3s;
    }

    .hero-km .km-unit {
      font-size: 22px;
      font-weight: 500;
      color: var(--text-2);
      margin-left: 2px;
    }

    /* ─── New hero section (vertical layout) ────── */
    .hero-section {
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* 홈 프로필 (탭 → 관리) — 배경 영상 위 글래스 원 */
    .home-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .home-profile .profile-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--bone);
    }

    .home-profile:active {
      opacity: 0.7;
    }

    .hero-title-line {
      font-size: 18px;
      font-weight: 300;
      color: var(--slate-gray);
      letter-spacing: 0em;
      line-height: 1.5;
      transition: color 0.3s;
      font-family: 'Pretendard Variable', -apple-system, sans-serif;
      margin-top: 0;
    }

    /* 마일리지 숫자 — 이탤릭 마지막 글자 오른쪽 오버슈트가 잘리지 않게 여백 */
    /* 이탤릭 마지막 글자(단위 K) 오른쪽 오버슈트 잘림 방지 */
    .hero-km-big {
      padding-right: 0.16em;
    }

    .hero-km-row {
      padding: 0 22px 0;
      display: flex;
      align-items: baseline;
      gap: 4px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .hero-km-big {
      font-size: 72px;
      font-weight: 700;
      font-style: italic;
      color: var(--bone);
      letter-spacing: -2px;
      /* iOS: line-height 1이면 큰 이탤릭 글리프가 라인박스를 넘쳐 상위 overflow에서 잘림 → 여유 */
      line-height: 1.25;
      transition: color 0.3s;
      font-family: 'Urbanist', -apple-system, sans-serif;
    }

    /* 단위 K — 위첨자 대신 숫자와 아래(베이스라인) 정렬, 작게, 간격 더 */
    .hero-km-big .km-unit {
      font-size: 0.42em;
      font-weight: 500;
      color: var(--text-2);
      margin-left: 10px;
      letter-spacing: 0;
      /* sup가 아니라 inline → 숫자와 같은 베이스라인(아래 정렬) */
    }

    .hero-km-unit {
      font-size: 20px;
      font-weight: 300;
      color: var(--text-2);
      letter-spacing: 0;
      transition: color 0.3s;
      font-family: 'Urbanist', -apple-system, sans-serif;
    }

    /* ─── Bottom Nav ──────────────────────────── */
    .bottom-nav {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 26px 10px;
      flex-shrink: 0;
    }

    .bottom-nav-icon {
      cursor: pointer;
      opacity: 0.75;
    }

    /* ─── Calendar ────────────────────────── */
    .calendar {
      overflow: hidden;
    }

    .cal-slide-wrap {
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1),
        opacity 0.28s ease;
    }

    .cal-slide-wrap.slide-out-left {
      transform: translateX(-32px);
      opacity: 0;
    }

    .cal-slide-wrap.slide-out-right {
      transform: translateX(32px);
      opacity: 0;
    }

    .cal-slide-wrap.slide-in-left {
      transform: translateX(32px);
      opacity: 0;
    }

    .cal-slide-wrap.slide-in-right {
      transform: translateX(-32px);
      opacity: 0;
    }

    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .cal-nav-btn {
      width: 28px;
      height: 28px;
      border-radius: 0;
      background: var(--surface-1);
      border: none;
      color: var(--text-2);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      transition: background 0.3s, color 0.3s;
    }

    .cal-month-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
      letter-spacing: 0;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 12px;
      padding: 0 22px;
    }

    .cal-wd {
      text-align: center;
      font-size: 11pt;
      font-weight: 300;
      color: var(--slate-gray);
      /* 평일: 다크그레이*/
      padding: 8px 0;
      font-family: 'Pretendard Variable', -apple-system, sans-serif;
    }

    /* 일(첫번째), 토(마지막): 하양 */
    .cal-wd:first-child,
    .cal-wd:last-child {
      color: var(--cloudy-gray);
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0;
      padding: 0 22px;
    }

    /* ─── Calendar day cell ───────────────── */
    .cal-day {
      border-radius: 100px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .cal-day:active {
      opacity: 0.7;
      transform: scale(0.94);
    }

    .day-num {
      font-size: 14px;
      font-weight: 300;
      line-height: 1;
      color: #ffffff;
      display: none;
    }

    .day-note {
      font-size: 16px;
      font-weight: 600;
      color: inherit;
      line-height: 1;
      font-family: 'Urbanist', sans-serif;
    }

    /* Today indicator — 우측 상단 겹침 원 */
    .cal-day.today::after {
      content: '';
      position: absolute;
      /* 큰 원의 45° 가장자리에 중심을 두어 절반씩 걸침 */
      top: 14.6%;
      right: 14.6%;
      transform: translate(50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--asphalt-black);
      box-sizing: border-box;
    }

    /* ── Type styles (fixed colors) ── */
    /* Race */
    .type-race {
      background: var(--type-race-bg);
      color: var(--type-race-text);
    }

    /* Time Trial */
    .type-tt {
      background: var(--type-dark-bg);
      color: var(--type-dark-text);
    }

    /* Tempo */
    .type-tempo {
      background: var(--type-dark-bg);
      color: var(--type-dark-text);
    }

    /* Interval */
    .type-interval {
      background: var(--type-dark-bg);
      color: var(--type-dark-text);
    }

    /* Steady */
    .type-steady {
      background: var(--type-steady-bg);
      color: var(--type-steady-text);
    }

    /* Easy */
    .type-easy {
      background: var(--type-easy-bg);
      color: var(--type-easy-text);
    }

    /* Jogging — easy와 동일 */
    .type-jogging {
      background: var(--type-easy-bg);
      color: var(--type-easy-text);
    }

    /* Easy 10k 미만 — 기존 jogging 색상 */
    .type-easy-short {
      background: var(--type-jog-bg);
      color: var(--type-jog-text);
    }

    /* Long */
    .type-long {
      background: var(--type-long-bg);
      color: var(--type-long-text);
    }

    /* No training (past) */
    .type-none {
      background: transparent;
      color: var(--type-none-border);
      cursor: default;
      box-shadow: inset 0 0 0 1.5px var(--type-none-border);
      border: var(--cloudy-gray) 1px solid;
      opacity: 0.6;
    }

    /* Future */
    .type-future {
      background: transparent;
      color: var(--text-3);
    }

    /* ─── Cal-area + activity list layout ──── */
    #s1-home {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 캘린더 + 활동 목록을 담는 스크롤 컨테이너 */
    .cal-area {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .cal-area::-webkit-scrollbar {
      display: none;
    }

    /* 캘린더 페이지: 히어로 + 캘린더 (grained.js로 노이즈 주입) */
    .cal-page {
      display: flex;
      flex-direction: column;
      /* phone-inner(100dvh)와 동일하게 — svh를 쓰면 모바일 URL 바 영역만큼 빈 공간 발생 */
      min-height: 100dvh;
      /* 하단 탭바(약 64px) + 캘린더와의 여백 */
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 90px);
      background-color: var(--bg);
      position: relative;
      isolation: isolate;
    }

    /* grained.js의 ::before를 콘텐츠 뒤로 */
    #cal-page::before {
      z-index: -1;
    }

    /* 홈 배경 영상 — 흑백 + 어둡게 + 대비 (거친 느낌) */
    .home-bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: grayscale(1) brightness(0.38) contrast(1.25);
      pointer-events: none;
      user-select: none;
    }

    /* 영상 위 노이즈(그레인) — grained.js로 애니메이션 그레인 주입 (지지직) */
    .home-bg-noise {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    /* 어둡게 보강 + 하단 가독성 스크림 */
    .home-bg-scrim {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.15) 35%, rgba(0, 0, 0, 0.45) 100%);
    }

    /* 히어로↔캘린더 사이 가변 여백 + 스와이프 인디케이터 */
    .cal-flex-spacer {
      flex: 1;
      min-height: 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 20px 30px;
      gap: 16px;
    }

    .cal-swipe-arrows {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .cal-swipe-arrow {
      color: var(--slate-gray);
      display: flex;
      align-items: center;
      pointer-events: none;
      user-select: none;
      transition: color 0.2s ease;
    }

    .cal-swipe-arrow.hidden {
      color: var(--asphalt-gray);
    }

    /* ─── Month Dropdown ──────────────────── */
    .hero-title {
      position: relative;
      margin-bottom: -7px;
    }

    .month-dd-backdrop {
      position: absolute;
      inset: 0;
      z-index: 150;
      display: none;
    }

    .month-dd-backdrop.open {
      display: block;
    }

    .month-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: -8px;
      width: 190px;
      background: var(--surface-3);
      border-radius: 0;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
      z-index: 160;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.88) translateY(-6px);
      transform-origin: top left;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.2s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    .month-dropdown.open {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }


    /* ─── Month Label (tappable) ──────────── */
    .hero-month-tap {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      border-radius: 0;
      padding: 2px 6px 2px 2px;
      margin-left: -2px;
      font-size: 24px;
      font-weight: 300;
      color: var(--text-1);
      line-height: 1;
      font-family: 'Pretendard Variable', -apple-system, sans-serif;
      transition: background 0.15s, transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-month-tap:active {
      background: rgba(128, 128, 128, 0.12);
      transform: scale(0.94);
    }

    .hero-month-chevron {
      color: var(--text-1);
      opacity: 0.8;
      flex-shrink: 0;
    }

    /* ─── Month Picker Sheet ──────────────── */
    .month-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .month-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 14px;
      border-radius: 0;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .month-item:active {
      background: rgba(128, 128, 128, 0.18);
      transform: scale(0.97);
    }

    .month-item.active {
      background: rgba(128, 128, 128, 0.08);
    }

    .month-item-label {
      font-size: 16px;
      font-weight: 400;
      font-family: 'Pretendard Variable', sans-serif;
      color: var(--text-2);
      letter-spacing: -0.02em;
      transition: color 0.2s;
    }

    .month-item.active .month-item-label {
      color: var(--text-1);
      font-weight: 500;
    }

    .month-item-meta {
      font-size: 13px;
      font-family: 'Urbanist', sans-serif;
      color: var(--text-3);
      transition: color 0.2s;
    }

    .month-item.active .month-item-meta {
      color: var(--accent);
    }

    /* ─── FAB ─────────────────────────────── */
    .fab {
      position: absolute;
      right: 22px;
      bottom: 28px;
      width: 52px;
      height: 52px;
      background: var(--accent);
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 60;
    }
  </style>
</head>

<body>

        <!-- 캘린더 + 바텀 시트 -->
        <div class="cal-area">

          <!-- 캘린더 페이지 (캘린더 하단 정렬) -->
          <div class="cal-page" id="cal-page">

            <video class="home-bg-video" autoplay muted loop playsinline preload="auto" src="./home-bg.mp4"></video>
            <div class="home-bg-scrim"></div>
            <div class="home-bg-noise" id="home-noise" style="position:absolute"></div>

            <div class="hero-section">
              <div class="home-profile" onclick="goTo('manage.html')">
                <div class="profile-avatar">
                  <span class="profile-avatar-fallback" id="home-avatar-ph">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="8" r="4" />

  <script>

    // WMO weather_code → 라인 아이콘 (맑음/부분구름/흐림/비/눈)
    function weatherIconSVG(code) {
      const W = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">';
      let kind = 'cloud';
      if ([0, 1].includes(code)) kind = 'sun';
      else if (code === 2) kind = 'partly';
      else if ([3, 45, 48].includes(code)) kind = 'cloud';
      else if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99].includes(code)) kind = 'rain';
      else if ([71, 73, 75, 77, 85, 86].includes(code)) kind = 'snow';
      const paths = {
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
        partly: '<circle cx="8" cy="8" r="3"/><path d="M8 2.5V4M3.5 8H2M4.8 4.8l-.9-.9"/><path d="M17.5 19a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.4 1.3A3 3 0 0 0 8.5 19z"/>',
        cloud: '<path d="M17.5 18a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 2A3.5 3.5 0 0 0 6 18z"/>',
        rain: '<path d="M16.5 14a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6 1.7A3.2 3.2 0 0 0 6 14z"/><path d="M8 17.5 7 20M12 17.5 11 20M16 17.5 15 20"/>',
        snow: '<path d="M16.5 13a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.6 1.7A3.2 3.2 0 0 0 6 13z"/><path d="M8 17h.01M12 19h.01M16 17h.01"/>',
      };
      return W + paths[kind] + '</svg>';
    }

    async function fetchWeather() {
      try {
        let lat, lon;
        const cached = localStorage.getItem('runit-coords');
        if (cached) {
          ({ lat, lon } = JSON.parse(cached));
        } else {
          const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej));
          lat = pos.coords.latitude;
          lon = pos.coords.longitude;
          localStorage.setItem('runit-coords', JSON.stringify({ lat, lon }));
        }

        // Weather + Air Quality
        const [wRes, aRes] = await Promise.all([
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code`),
          fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm2_5`)
        ]);
        const wData = await wRes.json();
        const aData = await aRes.json();

        const temp = Math.round(wData.current.temperature_2m);
        const hum = wData.current.relative_humidity_2m;
        const code = wData.current.weather_code;
        const pm25 = aData.current.pm2_5;

        document.getElementById('w-icon').innerHTML = weatherIconSVG(code);
        document.getElementById('w-temp').textContent = temp + '°';
        document.getElementById('w-hum').textContent = '습도 ' + hum + '%';

        let pmClass = 'pm-good';
        let pmLabel = '좋음';
        if (pm25 > 35) { pmClass = 'pm-bad'; pmLabel = '나쁨'; }
        else if (pm25 > 15) { pmClass = 'pm-moderate'; pmLabel = '보통'; }

        document.getElementById('w-pm').innerHTML = `<span class="weather-pm-label">미세</span><span class="weather-pm-val ${pmClass}">${pmLabel}</span>`;
      } catch (err) {
        console.error(err);
        document.getElementById('weather-widget').style.opacity = '0.5';
      }
    }

    /* ── Bottom sheet drag (removed — activity list is now inline) ── */

    function p1Show(name) {
      // stats / detail 은 별도 HTML 파일로 분리됨
      if (name === 'home') {
        document.getElementById('s1-home').classList.add('active');
      }
    }

    /* ── Month navigation (CSV에서 동적 생성) ── */
    let MONTHS_ORDER = [];       // ['YYYY-MM', ...] 오름차순 (오래된 → 최신)
    let MONTH_DATA = {};       // { 'YYYY-MM': { monthName, km, runCount, calGrid } }
    let currentMonthIdx = 0;

    function buildCalGrid(ym, dayMap, today) {
      const [y, m] = ym.split('-').map(n => parseInt(n, 10));
      const offset = new Date(y, m - 1, 1).getDay();   // 0=Sun..6=Sat
      const lastDay = new Date(y, m, 0).getDate();
      let html = '';
      for (let i = 0; i < offset; i++) html += '<div class="cal-day"></div>';
      for (let d = 1; d <= lastDay; d++) {
        const acts = dayMap.get(d) || [];
        const isToday = today && today.y === y && today.m === m && today.d === d;
        const todayCls = isToday ? ' today' : '';
        const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        if (!acts.length) {
          // 빈 날짜 → 그 날짜로 기록 추가(입력 화면)
          html += `<div class="cal-day type-none${todayCls}" onclick="goTo('input.html?date=${dateStr}')"><span class="day-num">${d}</span></div>`;
        } else {
          // 같은 날 여러 활동 있으면 거리가 가장 긴 것 선택
          const main = acts.reduce((a, b) => (b.km || 0) > (a.km || 0) ? b : a);
          const note = main.km != null ? Math.round(main.km) : '';
          const typeClass = (main.type === 'easy' && (main.km || 0) < 10) ? 'easy-short' : main.type;
          html += `<div class="cal-day type-${typeClass}${todayCls}" onclick="goTo('detail.html?date=${dateStr}')"><span class="day-note">${note}</span></div>`;
        }
      }
      const total = offset + lastDay;
      const pad = (7 - (total % 7)) % 7;
      for (let i = 0; i < pad; i++) html += '<div class="cal-day"></div>';
      return html;
    }

    function buildMonthData(activities) {
      // 월별 그룹핑
      const byMonth = new Map();   // YYYY-MM → Activity[]
      activities.forEach(a => {
        if (!a.date) return;
        const ym = a.date.slice(0, 7);
        if (!byMonth.has(ym)) byMonth.set(ym, []);
        byMonth.get(ym).push(a);
      });
      MONTHS_ORDER = [...byMonth.keys()].sort();   // 오름차순
      MONTH_DATA = {};
      const now = new Date();
      const today = { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate() };
      const MONTH_NAMES = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
      MONTHS_ORDER.forEach(ym => {
        const acts = byMonth.get(ym);
        const totalKm = acts.reduce((s, a) => s + (a.km || 0), 0);
        const dayMap = new Map();
        acts.forEach(a => {
          const d = parseInt(a.date.slice(8, 10), 10);
          if (!dayMap.has(d)) dayMap.set(d, []);
          dayMap.get(d).push(a);
        });
        const [, m] = ym.split('-').map(n => parseInt(n, 10));
        MONTH_DATA[ym] = {
          monthName: MONTH_NAMES[m - 1],
          km: totalKm.toFixed(1),
          runCount: `${acts.length} runs`,
          calGrid: buildCalGrid(ym, dayMap, today),
        };
      });
      currentMonthIdx = Math.max(0, MONTHS_ORDER.length - 1);
    }

    function navMonth(dir) {
      const next = currentMonthIdx + dir;
      if (next < 0 || next >= MONTHS_ORDER.length) return;
      const wrap = document.getElementById('cal-slide-wrap');
      // slide out
      wrap.classList.add(dir < 0 ? 'slide-out-right' : 'slide-out-left');
      setTimeout(() => {
        wrap.classList.remove('slide-out-right', 'slide-out-left');
        // prepare slide-in from opposite side (no transition)
        wrap.style.transition = 'none';
        wrap.classList.add(dir < 0 ? 'slide-in-left' : 'slide-in-right');
        currentMonthIdx = next;
        renderMonth();
        // force reflow then animate in
        wrap.getBoundingClientRect();
        wrap.style.transition = '';
        wrap.classList.remove('slide-in-left', 'slide-in-right');
      }, 200);
    }

    // 마일리지 숫자 — 값은 바로 표시하고, 텍스트 재렌더 없는 페이드인만 적용.
    // (매 프레임 텍스트를 다시 그리는 카운트업은 iOS에서 큰 글자 잔상을 유발해 제거)
    function slotNumber(el, value) {
      // 값만 즉시 표시. (opacity 페이드는 iOS에서 합성 레이어가 마지막 글자 이탤릭
      //  오버슈트를 전환 동안 잘라내므로 애니메이션 없음)
      el.textContent = String(value);
    }

    function renderMonth() {
      const key = MONTHS_ORDER[currentMonthIdx];
      const d = MONTH_DATA[key];
      const kmEl = document.querySelector('.hero-km-value');
      if (kmEl) slotNumber(kmEl, d.km);
      const labelEl = document.getElementById('hero-month-label');
      if (labelEl) labelEl.textContent = d.monthName;
      const gridEl = document.getElementById('cal-grid-1');
      if (gridEl) gridEl.innerHTML = d.calGrid;
      const countEl = document.getElementById('bs-count-1');
      if (countEl) countEl.textContent = d.runCount;
      // 화살표: 이동 가능한 방향만 표시
      const arrowL = document.getElementById('cal-arrow-left');
      const arrowR = document.getElementById('cal-arrow-right');
      if (arrowL) arrowL.classList.toggle('hidden', currentMonthIdx <= 0);
      if (arrowR) arrowR.classList.toggle('hidden', currentMonthIdx >= MONTHS_ORDER.length - 1);
    }

    function animateCounter(el, start, end, duration) {
      const startTime = performance.now();

      function updateCounter(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const current = start + (end - start) * progress;
        el.textContent = current.toFixed(1);

        if (progress < 1) {
          requestAnimationFrame(updateCounter);
        }
      }

      requestAnimationFrame(updateCounter);
    }

    /* ═══════════════════════════════════════
       MONTH LIST PICKER (CSV에서 동적 생성)
    ═══════════════════════════════════════ */
    let ALL_MONTHS = [];        // [{year, month}] 내림차순 (최신 → 과거)
    let MONTH_KEY_MAP = {};     // 'YYYY-M' → MONTHS_ORDER idx
    let WHEEL_YEARS = [];

    function buildWheelMonths() {
      // 데이터 있는 가장 오래된 달 ~ 가장 최신 달 범위로 휠 채움
      if (!MONTHS_ORDER.length) {
        const now = new Date();
        ALL_MONTHS = [{ year: now.getFullYear(), month: now.getMonth() + 1 }];
      } else {
        const [yFirst, mFirst] = MONTHS_ORDER[0].split('-').map(n => parseInt(n, 10));
        const [yLast, mLast] = MONTHS_ORDER[MONTHS_ORDER.length - 1].split('-').map(n => parseInt(n, 10));
        ALL_MONTHS = [];
        let y = yLast, m = mLast;
        while (y > yFirst || (y === yFirst && m >= mFirst)) {
          ALL_MONTHS.push({ year: y, month: m });
          m--; if (m === 0) { m = 12; y--; }
        }
      }
      MONTH_KEY_MAP = {};
      MONTHS_ORDER.forEach((ym, idx) => {
        const [y, m] = ym.split('-').map(n => parseInt(n, 10));
        MONTH_KEY_MAP[`${y}-${m}`] = idx;
      });
      WHEEL_YEARS = [...new Set(ALL_MONTHS.map(m => m.year))].sort((a, b) => b - a);
    }
    const WHEEL_ITEM_H = 44;

    function getMonthsForYear(year) {
      return ALL_MONTHS
        .filter(m => m.year === year)
        .map(m => m.month)
        .sort((a, b) => b - a);
    }

    let _wheelMonths = [];

    function buildMonthWheel(year, snapMonth) {
      _wheelMonths = getMonthsForYear(year);
      const col = document.getElementById('wheel-month');
      col.innerHTML =
        '<div class="wheel-spacer"></div>' +
        _wheelMonths.map(m => `<div class="wheel-item">${m}월</div>`).join('') +
        '<div class="wheel-spacer"></div>';
      const idx = snapMonth !== undefined
        ? Math.max(0, _wheelMonths.indexOf(snapMonth))
        : 0;
      col.scrollTop = idx * WHEEL_ITEM_H;
    }

    function openMonthSheet() {
      const curObj = ALL_MONTHS.find(m => MONTH_KEY_MAP[`${m.year}-${m.month}`] === currentMonthIdx);
      const initYear = curObj ? curObj.year : WHEEL_YEARS[0];
      const initMonth = curObj ? curObj.month : getMonthsForYear(WHEEL_YEARS[0])[0];

      const yearCol = document.getElementById('wheel-year');
      yearCol.innerHTML =
        '<div class="wheel-spacer"></div>' +
        WHEEL_YEARS.map(y => `<div class="wheel-item">${y}년</div>`).join('') +
        '<div class="wheel-spacer"></div>';
      yearCol.scrollTop = WHEEL_YEARS.indexOf(initYear) * WHEEL_ITEM_H;

      buildMonthWheel(initYear, initMonth);

      let _yearTimer = null;
      yearCol.onscroll = () => {
        clearTimeout(_yearTimer);
        _yearTimer = setTimeout(() => {
          const yi = Math.round(yearCol.scrollTop / WHEEL_ITEM_H);
          const y = WHEEL_YEARS[Math.max(0, Math.min(yi, WHEEL_YEARS.length - 1))];
          buildMonthWheel(y);
        }, 120);
      };

      document.getElementById('month-sheet').classList.add('open');
      document.getElementById('month-backdrop').classList.add('open');
    }

    function confirmMonthPick() {
      const yearCol = document.getElementById('wheel-year');
      const monthCol = document.getElementById('wheel-month');
      const yearIdx = Math.round(yearCol.scrollTop / WHEEL_ITEM_H);
      const monthIdx = Math.round(monthCol.scrollTop / WHEEL_ITEM_H);
      const year = WHEEL_YEARS[Math.max(0, Math.min(yearIdx, WHEEL_YEARS.length - 1))];
      const month = _wheelMonths[Math.max(0, Math.min(monthIdx, _wheelMonths.length - 1))];
      const newIdx = MONTH_KEY_MAP[`${year}-${month}`];
      closeMonthSheet();
      if (newIdx === undefined || newIdx === currentMonthIdx) return;
      const dir = newIdx > currentMonthIdx ? 1 : -1;
      const wrap = document.getElementById('cal-slide-wrap');
      wrap.classList.add(dir < 0 ? 'slide-out-right' : 'slide-out-left');
      setTimeout(() => {
        wrap.classList.remove('slide-out-right', 'slide-out-left');
        wrap.style.transition = 'none';
        wrap.classList.add(dir < 0 ? 'slide-in-left' : 'slide-in-right');
        currentMonthIdx = newIdx;
        renderMonth();
        wrap.getBoundingClientRect();
        wrap.style.transition = '';
        wrap.classList.remove('slide-in-left', 'slide-in-right');
      }, 200);
    }

    function closeMonthSheet() {
      document.getElementById('month-sheet').classList.remove('open');
      document.getElementById('month-backdrop').classList.remove('open');
    }

    // Swipe (touch + mouse) on calendar
    (function () {
      const cal = document.getElementById('calendar-1');
      let startX = 0;
      let dragging = false;

      // Touch
      cal.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
      }, { passive: true });
      cal.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 40) navMonth(dx < 0 ? 1 : -1);
      }, { passive: true });

      // Mouse (for desktop testing)
      cal.addEventListener('mousedown', e => {
        startX = e.clientX;
        dragging = true;
      });
      window.addEventListener('mouseup', e => {
        if (!dragging) return;
        dragging = false;
        const dx = e.clientX - startX;
        if (Math.abs(dx) > 40) navMonth(dx < 0 ? 1 : -1);
      });
    })();
  </script>

  <script>
    /* ═══════════════════════════════════════
       INIT
    ═══════════════════════════════════════ */
    (async function init() {
      try {
        if (typeof loadActivities === 'function') {
          const activities = await loadActivities();
          buildMonthData(activities);
          buildWheelMonths();
        }
      } catch (e) {
        console.error('[home] activities load failed', e);
      }
      renderMonth();
      fetchWeather();
      renderProfileAvatar();
    })();

    // 프로필 아바타 (마이페이지에서 설정한 이미지 반영)
    function renderProfileAvatar() {
      try {
        const p = (typeof getProfile === 'function') ? getProfile() : {};
        const img = document.getElementById('home-avatar-img');
        const ph = document.getElementById('home-avatar-ph');
        if (!img || !ph) return;
        if (p && p.avatar) {
          img.src = p.avatar; img.style.display = 'block'; ph.style.display = 'none';
        } else {
          img.style.display = 'none'; ph.style.display = '';
        }
      } catch (e) {}
    }
    window.addEventListener('runit-cloud-sync', renderProfileAvatar);
  </script>

  <script>
    (function () {
      const THRESHOLD = 80, MAX_PULL = 120, RESIST = 0.45;
      const scrollEl = document.querySelector('.cal-area');
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-52px);width:44px;height:44px;border-radius:0;background:rgba(35,35,35,0.92);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;z-index:100;pointer-events:none;transition:transform 0.25s cubic-bezier(0.16,1,0.3,1),opacity 0.25s;opacity:0';
      const icon = document.createElement('div');
      icon.style.cssText = 'display:flex;align-items:center;justify-content:center;';
      icon.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cdcdcd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>';
      wrap.appendChild(icon);
      document.body.appendChild(wrap);
      const ks = document.createElement('style');
      ks.textContent = '@keyframes ptr-spin{to{transform:rotate(360deg)}}';
      document.head.appendChild(ks);
      if (sessionStorage.getItem('ptr-return')) {
        sessionStorage.removeItem('ptr-return');
        if (scrollEl) { scrollEl.style.transition = 'none'; scrollEl.style.transform = 'translateY(64px)'; }
        setTimeout(() => { if (scrollEl) { scrollEl.style.transition = 'transform 0.5s cubic-bezier(0.16,1,0.3,1)'; scrollEl.style.transform = ''; } }, 50);
      }
      let startY = 0, pullDist = 0, tracking = false, triggered = false;
      function scrollTop() { const el = document.querySelector('.cal-area,.scroll-area,.list-scroll'); return el ? el.scrollTop : window.scrollY; }
      function setPos(p, o) {
        const ty = (p / THRESHOLD) * 52 - 52;
        wrap.style.transform = `translateX(-50%) translateY(${ty}px)`;
        wrap.style.opacity = o;
        icon.style.transform = `rotate(${Math.min(p / THRESHOLD, 1) * 210}deg)`;
        if (scrollEl) scrollEl.style.transform = `translateY(${Math.max(0, p * 0.8)}px)`;
      }
      // 당겨서 새로고침 — 홈 스크롤 영역(scrollEl)에만 부착. document에 달면 SPA에서
      // 다른 탭(마일리지 등)에서도 발동해 의도치 않게 새로고침됨.
      if (scrollEl) {
        scrollEl.addEventListener('touchstart', e => { if (triggered || scrollTop() > 2) return; startY = e.touches[0].clientY; pullDist = 0; tracking = true; wrap.style.transition = 'none'; icon.style.transition = 'none'; scrollEl.style.transition = 'none'; }, { passive: true });
        scrollEl.addEventListener('touchmove', e => { if (!tracking) return; if (scrollTop() > 2) { tracking = false; return; } const dy = e.touches[0].clientY - startY; if (dy <= 0) return; pullDist = Math.min(dy * RESIST, MAX_PULL); setPos(pullDist, Math.min(pullDist / THRESHOLD, 1)); }, { passive: true });
        scrollEl.addEventListener('touchend', () => { if (!tracking) return; tracking = false; const ease = 'transform 0.25s cubic-bezier(0.16,1,0.3,1),opacity 0.25s'; wrap.style.transition = ease; icon.style.transition = 'transform 0.25s'; scrollEl.style.transition = 'transform 0.25s cubic-bezier(0.16,1,0.3,1)'; if (pullDist >= THRESHOLD) { triggered = true; wrap.style.transform = 'translateX(-50%) translateY(8px)'; wrap.style.opacity = '1'; scrollEl.style.transform = 'translateY(64px)'; icon.style.transform = 'none'; icon.style.transition = 'none'; icon.style.animation = 'ptr-spin 0.55s linear infinite'; sessionStorage.setItem('ptr-return', '1'); setTimeout(() => window.location.reload(), 700); } else { wrap.style.transform = 'translateX(-50%) translateY(-52px)'; wrap.style.opacity = '0'; scrollEl.style.transform = ''; } pullDist = 0; }, { passive: true });
      }
    })();
  </script>
