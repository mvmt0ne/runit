<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>runit — PB</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#202020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="runit">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./transitions.js"></script>
  <style>
    .pb-scroll {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px));
    }

    .pb-scroll::-webkit-scrollbar { display: none; }

    .lp-hero-title {
      font-size: 34px;
      font-weight: 700;
      font-family: 'Pretendard Variable', sans-serif;
      color: var(--bone);
      letter-spacing: -0.025em;
      line-height: 1.1;
      margin: 0;
    }

    /* ── Distance tabs (stats 톤과 통일) ── */
    .dist-tabs {
      display: flex;
      padding: 0 10px;
      position: sticky;
      top: 50px;
      z-index: 20;
      background: rgba(32, 32, 32, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .dist-tab {
      flex: 1;
      padding: 12px 0;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 17px;
      font-weight: 400;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
      letter-spacing: -0.02em;
      transition: color 0.2s, font-weight 0.2s;
    }

    .dist-tab.active {
      color: var(--bone);
      font-weight: 500;
    }

    /* ── PB content ── */
    .pb-content {
      padding: 28px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Hero card (1위) ── */
    .pb-hero {
      perspective: 1200px;
      padding: 0 6px;
    }

    .pb-hero-card {
      position: relative;
      width: 100%;
      aspect-ratio: 5 / 6;
      border-radius: 28px;
      overflow: hidden;
      cursor: pointer;
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow:
        0 24px 60px -20px rgba(123, 91, 255, 0.55),
        0 8px 24px -8px rgba(0, 0, 0, 0.4),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .pb-hero-card.tap {
      animation: hero-tap 0.42s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes hero-tap {
      0%   { transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(1); }
      50%  { transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(0.96); }
      100% { transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(1); }
    }

    .pb-hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 80% 0%, #FF9CFF 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 0% 100%, #4F8DFF 0%, transparent 55%),
        linear-gradient(135deg, #6431F0 0%, #8B5CF6 45%, #C77DFF 100%);
      pointer-events: none;
    }

    /* 홀로그램 foil — 마우스/터치 위치 따라 이동 */
    .pb-hero-foil {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle 50% 50% at var(--foil-x, 50%) var(--foil-y, 50%),
          rgba(255, 255, 255, 0.55) 0%,
          rgba(255, 255, 255, 0.1) 35%,
          transparent 60%
        );
      mix-blend-mode: overlay;
      opacity: 0.9;
      pointer-events: none;
      transition: background 0.06s linear;
    }

    /* 무지개 sheen — 위치에 따라 색 흐름 */
    .pb-hero-sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        calc(var(--sheen-angle, 110) * 1deg),
        transparent 30%,
        hsla(40, 90%, 75%, 0.18) 42%,
        hsla(160, 90%, 75%, 0.22) 50%,
        hsla(280, 90%, 75%, 0.18) 58%,
        transparent 70%
      );
      mix-blend-mode: screen;
      pointer-events: none;
      transition: background 0.1s linear;
    }

    /* 큰 거리 숫자 — 카드 watermark */
    .pb-hero-watermark {
      position: absolute;
      right: -14px;
      bottom: -32px;
      font-size: 260px;
      font-weight: 800;
      font-family: 'Space Grotesk', sans-serif;
      color: rgba(255, 255, 255, 0.08);
      line-height: 0.8;
      letter-spacing: -0.06em;
      pointer-events: none;
      user-select: none;
    }

    .pb-hero-content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 26px 26px 28px;
      display: flex;
      flex-direction: column;
      color: white;
    }

    .pb-hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .pb-hero-dist {
      font-size: 56px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.04em;
      line-height: 1;
      color: rgba(255, 255, 255, 0.96);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    .pb-hero-rank {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 100px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-family: 'Space Mono', monospace;
      color: rgba(255, 255, 255, 0.95);
      margin-top: 8px;
    }

    .pb-hero-time {
      margin-top: auto;
      font-size: 72px;
      font-weight: 300;
      font-family: 'Space Grotesk', sans-serif;
      color: white;
      line-height: 1;
      letter-spacing: -0.04em;
      font-feature-settings: "tnum";
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .pb-hero-pace {
      margin-top: 8px;
      font-size: 17px;
      font-family: 'Space Mono', monospace;
      color: rgba(255, 255, 255, 0.78);
      letter-spacing: 0.02em;
    }

    .pb-hero-meta {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .pb-hero-date {
      font-family: 'Space Mono', monospace;
      color: rgba(255, 255, 255, 0.75);
    }

    /* ── 2~5위 List ── */
    .pb-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pb-section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
      padding: 0 4px 8px;
    }

    .pb-row {
      display: grid;
      grid-template-columns: 28px 96px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      transition: background 0.18s, transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .pb-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, #8B5CF6, #C77DFF);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .pb-row:active {
      transform: scale(0.985);
      background: rgba(255, 255, 255, 0.08);
    }

    .pb-row:active::before {
      opacity: 1;
    }

    .pb-rank {
      font-size: 14px;
      font-weight: 600;
      color: var(--cloudy-gray);
      font-family: 'Space Grotesk', sans-serif;
    }

    .pb-row-time {
      font-size: 22px;
      font-weight: 400;
      color: var(--bone);
      font-family: 'Space Grotesk', sans-serif;
      font-feature-settings: "tnum";
      letter-spacing: -0.02em;
    }

    .pb-row-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .pb-row-name {
      font-size: 13px;
      color: var(--bone);
      font-family: 'Pretendard Variable', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pb-row-date {
      font-size: 11px;
      color: var(--cloudy-gray);
      font-family: 'Space Mono', monospace;
    }

    .pb-row-pace {
      font-size: 12px;
      color: var(--cloudy-gray);
      font-family: 'Space Mono', monospace;
    }

    @media (prefers-reduced-motion: reduce) {
      .pb-hero-card,
      .pb-hero-foil,
      .pb-hero-sheen,
      .pb-row { transition: none !important; }
      .pb-hero-card.tap { animation: none !important; }
    }
  </style>
</head>

<body>
  <div class="phone">
    <div class="phone-inner">

      <div class="pb-scroll">

        <!-- Compact sticky header -->
        <div class="lp-header">
          <span class="lp-header-title-compact">PB</span>
        </div>
        <!-- Large title -->
        <div class="lp-hero">
          <h1 class="lp-hero-title">PB</h1>
        </div>

        <div class="dist-tabs">
          <button class="dist-tab"        data-dist="1k"   onclick="switchDist('1k')">1K</button>
          <button class="dist-tab"        data-dist="3k"   onclick="switchDist('3k')">3K</button>
          <button class="dist-tab active" data-dist="5k"   onclick="switchDist('5k')">5K</button>
          <button class="dist-tab"        data-dist="10k"  onclick="switchDist('10k')">10K</button>
          <button class="dist-tab"        data-dist="half" onclick="switchDist('half')">하프</button>
          <button class="dist-tab"        data-dist="full" onclick="switchDist('full')">풀</button>
        </div>

        <div class="pb-content">

          <!-- Hero card (1위) -->
          <div class="pb-hero">
            <div class="pb-hero-card" id="pb-hero-card" onclick="onHeroTap()">
              <div class="pb-hero-bg"></div>
              <div class="pb-hero-watermark" id="pb-hero-watermark">5</div>
              <div class="pb-hero-sheen"></div>
              <div class="pb-hero-foil"></div>
              <div class="pb-hero-content">
                <div class="pb-hero-top">
                  <span class="pb-hero-dist" id="pb-hero-dist">5K</span>
                  <span class="pb-hero-rank">1ST · PB</span>
                </div>
                <div class="pb-hero-time" id="pb-hero-time">18:42</div>
                <div class="pb-hero-pace" id="pb-hero-pace">3'44"/km</div>
                <div class="pb-hero-meta">
                  <span id="pb-hero-name">서울 10K</span>
                  <span class="pb-hero-date" id="pb-hero-date">2026.03.22</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 2~5위 -->
          <div>
            <div class="pb-section-label">기록 2 — 5</div>
            <div class="pb-list" id="pb-list"></div>
          </div>

        </div>

      </div>

    </div>
  </div>

  <script>
    const PB_DATA = {
      '1k': [
        { time: '3:18',   pace: "3'18\"/km", date: '2026.02.28', name: '트랙 1km TT' },
        { time: '3:24',   pace: "3'24\"/km", date: '2025.11.15', name: '트랙 세션' },
        { time: '3:29',   pace: "3'29\"/km", date: '2025.08.02', name: '인터벌 1km' },
        { time: '3:35',   pace: "3'35\"/km", date: '2025.04.18', name: '스피드 워크' },
        { time: '3:42',   pace: "3'42\"/km", date: '2024.11.30', name: '트랙 TT' },
      ],
      '3k': [
        { time: '10:48',  pace: "3'36\"/km", date: '2026.01.18', name: '3km TT' },
        { time: '11:05',  pace: "3'42\"/km", date: '2025.09.22', name: '트랙 3km' },
        { time: '11:24',  pace: "3'48\"/km", date: '2025.05.05', name: '템포 3km' },
        { time: '11:46',  pace: "3'55\"/km", date: '2025.02.11', name: '인터벌' },
        { time: '12:02',  pace: "4'01\"/km", date: '2024.10.06', name: '3km 세션' },
      ],
      '5k': [
        { time: '18:42',  pace: "3'44\"/km", date: '2026.03.22', name: '서울 10K' },
        { time: '19:05',  pace: "3'49\"/km", date: '2025.11.08', name: '한강 5K 레이스' },
        { time: '19:31',  pace: "3'54\"/km", date: '2025.08.14', name: '템포 런' },
        { time: '19:58',  pace: "3'59\"/km", date: '2025.04.02', name: '트랙 세션' },
        { time: '20:22',  pace: "4'04\"/km", date: '2024.10.19', name: '이지 런' },
      ],
      '10k': [
        { time: '39:18',  pace: "3'56\"/km", date: '2026.02.07', name: '한강 10K' },
        { time: '40:55',  pace: "4'05\"/km", date: '2025.12.14', name: '템포 인터벌' },
        { time: '41:48',  pace: "4'10\"/km", date: '2025.06.20', name: '여름 10K' },
        { time: '43:01',  pace: "4'18\"/km", date: '2025.01.11', name: '신년 레이스' },
        { time: '44:22',  pace: "4'26\"/km", date: '2024.06.08', name: '템포 런' },
      ],
      'half': [
        { time: '1:46:18', pace: "5'02\"/km", date: '2026.04.11', name: '2026 인천하프' },
        { time: '1:48:44', pace: "5'09\"/km", date: '2025.10.19', name: '춘천 하프마라톤' },
        { time: '1:51:02', pace: "5'16\"/km", date: '2025.03.30', name: '서울 하프' },
        { time: '1:53:20', pace: "5'22\"/km", date: '2024.10.06', name: '부산 하프' },
        { time: '1:56:08', pace: "5'31\"/km", date: '2024.04.14', name: '봄 하프' },
      ],
      'full': [
        { time: '3:52:44', pace: "5'31\"/km", date: '2025.11.02', name: '서울마라톤' },
        { time: '3:58:11', pace: "5'38\"/km", date: '2025.03.16', name: '동아마라톤' },
        { time: '4:04:33', pace: "5'47\"/km", date: '2024.11.03', name: '춘천마라톤' },
        { time: '4:11:22', pace: "5'57\"/km", date: '2024.04.21', name: '경주마라톤' },
        { time: '4:18:05', pace: "6'06\"/km", date: '2023.10.29', name: '부산마라톤' },
      ],
    };

    const DISTS = { '1k': '1K', '3k': '3K', '5k': '5K', '10k': '10K', 'half': '하프', 'full': '풀' };
    const WATERMARKS = { '1k': '1', '3k': '3', '5k': '5', '10k': '10', 'half': '21', 'full': '42' };

    let currentDist = '5k';

    function switchDist(dist) {
      if (dist === currentDist) return;
      currentDist = dist;
      document.querySelectorAll('.dist-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.dist === dist));
      renderPB();
    }

    function renderPB() {
      const records = PB_DATA[currentDist];
      const hero = records[0];
      const rest = records.slice(1);

      document.getElementById('pb-hero-dist').textContent = DISTS[currentDist];
      document.getElementById('pb-hero-watermark').textContent = WATERMARKS[currentDist];
      document.getElementById('pb-hero-pace').textContent = hero.pace;
      document.getElementById('pb-hero-name').textContent = hero.name;
      document.getElementById('pb-hero-date').textContent = hero.date;
      slotAnimate(document.getElementById('pb-hero-time'), hero.time);

      document.getElementById('pb-list').innerHTML = rest.map((r, i) => `
        <div class="pb-row" data-rank="${i + 2}">
          <span class="pb-rank">${i + 2}</span>
          <span class="pb-row-time">${r.time}</span>
          <div class="pb-row-meta">
            <span class="pb-row-name">${r.name}</span>
            <span class="pb-row-date">${r.date}</span>
          </div>
          <span class="pb-row-pace">${r.pace}</span>
        </div>
      `).join('');
    }

    /* ─── 슬롯머신 카운터: 숫자 자리만 scramble 후 정착 ─── */
    function slotAnimate(el, finalText, duration = 620) {
      const final = String(finalText);
      const startTime = performance.now();
      const perChar = final.split('').map((c, i) => /\d/.test(c) ? ((i + 1) / final.length) : 0);

      function tick(now) {
        const t = Math.min(1, (now - startTime) / duration);
        let out = '';
        for (let i = 0; i < final.length; i++) {
          const c = final[i];
          if (/\d/.test(c)) {
            out += (t >= perChar[i]) ? c : Math.floor(Math.random() * 10);
          } else {
            out += c;
          }
        }
        el.textContent = out;
        if (t < 1) requestAnimationFrame(tick);
        else el.textContent = final;
      }
      requestAnimationFrame(tick);
    }

    /* ─── 3D tilt + foil shimmer ─── */
    /*  3가지 소스 우선순위:
        1) 사용자 터치/드래그 (가장 정밀, 일시적)
        2) 마우스 이동 (데스크탑)
        3) 폰 자이로 (idle 상태 — 폰 기울기에 따라 천천히 반응) */
    let _touchActive = false;
    let _gyroEnabled = false;
    let _gyroSmoothX = 0;
    let _gyroSmoothY = 0;

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function applyTilt(dx, dy) {
      const card = document.getElementById('pb-hero-card');
      if (!card) return;
      const rx = -dy * 9;
      const ry = dx * 12;
      const fx = ((dx + 1) / 2) * 100;
      const fy = ((dy + 1) / 2) * 100;
      card.style.setProperty('--rx', rx + 'deg');
      card.style.setProperty('--ry', ry + 'deg');
      card.style.setProperty('--foil-x', fx + '%');
      card.style.setProperty('--foil-y', fy + '%');
      card.style.setProperty('--sheen-angle', (110 + dx * 35).toFixed(1));
    }

    function resetTilt() {
      const card = document.getElementById('pb-hero-card');
      if (!card) return;
      card.style.setProperty('--rx', '0deg');
      card.style.setProperty('--ry', '0deg');
      card.style.setProperty('--foil-x', '50%');
      card.style.setProperty('--foil-y', '40%');
      card.style.setProperty('--sheen-angle', '110');
    }

    (function setupPointerTilt() {
      const card = document.getElementById('pb-hero-card');
      if (!card) return;

      function fromPointer(clientX, clientY) {
        const rect = card.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = clamp((clientX - cx) / (rect.width / 2), -1, 1);
        const dy = clamp((clientY - cy) / (rect.height / 2), -1, 1);
        applyTilt(dx, dy);
      }

      card.addEventListener('mousemove', e => fromPointer(e.clientX, e.clientY));
      card.addEventListener('mouseleave', () => { if (!_gyroEnabled) resetTilt(); });

      card.addEventListener('touchstart', e => {
        _touchActive = true;
        const t = e.touches[0];
        if (t) fromPointer(t.clientX, t.clientY);
      }, { passive: true });
      card.addEventListener('touchmove', e => {
        const t = e.touches[0];
        if (t) fromPointer(t.clientX, t.clientY);
      }, { passive: true });
      const endTouch = () => {
        _touchActive = false;
        if (!_gyroEnabled) resetTilt();
      };
      card.addEventListener('touchend', endTouch);
      card.addEventListener('touchcancel', endTouch);
    })();

    /* ─── 자이로(폰 기울기) → 카드 tilt ───
       beta : 폰 앞뒤 기울기 (-180..180). 손에 든 자세 보통 30~60도.
       gamma: 폰 좌우 기울기 (-90..90). 똑바로 들면 0.
       세로 모드 가정. 화면 회전은 screen.orientation.angle 로 보정. */
    function handleOrient(e) {
      if (_touchActive) return;
      let gamma = e.gamma || 0;
      let beta  = e.beta  || 0;
      const ang = (screen.orientation && screen.orientation.angle) || 0;
      if (ang === 90)            { const g = gamma; gamma = beta;  beta = -g; }
      else if (ang === 270 || ang === -90) { const g = gamma; gamma = -beta; beta = g; }
      else if (ang === 180)      { gamma = -gamma; beta = -beta; }

      const targetX = clamp(gamma / 25, -1, 1);
      const targetY = clamp((beta - 45) / 25, -1, 1);
      // 부드럽게 평활화 (저역 통과)
      _gyroSmoothX = _gyroSmoothX * 0.85 + targetX * 0.15;
      _gyroSmoothY = _gyroSmoothY * 0.85 + targetY * 0.15;
      applyTilt(_gyroSmoothX, _gyroSmoothY);
    }

    function enableGyro() {
      if (_gyroEnabled) return;
      const start = () => {
        _gyroEnabled = true;
        window.addEventListener('deviceorientation', handleOrient);
      };
      // iOS 13+ 권한 요청
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => { if (state === 'granted') start(); })
          .catch(() => { /* user denied */ });
      } else if ('DeviceOrientationEvent' in window) {
        start();
      }
    }

    /* ─── 탭 시 살짝 펄스 + 자이로 권한 요청 ─── */
    function onHeroTap() {
      const c = document.getElementById('pb-hero-card');
      c.classList.remove('tap');
      void c.offsetWidth; // reflow
      c.classList.add('tap');
      enableGyro();
    }

    renderPB();
    // Android/데스크탑은 권한 없이 바로 등록 시도
    enableGyro();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>

</html>
