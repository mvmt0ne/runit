<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>runnabe — PB</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#202020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="runnabe">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./transitions.js"></script>
  <style>
    .pb-scroll {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px));
    }

    .pb-scroll::-webkit-scrollbar {
      display: none;
    }

    /* ── Badge carousel — 거리별 뱃지 카드, 좌우 스냅 스와이프 ── */
    .pb-badges {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      /* 카드 76% 폭 → 좌우 12% 패딩으로 첫/끝 카드도 중앙 정렬 가능 */
      padding: 20px 12% 8px;
      scrollbar-width: none;
    }

    .pb-badges::-webkit-scrollbar {
      display: none;
    }

    .pb-badge {
      flex: 0 0 76%;
      scroll-snap-align: center;
      perspective: 1200px;
      transform: scale(0.9);
      opacity: 0.45;
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s;
    }

    .pb-badge.active {
      transform: scale(1);
      opacity: 1;
    }

    /* ── 거리별 뱃지 컬러 (400m→풀: 레드→골드 스펙트럼) ── */
    .bg-400 .pb-hero-bg {
      background:
        radial-gradient(ellipse 80% 60% at 80% 0%, #FFC46B 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 0% 100%, #FF4E6E 0%, transparent 55%),
        linear-gradient(135deg, #B3202D 0%, #D92D3A 45%, #FF7A3C 100%);
    }

    .bg-1k .pb-hero-bg {
      background:
        radial-gradient(ellipse 80% 60% at 80% 0%, #FFE08A 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 0% 100%, #FF9C4A 0%, transparent 55%),
        linear-gradient(135deg, #C06A00 0%, #E08A00 45%, #FFC93C 100%);
    }

    .bg-3k .pb-hero-bg {
      background:
        radial-gradient(ellipse 80% 60% at 80% 0%, #EAFF8A 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 0% 100%, #6BCB3C 0%, transparent 55%),
        linear-gradient(135deg, #5A8F0E 0%, #7CB518 45%, #C6E94E 100%);
    }

    .bg-5k .pb-hero-bg {
      background:
        radial-gradient(ellipse 80% 60% at 80% 0%, #A8FFC4 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 0% 100%, #0FFF54 0%, transparent 55%),
        linear-gradient(135deg, #067A33 0%, #0BA84A 45%, #33FF77 100%);
    }

    .bg-10k .pb-hero-bg {
      background:
        radial-gradient(ellipse 80% 60% at 80% 0%, #8AFFE8 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 0% 100%, #14C2B0 0%, transparent 55%),
        linear-gradient(135deg, #086E62 0%, #0E9E8F 45%, #3CE0C8 100%);
    }

    .bg-15k .pb-hero-bg {
      background:
        radial-gradient(ellipse 80% 60% at 80% 0%, #9CD1FF 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 0% 100%, #3C7DFF 0%, transparent 55%),
        linear-gradient(135deg, #12489E 0%, #1F6FE0 45%, #4FA8FF 100%);
    }

    .bg-half .pb-hero-bg {
      background:
        radial-gradient(ellipse 80% 60% at 80% 0%, #FF9CFF 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 0% 100%, #4F8DFF 0%, transparent 55%),
        linear-gradient(135deg, #6431F0 0%, #8B5CF6 45%, #C77DFF 100%);
    }

    .bg-full .pb-hero-bg {
      background:
        radial-gradient(ellipse 80% 60% at 80% 0%, #FFF3B0 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 0% 100%, #FFB84C 0%, transparent 55%),
        linear-gradient(135deg, #8A6A0A 0%, #C9A227 45%, #FFE066 100%);
    }

    /* ── PB content ── */
    .pb-content {
      padding: 28px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Badge card (거리별 1위 기록) ── */
    .pb-hero-card {
      position: relative;
      width: 100%;
      aspect-ratio: 5 / 6;
      border-radius: 28px;
      overflow: hidden;
      cursor: pointer;
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transform-style: preserve-3d;
      will-change: transform;
      /* transition 없음 — rAF 루프가 직접 보간 (안 그러면 뚝뚝 끊김) */
      box-shadow:
        0 24px 60px -20px rgba(0, 0, 0, 0.55),
        0 8px 24px -8px rgba(0, 0, 0, 0.4),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .pb-hero-card.tap {
      animation: hero-tap 0.42s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes hero-tap {
      0% {
        transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(1);
      }

      50% {
        transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(0.96);
      }

      100% {
        transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(1);
      }
    }

    .pb-hero-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 80% 0%, #FF9CFF 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 0% 100%, #4F8DFF 0%, transparent 55%),
        linear-gradient(135deg, #6431F0 0%, #8B5CF6 45%, #C77DFF 100%);
      pointer-events: none;
    }

    /* 홀로그램 foil — 마우스/터치 위치 따라 이동 */
    .pb-hero-foil {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle 50% 50% at var(--foil-x, 50%) var(--foil-y, 50%),
          rgba(255, 255, 255, 0.55) 0%,
          rgba(255, 255, 255, 0.1) 35%,
          transparent 60%);
      mix-blend-mode: overlay;
      opacity: 0.9;
      pointer-events: none;
      will-change: background;
    }

    /* 무지개 sheen — 위치에 따라 색 흐름 */
    .pb-hero-sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(calc(var(--sheen-angle, 110) * 1deg),
          transparent 30%,
          hsla(40, 90%, 75%, 0.18) 42%,
          hsla(160, 90%, 75%, 0.22) 50%,
          hsla(280, 90%, 75%, 0.18) 58%,
          transparent 70%);
      mix-blend-mode: screen;
      pointer-events: none;
      will-change: background;
    }

    /* 큰 거리 숫자 — 카드 watermark */
    .pb-hero-watermark {
      position: absolute;
      right: -14px;
      bottom: -32px;
      font-size: 260px;
      font-weight: 800;
      font-family: 'Orbitron', sans-serif;
      color: rgba(255, 255, 255, 0.08);
      line-height: 0.8;
      letter-spacing: -0.06em;
      pointer-events: none;
      user-select: none;
    }

    .pb-hero-content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 26px 26px 28px;
      display: flex;
      flex-direction: column;
      color: white;
    }

    .pb-hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .pb-hero-dist {
      font-size: 56px;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: -0.04em;
      line-height: 1;
      color: rgba(255, 255, 255, 0.96);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    .pb-hero-rank {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 100px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-family: 'Space Mono', monospace;
      color: rgba(255, 255, 255, 0.95);
      margin-top: 8px;
    }

    .pb-hero-time {
      margin-top: auto;
      font-size: 72px;
      font-weight: 300;
      font-family: 'Orbitron', sans-serif;
      color: white;
      line-height: 1;
      letter-spacing: -0.04em;
      font-feature-settings: "tnum";
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .pb-hero-pace {
      margin-top: 8px;
      font-size: 17px;
      font-family: 'Space Mono', monospace;
      color: rgba(255, 255, 255, 0.78);
      letter-spacing: 0.02em;
    }

    .pb-hero-meta {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .pb-hero-date {
      font-family: 'Space Mono', monospace;
      color: rgba(255, 255, 255, 0.75);
    }

    /* ── 2~5위 List ── */
    .pb-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pb-section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
      padding: 0 4px 8px;
    }

    .pb-row {
      display: grid;
      grid-template-columns: 28px 96px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      transition: background 0.18s, transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .pb-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, #8B5CF6, #C77DFF);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .pb-row:active {
      transform: scale(0.985);
      background: rgba(255, 255, 255, 0.08);
    }

    .pb-row:active::before {
      opacity: 1;
    }

    .pb-rank {
      font-size: 14px;
      font-weight: 600;
      color: var(--cloudy-gray);
      font-family: 'Orbitron', sans-serif;
    }

    .pb-row-time {
      font-size: 22px;
      font-weight: 400;
      color: var(--bone);
      font-family: 'Orbitron', sans-serif;
      font-feature-settings: "tnum";
      letter-spacing: -0.02em;
    }

    .pb-row-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .pb-row-name {
      font-size: 13px;
      color: var(--bone);
      font-family: 'Pretendard Variable', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pb-row-date {
      font-size: 11px;
      color: var(--cloudy-gray);
      font-family: 'Space Mono', monospace;
    }

    .pb-row-pace {
      font-size: 12px;
      color: var(--cloudy-gray);
      font-family: 'Space Mono', monospace;
    }

    .pb-empty {
      padding: 28px 4px;
      text-align: center;
      font-size: 13px;
      color: var(--cloudy-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* ── 히어로 편집 버튼 ── */
    .pb-hero-edit {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.22);
      border: none;
      border-radius: 100px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-family: 'Space Mono', monospace;
      color: rgba(255, 255, 255, 0.95);
      cursor: pointer;
    }

    .pb-hero-edit:active {
      background: rgba(255, 255, 255, 0.34);
    }

    /* 공식 PB 입력 시트 CSS는 styles.css(전역)에 있음 —
       app.html SPA에서 시트를 document.body로 portal 이동 시 스코프 밖이라 전역 필요. */

    @media (prefers-reduced-motion: reduce) {

      .pb-hero-card,
      .pb-hero-foil,
      .pb-hero-sheen,
      .pb-row {
        transition: none !important;
      }

      .pb-hero-card.tap {
        animation: none !important;
      }
    }

    .pb-back {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 14px;
      z-index: 40;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--slate-gray);
      cursor: pointer;
    }

    .pb-back:active {
      transform: scale(0.92);
    }
  </style>
</head>

<body>
  <div class="phone">
    <div class="phone-inner">
      <div class="back-header back-header--dark">
        <button class="back-btn" onclick="goBackSmart()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7"></path>
            <path d="M19 12H5"></path>
          </svg>
        </button>
        <span class="back-title">PB</span>
      </div>
      <div class="pb-scroll">



        <!-- 거리별 뱃지 캐러셀 (좌우 스와이프) -->
        <div class="pb-badges" id="pb-badges"></div>

        <div class="pb-content">

          <!-- 활동 기준 기록 -->
          <div>
            <div class="pb-section-label">활동 기준 기록</div>
            <div class="pb-list" id="pb-list"></div>
          </div>

        </div>

      </div>

      <!-- 공식 PB 입력 시트 (phone-inner 안에 둬야 SPA 슬라이드 주입+portal 대상이 됨) -->
      <div class="pb-sheet-backdrop" id="pb-sheet-backdrop" onclick="closePBEdit()"></div>
      <div class="pb-sheet" id="pb-sheet">
        <div class="pb-sheet-title" id="pb-sheet-title">5K 공식 PB</div>
        <div class="pb-sheet-hint">가민 커넥트의 개인 기록을 입력하세요.</div>
        <label class="pb-field-label">기록</label>
        <input type="text" id="pb-in-time" class="pb-input" placeholder="예: 18:42 또는 1:46:18" inputmode="numeric">
        <label class="pb-field-label">날짜 (선택)</label>
        <div class="pb-dt">
          <input type="date" id="pb-in-date" class="pb-input" onclick="try{this.showPicker()}catch(e){}">
          <svg class="pb-dt-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
        </div>
        <label class="pb-field-label">대회·메모 (선택)</label>
        <input type="text" id="pb-in-name" class="pb-input" placeholder="예: 서울마라톤">
        <div class="pb-sheet-actions">
          <button class="pb-sheet-btn pb-sheet-del" id="pb-del-btn" onclick="deletePBEntry()"
            style="display:none">삭제</button>
          <button class="pb-sheet-btn pb-sheet-cancel" onclick="closePBEdit()">취소</button>
          <button class="pb-sheet-btn pb-sheet-save" onclick="savePBEntry()">저장</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
  <script src="./data/cloud.js"></script>
  <script src="./data/store.js"></script>
  <script src="./data/activities.js"></script>
  <script>
    // 단독 진입(목록 상단 PB 버튼) 시 목록으로 복귀
    function goBackSmart() {
      if (window.history.length > 1) { history.back(); return; }
      goBack('app.html#list');
    }

    // 거리별 PB — 실제 활동에서 계산. 각 거리의 허용 범위(km) 안의 러닝을
    // 기록(시간) 빠른 순으로 정렬해 상위 5개. (스플릿 데이터 없어 활동 거리 기준 근사)
    const DIST_BANDS = {
      '400': [0.35, 0.5],
      '1k': [0.9, 1.6],
      '3k': [2.7, 3.5],
      '5k': [4.6, 5.6],
      '10k': [9.3, 11.0],
      '15k': [14.0, 16.0],
      'half': [20.5, 21.6],
      'full': [41.0, 42.8],
    };

    // 활동 기준 기록(계산값). 공식 PB는 store(runit:pb)에 별도 저장.
    let ACT_DATA = {};

    // 거리별 정식 km (공식 PB 페이스 자동 계산용)
    const DIST_KM = { '400': 0.4, '1k': 1, '3k': 3, '5k': 5, '10k': 10, '15k': 15, 'half': 21.0975, 'full': 42.195 };

    const _timeToSec = t => {
      const p = String(t || '').trim().split(':').map(Number);
      if (p.some(isNaN) || !p.length) return null;
      if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
      if (p.length === 2) return p[0] * 60 + p[1];
      if (p.length === 1) return p[0];
      return null;
    };
    // 시간(초)+거리 → "m'ss"/km"
    const _paceFromTime = (sec, km) => {
      if (sec == null || !km) return '';
      const ps = Math.round(sec / km);
      return `${Math.floor(ps / 60)}'${String(ps % 60).padStart(2, '0')}"/km`;
    };

    const _fmtPaceKm = p => {
      const m = String(p || '').match(/^(\d+):(\d+)$/);
      return m ? `${m[1]}'${m[2]}"/km` : (p || '');
    };
    const _fmtDate = d => (d ? fmtDateDot(d) : '');
    const _fmtTime = a => {
      if (a.dur) return a.dur;
      const s = a.durSec;
      if (s == null) return '--';
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      return h > 0
        ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`
        : `${m}:${String(sec).padStart(2, '0')}`;
    };

    function buildPBData(activities) {
      const out = {};
      for (const [dist, [lo, hi]] of Object.entries(DIST_BANDS)) {
        out[dist] = (activities || [])
          .filter(a => a.km != null && a.km >= lo && a.km <= hi && a.durSec != null)
          .sort((a, b) => a.durSec - b.durSec)
          .slice(0, 5)
          .map(a => ({
            time: _fmtTime(a),
            pace: _fmtPaceKm(a.pace),
            date: _fmtDate(a.date),
            name: a.name || a.type || '러닝',
            dateKey: a.date,
          }));
      }
      return out;
    }

    const DISTS = { '400': '400m', '1k': '1K', '3k': '3K', '5k': '5K', '10k': '10K', '15k': '15K', 'half': '하프', 'full': '풀' };
    const WATERMARKS = { '400': '400', '1k': '1', '3k': '3', '5k': '5', '10k': '10', '15k': '15', 'half': '21', 'full': '42' };

    const DIST_ORDER = ['400', '1k', '3k', '5k', '10k', '15k', 'half', 'full'];
    let currentDist = '5k';

    // 거리별 히어로 기록 — 수동 공식 PB 우선, 없으면 CSV 최고 기록
    function badgeHero(dist) {
      const records = ACT_DATA[dist] || [];
      const pb = (typeof getPB === 'function') ? getPB(dist) : null;
      if (pb && pb.time) {
        return {
          time: pb.time,
          pace: pb.pace || _paceFromTime(_timeToSec(pb.time), DIST_KM[dist]),
          name: pb.name || '', dateDisp: _fmtDate(pb.date), dateKey: pb.date || '',
          fromCsv: false,
        };
      }
      if (records.length) {
        const a = records[0];
        return { time: a.time, pace: a.pace, name: a.name || '', dateDisp: a.date, dateKey: a.dateKey || '', fromCsv: true };
      }
      return null;
    }

    // 뱃지 카드 8개 생성 (1회)
    function buildBadges() {
      const wrap = document.getElementById('pb-badges');
      wrap.innerHTML = DIST_ORDER.map(d => `
        <div class="pb-badge" data-dist="${d}">
          <div class="pb-hero-card bg-${d}" data-dist="${d}" onclick="onBadgeTap('${d}')">
            <div class="pb-hero-bg"></div>
            <div class="pb-hero-watermark">${WATERMARKS[d]}</div>
            <div class="pb-hero-sheen"></div>
            <div class="pb-hero-foil"></div>
            <div class="pb-hero-content">
              <div class="pb-hero-top">
                <span class="pb-hero-dist">${DISTS[d]}</span>
                <button class="pb-hero-edit" onclick="event.stopPropagation(); onBadgeEdit('${d}')">편집</button>
              </div>
              <div class="pb-hero-time" id="pb-time-${d}">--</div>
              <div class="pb-hero-pace" id="pb-pace-${d}"></div>
              <div class="pb-hero-meta">
                <span id="pb-name-${d}"></span>
                <span class="pb-hero-date" id="pb-date-${d}"></span>
              </div>
            </div>
          </div>
        </div>`).join('');
    }

    function renderBadge(dist, animate) {
      const hero = badgeHero(dist);
      const timeEl = document.getElementById('pb-time-' + dist);
      const card = document.querySelector(`.pb-hero-card[data-dist="${dist}"]`);
      if (!timeEl || !card) return;
      if (hero) {
        document.getElementById('pb-pace-' + dist).textContent = hero.pace;
        document.getElementById('pb-name-' + dist).textContent = hero.name;
        document.getElementById('pb-date-' + dist).textContent = hero.dateDisp;
        card.dataset.date = hero.dateKey;
        if (animate) slotAnimate(timeEl, hero.time);
        else timeEl.textContent = hero.time;
      } else {
        timeEl.textContent = '--';
        document.getElementById('pb-pace-' + dist).textContent = '탭하여 PB 입력';
        document.getElementById('pb-name-' + dist).textContent = '';
        document.getElementById('pb-date-' + dist).textContent = '';
        card.dataset.date = '';
      }
    }

    function renderList() {
      const records = ACT_DATA[currentDist] || [];
      const hero = badgeHero(currentDist);
      const fromCsv = !!(hero && hero.fromCsv);
      // 히어로가 CSV 최고면 그 1건은 리스트에서 제외
      const listRecords = fromCsv ? records.slice(1) : records;
      const startRank = fromCsv ? 2 : 1;
      if (!listRecords.length) {
        document.getElementById('pb-list').innerHTML = records.length
          ? '<div class="pb-empty">추가 활동 기록 없음</div>'
          : '<div class="pb-empty">이 거리의 활동 기록이 아직 없습니다</div>';
        return;
      }
      document.getElementById('pb-list').innerHTML = listRecords.map((r, i) => `
        <div class="pb-row" data-rank="${startRank + i}" onclick="goTo('detail.html?date=${r.dateKey}')">
          <span class="pb-rank">${startRank + i}</span>
          <span class="pb-row-time">${r.time}</span>
          <div class="pb-row-meta">
            <span class="pb-row-name">${r.name}</span>
            <span class="pb-row-date">${r.date}</span>
          </div>
          <span class="pb-row-pace">${r.pace}</span>
        </div>
      `).join('');
    }

    function renderPB() {
      DIST_ORDER.forEach(d => renderBadge(d, d === currentDist));
      renderList();
      updateActiveBadge();
    }

    /* ── 캐러셀: 스크롤 스냅 → 중앙 카드 감지 → currentDist 갱신 ── */
    function activeCardEl() {
      return document.querySelector(`.pb-hero-card[data-dist="${currentDist}"]`);
    }

    function updateActiveBadge() {
      document.querySelectorAll('.pb-badge').forEach(b =>
        b.classList.toggle('active', b.dataset.dist === currentDist));
    }

    function centerBadge(dist, smooth) {
      const wrap = document.getElementById('pb-badges');
      const badge = wrap.querySelector(`.pb-badge[data-dist="${dist}"]`);
      if (!badge) return;
      const left = badge.offsetLeft - (wrap.clientWidth - badge.offsetWidth) / 2;
      wrap.scrollTo({ left, behavior: smooth ? 'smooth' : 'instant' });
    }

    (function setupBadgeSnap() {
      const wrap = document.getElementById('pb-badges');
      let timer;
      wrap.addEventListener('scroll', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          const center = wrap.scrollLeft + wrap.clientWidth / 2;
          let best = null, bd = Infinity;
          wrap.querySelectorAll('.pb-badge').forEach(b => {
            const d = Math.abs(b.offsetLeft + b.offsetWidth / 2 - center);
            if (d < bd) { bd = d; best = b; }
          });
          if (best && best.dataset.dist !== currentDist) {
            currentDist = best.dataset.dist;
            updateActiveBadge();
            renderBadge(currentDist, true);   // 슬롯머신 카운터
            renderList();
          }
        }, 90);
      }, { passive: true });
    })();

    /* ─── 공식 PB 입력 시트 ─── */
    function openPBEdit() {
      const pb = (typeof getPB === 'function') ? getPB(currentDist) : null;
      // 수동값이 있으면 그걸로, 없으면 CSV 최고 기록을 시작점으로 채움
      const best = (ACT_DATA[currentDist] && ACT_DATA[currentDist][0]) || null;
      const seed = pb || (best ? { time: best.time, date: best.dateKey, name: best.name } : null);
      document.getElementById('pb-sheet-title').textContent = `${DISTS[currentDist]} 공식 PB`;
      document.getElementById('pb-in-time').value = seed ? (seed.time || '') : '';
      document.getElementById('pb-in-date').value = seed ? (seed.date || '') : '';
      document.getElementById('pb-in-name').value = seed ? (seed.name || '') : '';
      document.getElementById('pb-del-btn').style.display = pb ? '' : 'none';
      document.getElementById('pb-sheet-backdrop').classList.add('open');
      document.getElementById('pb-sheet').classList.add('open');
    }

    function closePBEdit() {
      // iOS: 입력 포커스가 남은 채 fixed 시트가 닫히면 뷰포트가 밀린 채 고정되는 문제 방지
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      document.getElementById('pb-sheet-backdrop').classList.remove('open');
      document.getElementById('pb-sheet').classList.remove('open');
      // 포커스로 밀린 스크롤 복귀
      window.scrollTo(0, 0);
      if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
    }

    // 시간 입력 자동 콜론 — 숫자만 쳐도 18:42 / 1:46:18 로 포맷 (모바일 숫자 키패드 대응)
    (function () {
      const el = document.getElementById('pb-in-time');
      if (!el) return;
      el.addEventListener('input', () => {
        const d = el.value.replace(/\D/g, '').slice(0, 6);
        let v = d;
        if (d.length > 4) v = d.slice(0, -4) + ':' + d.slice(-4, -2) + ':' + d.slice(-2);
        else if (d.length > 2) v = d.slice(0, -2) + ':' + d.slice(-2);
        el.value = v;
      });
    })();

    function savePBEntry() {
      const time = document.getElementById('pb-in-time').value.trim();
      const sec = _timeToSec(time);
      if (!time || sec == null) { alert('기록 형식을 확인하세요 (예: 18:42 또는 1:46:18)'); return; }
      const date = document.getElementById('pb-in-date').value || null;
      const name = document.getElementById('pb-in-name').value.trim() || null;
      const pace = _paceFromTime(sec, DIST_KM[currentDist]) || null;
      setPB(currentDist, { time, pace, date, name });
      closePBEdit();
      renderPB();
    }

    function deletePBEntry() {
      removePB(currentDist);
      closePBEdit();
      renderPB();
    }

    /* ─── 슬롯머신 카운터: 숫자 자리만 scramble 후 정착 ─── */
    function slotAnimate(el, finalText, duration = 620) {
      const final = String(finalText);
      const startTime = performance.now();
      const perChar = final.split('').map((c, i) => /\d/.test(c) ? ((i + 1) / final.length) : 0);

      function tick(now) {
        const t = Math.min(1, (now - startTime) / duration);
        let out = '';
        for (let i = 0; i < final.length; i++) {
          const c = final[i];
          if (/\d/.test(c)) {
            out += (t >= perChar[i]) ? c : Math.floor(Math.random() * 10);
          } else {
            out += c;
          }
        }
        el.textContent = out;
        if (t < 1) requestAnimationFrame(tick);
        else el.textContent = final;
      }
      requestAnimationFrame(tick);
    }

    /* ─── 3D tilt + foil shimmer ───
       target/current 분리 + requestAnimationFrame 보간으로 60fps 부드럽게.
       이벤트는 target만 갱신, rAF가 매 프레임 current → target lerp.
       (CSS transition은 빠른 갱신과 충돌하므로 제거되어 있음) */
    let _touchActive = false;
    let _gyroEnabled = false;

    let _targetX = 0, _targetY = 0;
    let _currentX = 0, _currentY = 0;
    let _rafRunning = false;
    let _cardVisible = true;   // PB 카드가 화면에 보이는지 (off-screen이면 렌더 루프 정지)

    const EASE_GYRO = 0.12;   // 자이로 (느린 idle)
    const EASE_POINT = 0.28;   // 터치/마우스 (즉시 반응)
    let _currentEase = EASE_GYRO;

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function applyTilt(dx, dy) {
      const card = activeCardEl();
      if (!card) return;
      // 강화된 틸트 — 뱃지가 확실히 기울어지게
      const rx = -dy * 16;
      const ry = dx * 20;
      const fx = ((dx + 1) / 2) * 100;
      const fy = ((dy + 1) / 2) * 100;
      card.style.setProperty('--rx', rx.toFixed(2) + 'deg');
      card.style.setProperty('--ry', ry.toFixed(2) + 'deg');
      card.style.setProperty('--foil-x', fx.toFixed(2) + '%');
      card.style.setProperty('--foil-y', fy.toFixed(2) + '%');
      card.style.setProperty('--sheen-angle', (110 + dx * 35).toFixed(1));
    }

    function startRenderLoop() {
      if (_rafRunning) return;
      _rafRunning = true;
      function tick() {
        const ease = _touchActive ? EASE_POINT : _currentEase;
        _currentX += (_targetX - _currentX) * ease;
        _currentY += (_targetY - _currentY) * ease;
        applyTilt(_currentX, _currentY);
        // 입력(터치/자이로)이 없고 목표에 수렴하면 루프 정지.
        // 안 그러면 PB를 떠난 뒤에도 preserve-3d/will-change 카드를 매 프레임 갱신해
        // iOS Safari에서 인접 슬라이드(마일리지) 합성이 깨져 화면이 비는 문제가 생김.
        // 터치/자이로/포인터 이동 시 다시 startRenderLoop() 으로 재가동됨.
        const settled = Math.abs(_targetX - _currentX) < 0.001 && Math.abs(_targetY - _currentY) < 0.001;
        // 카드가 화면 밖이면(다른 탭으로 이동) 무조건 정지 — 자이로 켜져 있어도.
        if (!_cardVisible || (settled && !_touchActive && !_gyroEnabled)) {
          _currentX = _targetX; _currentY = _targetY;
          applyTilt(_currentX, _currentY);
          _rafRunning = false;
          return;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    (function setupPointerTilt() {
      const wrap = document.getElementById('pb-badges');
      if (!wrap) return;

      // 활성(중앙) 카드 기준으로 포인터 → 틸트 목표값
      function fromPointer(clientX, clientY) {
        const card = activeCardEl();
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        _targetX = clamp((clientX - cx) / (rect.width / 2), -1, 1);
        _targetY = clamp((clientY - cy) / (rect.height / 2), -1, 1);
        startRenderLoop(); // 정지된 보간 루프 재가동
      }

      wrap.addEventListener('mousemove', e => fromPointer(e.clientX, e.clientY));
      wrap.addEventListener('mouseleave', () => {
        if (!_gyroEnabled) { _targetX = 0; _targetY = 0; }
      });

      wrap.addEventListener('touchstart', e => {
        _touchActive = true;
        const t = e.touches[0];
        if (t) fromPointer(t.clientX, t.clientY);
      }, { passive: true });
      wrap.addEventListener('touchmove', e => {
        const t = e.touches[0];
        if (t) fromPointer(t.clientX, t.clientY);
      }, { passive: true });
      const endTouch = () => {
        _touchActive = false;
        if (!_gyroEnabled) { _targetX = 0; _targetY = 0; }
      };
      wrap.addEventListener('touchend', endTouch);
      wrap.addEventListener('touchcancel', endTouch);

      // 캐러셀이 화면에 보일 때만 렌더 루프 가동 — SPA에서 다른 탭(마일리지 등)으로
      // 이동해 PB 슬라이드가 off-screen 되면 3D 틸트 애니메이션을 멈춰
      // iOS Safari 합성이 깨져 인접 화면이 비는 문제 방지.
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver(entries => {
          _cardVisible = entries[0].isIntersecting;
          if (_cardVisible) startRenderLoop();
        }, { threshold: 0.01 });
        io.observe(wrap);
      }

      startRenderLoop();
    })();

    /* ─── 자이로(폰 기울기) → target만 갱신, rAF가 부드럽게 따라감 ───
       beta : 폰 앞뒤 기울기 (-180..180). 손에 든 자세 보통 30~60도.
       gamma: 폰 좌우 기울기 (-90..90). 똑바로 들면 0.
       세로 모드 기본. screen.orientation.angle 로 가로/뒤집힘 보정. */
    function handleOrient(e) {
      if (_touchActive) return;
      let gamma = e.gamma || 0;
      let beta = e.beta || 0;
      const ang = (screen.orientation && screen.orientation.angle) || 0;
      if (ang === 90) { const g = gamma; gamma = beta; beta = -g; }
      else if (ang === 270 || ang === -90) { const g = gamma; gamma = -beta; beta = g; }
      else if (ang === 180) { gamma = -gamma; beta = -beta; }

      // 감도 강화 — 작은 기울임에도 뱃지가 반응
      _targetX = clamp(gamma / 14, -1, 1);
      _targetY = clamp((beta - 45) / 14, -1, 1);
    }

    function enableGyro() {
      if (_gyroEnabled) return;
      const start = () => {
        _gyroEnabled = true;
        _currentEase = EASE_GYRO;
        window.addEventListener('deviceorientation', handleOrient);
        startRenderLoop();
      };
      // iOS 13+ 권한 요청
      if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => { if (state === 'granted') start(); })
          .catch(() => { /* user denied */ });
      } else if ('DeviceOrientationEvent' in window) {
        start();
      }
    }

    /* ─── 뱃지 탭 — 사이드 카드면 중앙으로, 활성 카드면 상세/입력 ─── */
    function onBadgeTap(dist) {
      if (dist !== currentDist) { centerBadge(dist, true); enableGyro(); return; }
      const c = activeCardEl();
      const date = c ? c.dataset.date : '';
      // 공식 PB에 날짜가 있고 그 활동이 있으면 상세로, 아니면 PB 입력 시트
      if (date) { goTo(`detail.html?date=${date}`); return; }
      openPBEdit();
      // 펄스 + 자이로 권한 요청도 함께
      if (c) {
        c.classList.remove('tap');
        void c.offsetWidth; // reflow
        c.classList.add('tap');
      }
      enableGyro();
    }

    // 편집 버튼 — 사이드 카드면 먼저 중앙으로 이동 후 시트 오픈
    function onBadgeEdit(dist) {
      if (dist !== currentDist) {
        centerBadge(dist, true);
        currentDist = dist;
        updateActiveBadge();
        renderList();
      }
      openPBEdit();
    }

    // 실제 활동 → 거리별 PB 계산 후 렌더
    buildBadges();
    renderPB(); // 로딩 전 기본 상태(공식 PB는 즉시, 활동 목록은 로드 후)
    centerBadge(currentDist, false); // 5K를 중앙에
    if (typeof loadActivities === 'function') {
      loadActivities().then(acts => { ACT_DATA = buildPBData(acts); renderPB(); });
    }
    // 클라우드 동기화(다른 기기에서 PB 변경) 반영
    window.addEventListener('runit-cloud-sync', renderPB);
    // Android/데스크탑은 권한 없이 바로 등록 시도
    enableGyro();

    /* ─── 헤더 collapse + 탭바 auto-hide (다른 페이지와 동일) ─── */
    {
      const _scrollEl = document.querySelector('.pb-scroll');
      if (typeof setupCollapsingHeader === 'function') setupCollapsingHeader(_scrollEl);
      if (typeof setupAutoHideChrome === 'function') setupAutoHideChrome(_scrollEl);
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(function (r) { if (r) { setInterval(function () { r.update(); }, 60000); } }); (function () { var _rf = false; navigator.serviceWorker.addEventListener('controllerchange', function () { if (_rf) return; _rf = true; location.reload(); }); })();
    }
  </script>
</body>
