<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>runnabe — 데이터 입력</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#202020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="runnabe">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./transitions.js"></script>
  <style>
    .input-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .input-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    }

    .input-scroll::-webkit-scrollbar {
      display: none;
    }

    .input-section {
      padding: 24px 20px 8px;
    }

    .input-section+.input-section {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      margin-top: 8px;
    }

    .input-label {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-2);
      font-family: 'Pretendard Variable', sans-serif;
      margin-bottom: 8px;
      display: block;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .input-helper {
      font-size: 12px;
      color: var(--text-2);
      opacity: 0.6;
      margin-top: 6px;
      line-height: 1.4;
      font-family: 'Pretendard Variable', sans-serif;
    }

    .hidden-block {
      display: none;
    }

    .input-field {
      width: 100%;
      box-sizing: border-box;
      max-width: 100%;
      padding: 14px 2px;
      color: var(--bone);
      font-size: 16px;
    }

    /* iOS Safari의 날짜 입력 정규화 — 기본 높이/정렬/아이콘이 다른 입력과 어긋나 깨져 보이는 문제 */
    input[type="date"].input-field,
    input[type="time"].input-field {
      min-height: 52px;
      line-height: 1.2;
      /* 다크 입력에서 네이티브 달력/시계 아이콘이 밝게 보이도록 */
      color-scheme: dark;
    }

    input[type="date"].input-field::-webkit-date-and-time-value,
    input[type="time"].input-field::-webkit-date-and-time-value {
      text-align: left;
      margin: 0;
    }

    /* 네이티브 인디케이터 숨김 → 커스텀 SVG 아이콘 사용 (모바일에서 확실히 보이게) */
    input[type="date"].input-field::-webkit-calendar-picker-indicator,
    input[type="time"].input-field::-webkit-calendar-picker-indicator {
      opacity: 0;
      -webkit-appearance: none;
      appearance: none;
      width: 0;
    }

    .dt {
      position: relative;
      display: flex;
    }

    .dt .input-field {
      width: 100%;
      padding-right: 42px;
    }

    .dt-ico {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 19px;
      height: 19px;
      color: var(--cloudy-gray);
      pointer-events: none;
    }

    textarea.input-field {
      min-height: 140px;
      resize: vertical;
      font-family: 'Space Mono', ui-monospace, monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .field-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      margin-bottom: 8px;
    }

    .field-row .input-field {
      flex: 1;
    }

    /* 단위 suffix — 입력칸 안 우측에 상시 노출 */
    .iu {
      position: relative;
      flex: 1;
      display: flex;
    }

    .iu .input-field {
      flex: 1;
      padding-right: 46px;
    }

    .iu-suf {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--cloudy-gray);
      font-family: 'Space Mono', ui-monospace, monospace;
      pointer-events: none;
    }

    .ghost-btn {
      padding: 10px 14px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: var(--slate-gray);
      font-size: 13px;
      font-family: 'Pretendard Variable', sans-serif;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .ghost-btn:active {
      background: rgba(255, 255, 255, 0.06);
    }

    /* 하단 스티키 저장 푸터 */
    .input-footer {
      flex-shrink: 0;
      padding: 0 20px calc(0px + env(safe-area-inset-bottom, 0px));
      background: var(--accent);
    }

    .save-btn {
      width: 100%;
      box-sizing: border-box;
      padding: 18px;
      color: var(--asphalt-black);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s, transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .save-btn:active {
      transform: scale(0.98);
    }

    .save-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* 토스트 */
    .toast {
      position: fixed;
      bottom: calc(40px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 14px 22px;
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      color: var(--bone);
      font-size: 14px;
      font-family: 'Pretendard Variable', sans-serif;
      z-index: 100;
      opacity: 0;
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* 저장된 목록 */
    .saved-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .saved-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .saved-item:last-child {
      border-bottom: none;
    }

    .saved-date {
      font-size: 16px;
      font-family: 'Orbitron', sans-serif;
      color: var(--bone);
    }

    .saved-tags {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .saved-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--slate-gray);
      font-family: 'Pretendard Variable', sans-serif;
    }

    .delete-btn {
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--text-2);
      font-size: 13px;
      font-family: 'Pretendard Variable', sans-serif;
      cursor: pointer;
      transition: color 0.15s;
    }

    .delete-btn:active {
      color: var(--accent);
    }

    .saved-empty {
      color: var(--text-2);
      font-size: 13px;
      padding: 12px 0;
      opacity: 0.5;
      text-align: center;
      font-family: 'Pretendard Variable', sans-serif;
    }

    /* 예시 모달 */
    .example-block {
      margin-top: 8px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      font-family: 'Space Mono', ui-monospace, monospace;
      font-size: 11px;
      color: var(--cloudy-gray);
      line-height: 1.55;
      overflow-x: auto;
      white-space: pre;
      display: none;
    }

    .example-block.open {
      display: block;
    }

    /* 러닝화 이미지 */
    .shoe-preview-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shoe-preview {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .shoe-preview.has-image {
      display: block;
    }

    .shoe-placeholder {
      font-size: 12px;
      color: var(--text-2);
      opacity: 0.5;
      font-family: 'Pretendard Variable', sans-serif;
    }

    .shoe-preview.has-image+.shoe-placeholder {
      display: none;
    }

    /* 내 신발장 목록 */
    .shoe-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .shoe-list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
    }

    .shoe-list-thumb {
      width: 56px;
      height: 40px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.4));
    }

    .shoe-list-name {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      color: var(--bone);
      font-family: 'Pretendard Variable', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .shoe-list-empty {
      font-size: 12px;
      color: var(--text-2);
      opacity: 0.5;
      font-family: 'Pretendard Variable', sans-serif;
      padding: 4px 2px;
    }

    /* 입력 검증 표시 */
    .check {
      font-size: 12px;
      color: var(--text-2);
      margin-top: 6px;
      font-family: 'Pretendard Variable', sans-serif;
      min-height: 16px;
    }

    .check.ok {
      color: #4ade80;
    }

    .check.err {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <div class="phone">
    <div class="phone-inner bg-dark" style="background: var(--asphalt-black);">

      <div class="input-page">
        <div class="back-header back-header--dark">
          <button class="back-btn" onclick="goBackToDetail()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 19-7-7 7-7" />
              <path d="M19 12H5" />
            </svg>
          </button>
          <span class="back-title">데이터 입력</span>
        </div>

        <div class="input-scroll">

          <!-- 활동 날짜 · 시작 시간 -->
          <div class="input-section">
            <label class="input-label">활동 날짜 · 시작 시간</label>
            <div class="field-row" style="gap:8px">
              <div class="dt" style="flex:2">
                <input type="date" id="input-date" class="input-field" onclick="try{this.showPicker()}catch(e){}">
                <svg class="dt-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                  <path d="M16 2v4M8 2v4M3 10h18" />
                </svg>
              </div>
              <div class="dt" style="flex:1">
                <input type="time" id="act-time" class="input-field" onclick="try{this.showPicker()}catch(e){}">
                <svg class="dt-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 7v5l3 2" />
                </svg>
              </div>
            </div>
            <div class="input-helper" id="date-helper">가민 활동 날짜 (YYYY-MM-DD). 같은 날짜면 덮어씀.</div>
          </div>

          <!-- 활동 메타 (이름 / 타입 / 메모) -->
          <div class="input-section">
            <label class="input-label">활동 메타 (수동 오버라이드)</label>
            <input type="text" id="input-name" class="input-field" placeholder="이름 (예: 인천하프) — 비우면 CSV 값"
              style="margin-bottom:8px">
            <select id="input-type" class="input-field" style="margin-bottom:8px">
              <option value="">-- type (비우면 CSV 자동 추정) --</option>
              <option value="jogging">조깅</option>
              <option value="easy">이지런</option>
              <option value="steady">스테디런</option>
              <option value="long">롱런</option>
              <option value="tt">타임 트라이얼</option>
              <option value="interval">인터벌</option>
              <option value="tempo">템포런</option>
              <option value="race">레이스</option>
            </select>
            <textarea id="input-note" class="input-field" placeholder="메모 (자유 텍스트)"
              style="min-height:80px;font-family:'Pretendard Variable',sans-serif;font-size:14px;margin-bottom:12px"></textarea>

            <div class="input-helper">이름·타입·메모는 CSV에 없는 값. 입력하면 detail에 표시됩니다.</div>
          </div>

          <!-- 활동 본체 (CSV 없이 직접 추가) -->
          <div class="input-section">
            <label class="input-label">활동 본체 (CSV 없이 직접 추가)</label>
            <div class="field-row" style="gap:8px;margin-bottom:8px">
              <div class="iu"><input type="number" step="0.01" inputmode="decimal" id="act-km" class="input-field"
                  placeholder="거리"><span class="iu-suf">km</span></div>
              <input type="text" inputmode="numeric" id="act-dur" class="input-field" placeholder="시간 (44:00 / 1:46:42)"
                style="flex:1">
            </div>
            <div class="field-row" style="gap:8px;margin-bottom:8px">
              <div class="iu"><input type="text" inputmode="numeric" id="act-pace" class="input-field"
                  placeholder="페이스 (비우면 자동)"><span class="iu-suf">/km</span></div>
              <div class="iu"><input type="number" inputmode="numeric" id="act-bpm" class="input-field"
                  placeholder="평균 심박"><span class="iu-suf">bpm</span></div>
            </div>
            <div class="field-row" style="gap:8px;margin-bottom:8px">
              <div class="iu"><input type="number" inputmode="numeric" id="act-spm" class="input-field"
                  placeholder="케이던스"><span class="iu-suf">spm</span></div>
              <div class="iu"><input type="number" step="1" inputmode="numeric" id="act-stride" class="input-field"
                  placeholder="보폭"><span class="iu-suf">cm</span></div>
            </div>
            <div class="field-row" style="gap:8px">
              <div class="iu"><input type="number" inputmode="numeric" id="act-ground" class="input-field"
                  placeholder="접지"><span class="iu-suf">ms</span></div>
              <div style="flex:1"></div>
            </div>
            <div class="input-helper">거리만 채워도 추가됨. 이름·타입은 위 메타값 사용. 마일리지·리스트에 즉시 반영(새로고침).</div>
          </div>

          <!-- 다른 화면 링크 -->
          <div class="input-section">
            <div class="field-row" style="gap:8px">
              <button type="button" class="ghost-btn" style="flex:1;text-align:center" onclick="goTo('shoes.html')">👟
                러닝화 등록</button>
              <button type="button" class="ghost-btn" style="flex:1;text-align:center" onclick="goTo('import.html')">⬆
                CSV 가져오기</button>
            </div>
            <div class="field-row" style="gap:8px;margin-top:8px">
              <button type="button" class="ghost-btn" style="flex:1;text-align:center" onclick="goTo('manage.html')">🗂
                저장 데이터 관리</button>
            </div>
          </div>

        </div>
        <!-- /input-scroll -->

        <div class="input-footer">
          <button class="save-btn" id="save-btn" onclick="onSave()" disabled>저장</button>
        </div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
  <script src="./data/cloud.js"></script>
  <script src="./data/store.js"></script>
  <script src="./data/activities.js"></script>

  <script>
    /* ── 초기화 ── */
    const dateInput = document.getElementById('input-date');
    const nameInput = document.getElementById('input-name');
    const typeInput = document.getElementById('input-type');
    const noteInput = document.getElementById('input-note');
    const dateHelper = document.getElementById('date-helper');

    let _editingManualId = null; // 편집 중인 수동 활동 id (없으면 새로 추가)
    let _editingSource = null;   // 편집 중 원본 활동(CSV/수동) — 저장 시 폼 밖 필드 보존

    /* ── 활동 본체 입력칸 채우기/비우기 ── */
    const ACT_FIELDS = ['act-time', 'act-km', 'act-dur', 'act-pace', 'act-bpm', 'act-spm', 'act-stride', 'act-ground'];
    function clearActFields() {
      _editingManualId = null;
      ACT_FIELDS.forEach(id => (document.getElementById(id).value = ''));
    }

    /* ── 시간/페이스 숫자키패드 + 콜론 자동(마스킹) ── */
    function maskTime(raw, mode) {
      const d = (raw || '').replace(/\D/g, '').slice(0, 6);
      if (!d) return '';
      if (mode === 'pace') {           // M:SS (마지막 2자리 = 초)
        if (d.length <= 2) return d;
        return d.slice(0, -2) + ':' + d.slice(-2);
      }
      // 시간: ~4자리 → MM:SS, 5~6자리 → H:MM:SS
      if (d.length <= 2) return d;
      if (d.length <= 4) return d.slice(0, -2) + ':' + d.slice(-2);
      return d.slice(0, -4) + ':' + d.slice(-4, -2) + ':' + d.slice(-2);
    }
    ['act-dur', 'act-pace'].forEach(id => {
      const el = document.getElementById(id);
      const mode = id === 'act-pace' ? 'pace' : 'dur';
      el.addEventListener('input', () => { el.value = maskTime(el.value, mode); });
    });

    /* ── 활동 본체: Enter(다음/완료)로 다음 칸 자동 이동 ── */
    const ADVANCE = ['act-km', 'act-dur', 'act-pace', 'act-bpm', 'act-spm', 'act-stride', 'act-ground'];
    ADVANCE.forEach((id, i) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const next = document.getElementById(ADVANCE[i + 1]);
          if (next) next.focus();
          else el.blur();
        }
      });
    });

    /* 신발 등록은 shoes.html, CSV 가져오기는 import.html, 저장 데이터 관리는 manage.html 로 분리됨 */

    // ?date= 우선, 없으면 오늘
    const _qs = new URLSearchParams(location.search);
    dateInput.value = _qs.get('date') || new Date().toISOString().slice(0, 10);

    // 뒤로 — 편집 중이던 날짜의 상세로 복귀 (가장 최근으로 튀지 않게)
    function goBackToDetail() {
      // 진입 경로(상세 ✏️ / 홈 캘린더 등)로 자연스럽게 복귀
      if (window.history.length > 1) {
        history.back();
        return;
      }
      // 직접 진입(이전 페이지 없음) 시에만 날짜 상세로 폴백
      const d = dateInput.value || _qs.get('date') || '';
      goBack(d ? `detail.html?date=${d}` : 'detail.html');
    }

    /* ── 토스트 ── */
    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.toggle('error', !!isError);
      t.classList.add('visible');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('visible'), 2200);
    }

    dateInput.addEventListener('change', loadForDate);

    /* ── 저장 버튼 활성/비활성 (입력 내용 있을 때만) ── */
    function updateSaveBtn() {
      const has = nameInput.value.trim() || typeInput.value || noteInput.value.trim()
        || ACT_FIELDS.some(id => document.getElementById(id).value.trim());
      document.getElementById('save-btn').disabled = !has;
    }
    const _scroll = document.querySelector('.input-scroll');
    _scroll.addEventListener('input', updateSaveBtn);
    _scroll.addEventListener('change', updateSaveBtn);

    /* ── 날짜 변경 시 CSV + 저장 데이터 자동 로드 ── */
    async function loadForDate() {
      const date = dateInput.value;
      if (!date) return;
      const meta = getMeta(date) || {};
      nameInput.value = meta.name || '';
      typeInput.value = meta.type || '';
      noteInput.value = meta.note || '';
      clearActFields();
      document.getElementById('act-time').value = meta.startTime || '';

      // 폼 채우기 — 수동 활동 우선, 없으면 CSV 활동(가민)으로 프리필.
      //  · 수동이면 _editingManualId 설정 → 그 자리에서 수정
      //  · CSV면 새 오버라이드(저장 시 수동 활동 생성, 같은 날짜 CSV를 대체)
      const manual = (typeof getManualActivities === 'function')
        ? getManualActivities().find(a => a.date === date) : null;
      let act = null;
      try { act = await getActivity(date); } catch (e) { /* ignore */ }
      const src = manual || act;
      _editingSource = src || null;   // 저장 시 원본 필드 보존용
      if (src) {
        if (manual) _editingManualId = manual.id;
        const setv = (id, v) => { document.getElementById(id).value = (v != null ? v : ''); };
        setv('act-km', src.km);
        setv('act-dur', src.dur);
        setv('act-pace', src.pace);
        setv('act-bpm', src.bpm);
        setv('act-spm', src.spm);
        setv('act-stride', src.stride != null ? Math.round(src.stride * 100) : ''); // m → cm
        setv('act-ground', src.ground);
        if (src.startTime) document.getElementById('act-time').value = src.startTime;
        if (!nameInput.value && src.name) nameInput.value = src.name;
        if (!typeInput.value && src.type) typeInput.value = src.type;
      }
      // 로드 직후(프리필 포함)엔 비활성 — 사용자가 실제로 입력/수정할 때만 활성화
      document.getElementById('save-btn').disabled = true;
      dateHelper.textContent = src
        ? `${manual ? '수동' : 'CSV'}: ${src.name || src.type || '러닝'} · ${src.km ?? '?'}km · ${src.dur || '-'}`
        : '가민 활동 날짜 (YYYY-MM-DD). 같은 날짜면 덮어씀.';
    }
    loadForDate();

    /* ── 저장 ── */
    function onSave() {
      const date = dateInput.value;
      if (!date) { showToast('날짜를 선택하세요', true); return; }

      const name = nameInput.value.trim();
      const type = typeInput.value;
      const note = noteInput.value.trim();
      const startTime = document.getElementById('act-time').value.trim();
      const hasMeta = name || type || note || startTime;

      const kmStr = document.getElementById('act-km').value.trim();
      const hasBody = kmStr !== '';

      if (!hasMeta && !hasBody) { showToast('저장할 데이터가 없습니다', true); return; }

      let saved = [];

      if (hasBody) {
        const km = parseFloat(kmStr);
        if (!Number.isFinite(km) || km <= 0) { showToast('거리(km)를 올바르게 입력하세요', true); return; }
        const act = buildManualActivity({
          id: _editingManualId,
          base: (_editingSource && _editingSource.date === date) ? _editingSource : null,
          date,
          name,
          type,
          km: kmStr,
          startTime,
          dur: document.getElementById('act-dur').value.trim(),
          pace: document.getElementById('act-pace').value.trim(),
          bpm: document.getElementById('act-bpm').value.trim(),
          spm: document.getElementById('act-spm').value.trim(),
          ground: document.getElementById('act-ground').value.trim(),
          stride: document.getElementById('act-stride').value.trim(),
        });
        saveManualActivity(act);
        _editingManualId = act.id;
        saved.push('활동');
      }

      if (hasMeta) {
        // 기존 메타(shoeId 등) 보존하며 병합
        const prevMeta = getMeta(date) || {};
        setMeta(date, { ...prevMeta, name: name || null, type: type || null, note: note || null, startTime: startTime || null });
        saved.push('메타');
      }

      showToast(`${date}: ${saved.join(' + ')} 저장됨`);
      // 저장 완료 후 토스트를 잠깐 보여주고 진입 화면으로 복귀
      setTimeout(goBackToDetail, 700);
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(function (r) { if (r) { setInterval(function () { r.update(); }, 60000); } }); (function () { var _rf = false; navigator.serviceWorker.addEventListener('controllerchange', function () { if (_rf) return; _rf = true; location.reload(); }); })();
    }
  </script>
</body>
