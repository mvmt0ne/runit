<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>runnabe — 스플래시 미리보기</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    html,body{margin:0;height:100%;background:#0c0c0d;overflow:hidden;font-family:'Pretendard Variable',sans-serif}
    #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #sp-video{position:absolute;width:2px;height:2px;opacity:.001;pointer-events:none}
    #sp-canvas{position:absolute;inset:0;width:100%;height:100%}
    .sp-scrim{position:absolute;inset:0;pointer-events:none;
      background:
        radial-gradient(40% 26% at 50% 50%, rgba(0,0,0,.5) 0%, transparent 72%),
        radial-gradient(120% 82% at 50% 46%, transparent 30%, rgba(0,0,0,.68) 100%)}
    #splash svg{position:relative;width:200px;height:auto}
    .sp-tri{fill:var(--accent)}.sp-wm{fill:var(--bone)}
    .bar{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;z-index:10}
    .bar button{padding:12px 20px;border-radius:100px;border:1px solid rgba(255,255,255,.2);
      background:rgba(20,20,20,.6);backdrop-filter:blur(12px);color:#efeeed;font-size:14px;font-weight:600}
    .bar button.on{background:var(--accent);color:#202020;border-color:transparent}
    .hint{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#888;font-size:12px;z-index:10}
  </style>
</head>
<body>
  <div class="hint">모드 전환 · 탭하면 다시 재생</div>
  <div id="splash" onclick="replay()">
    <video id="sp-video" autoplay muted playsinline preload="auto" loop src="./splash.mp4"></video>
    <canvas id="sp-canvas"></canvas>
    <div class="sp-scrim"></div>
    <svg viewBox="20 40 120 80" xmlns="http://www.w3.org/2000/svg">
      <path class="sp-tri" d="M79.0302 65.7481C79.2015 65.8723 79.2015 66.1277 79.0302 66.2519L61.2047 79.1754C60.999 79.3245 60.7109 79.1776 60.7109 78.9235L60.7109 53.0765C60.7109 52.8224 60.999 52.6755 61.2047 52.8246L79.0302 65.7481Z"/>
      <path class="sp-tri" d="M89.8135 65.8125C89.8974 65.9234 89.8974 66.0766 89.8135 66.1875L79.9368 79.2597C79.7569 79.4978 79.3774 79.3706 79.3774 79.0722L79.3774 52.9278C79.3774 52.6294 79.7569 52.5022 79.9368 52.7403L89.8135 65.8125Z"/>
      <path class="sp-tri" d="M96.1216 65.8736C96.1574 65.9541 96.1574 66.0459 96.1216 66.1264L90.551 78.6603C90.4145 78.9674 89.9556 78.87 89.9556 78.534L89.9556 53.466C89.9556 53.13 90.4145 53.0326 90.551 53.3397L96.1216 65.8736Z"/>
      <path class="sp-tri" d="M99.2738 65.9325C99.2837 65.977 99.2837 66.023 99.2738 66.0675L96.7925 77.2333C96.7119 77.5963 96.1777 77.5376 96.1777 77.1658L96.1777 54.8342C96.1777 54.4624 96.7119 54.4037 96.7925 54.7667L99.2738 65.9325Z"/>
      <path class="sp-wm" d="M35.3 108L31.12 103.02H35.18L38.5 106.94V108H35.3ZM24.12 108V93.62H35.54C36.0867 93.62 36.58 93.7533 37.02 94.02C37.4733 94.2867 37.8333 94.6467 38.1 95.1C38.38 95.5533 38.52 96.0467 38.52 96.58V100.3C38.52 100.833 38.38 101.327 38.1 101.78C37.8333 102.233 37.4733 102.593 37.02 102.86C36.58 103.127 36.0867 103.26 35.54 103.26L27.22 103.28V108H24.12ZM27.22 100.14H35.38V96.72H27.22V100.14ZM42.9439 108C42.4106 108 41.9172 107.867 41.4639 107.6C41.0106 107.333 40.6506 106.973 40.3839 106.52C40.1172 106.067 39.9839 105.573 39.9839 105.04V93.6H43.0839V104.88H51.2439V93.6H54.3839V105.04C54.3839 105.573 54.2439 106.067 53.9639 106.52C53.6972 106.973 53.3372 107.333 52.8839 107.6C52.4439 107.867 51.9572 108 51.4239 108H42.9439ZM55.9864 108V93.6H59.1864L67.2464 103.2V93.6H70.3864V108H67.1864L59.0864 98.36V108H55.9864ZM72.027 108V93.6H75.227L83.287 103.2V93.6H86.427V108H83.227L75.127 98.36V108H72.027ZM88.1077 108V96.56C88.1077 96.0133 88.241 95.52 88.5077 95.08C88.7743 94.6267 89.1343 94.2667 89.5877 94C90.041 93.7333 90.5343 93.6 91.0677 93.6H99.5277C100.074 93.6 100.568 93.7333 101.008 94C101.461 94.2667 101.821 94.6267 102.088 95.08C102.368 95.52 102.508 96.0133 102.508 96.56V108H99.3677V103.36H91.2077V108H88.1077ZM91.2077 100.24H99.3677V96.72H91.2077V100.24ZM104.246 108V93.6H115.126C115.66 93.6 116.146 93.7533 116.586 94C117.04 94.2667 117.4 94.6267 117.666 95.08C117.946 95.52 118.086 96.0133 118.086 96.56V99.26C118.086 99.4333 118.073 99.6 118.046 99.76C118.033 99.9067 118 100.047 117.946 100.18C118.146 100.433 118.313 100.727 118.446 101.06C118.58 101.393 118.646 101.727 118.646 102.06V105.04C118.646 105.573 118.506 106.067 118.226 106.52C117.96 106.973 117.6 107.333 117.146 107.6C116.706 107.867 116.213 108 115.666 108H104.246ZM107.346 104.88H115.506V102.24H107.346V104.88ZM107.346 99.12H114.946V96.72H107.346V99.12ZM120.267 108V93.6H133.567V96.72H123.407V99.24H131.587V102.36H123.407V104.88H133.567V108H120.267Z"/>
    </svg>
  </div>
  <div class="bar">
    <button id="b-dot" class="on" onclick="setMode('dot')">도트</button>
    <button id="b-glass" onclick="setMode('glass')">글래스</button>
    <button id="b-prism" onclick="setMode('prism')">프리즘</button>
  </div>
  <script>
    var video = document.getElementById('sp-video');
    var canvas = document.getElementById('sp-canvas');
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var mode = 'dot', cw = 0, ch = 0, raf = 0;
    var oc = document.createElement('canvas'), octx = oc.getContext('2d', { willReadFrequently: true });

    function resize() {
      cw = window.innerWidth; ch = window.innerHeight;
      canvas.width = cw * dpr; canvas.height = ch * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize(); window.addEventListener('resize', resize);

    function ramp(t) {
      var a = [10, 22, 48], b = [235, 238, 245], c = [255, 76, 49], p, q, k;
      if (t < 0.55) { k = t / 0.55; p = a; q = b; } else { k = (t - 0.55) / 0.45; p = b; q = c; }
      return 'rgb(' + Math.round(p[0] + (q[0] - p[0]) * k) + ',' + Math.round(p[1] + (q[1] - p[1]) * k) + ',' + Math.round(p[2] + (q[2] - p[2]) * k) + ')';
    }
    function drawDot() {
      var vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
      var CELL = 11, cols = Math.ceil(cw / CELL), rows = Math.ceil(ch / CELL);
      oc.width = cols; oc.height = rows;
      var scale = Math.max(cols / vw, rows / vh), dw = vw * scale, dh = vh * scale;
      octx.drawImage(video, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
      var d = octx.getImageData(0, 0, cols, rows).data;
      ctx.clearRect(0, 0, cw, ch);
      for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) {
        var i = (y * cols + x) * 4, lum = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
        if (lum < 0.08) continue;
        ctx.fillStyle = ramp(lum);
        ctx.beginPath(); ctx.arc(x * CELL + CELL / 2, y * CELL + CELL / 2, 0.6 + lum * CELL * 0.62, 0, 6.2832); ctx.fill();
      }
    }
    var COLS = 5, ROWS = 9, GAP = 3, jit = [];
    function rnd(n) { var x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); }
    for (var t = 0; t < COLS * ROWS; t++) jit.push({ dx: (rnd(t) - .5) * 10, dy: (rnd(t + 99) - .5) * 10, sc: 1 + (rnd(t + 7) - .5) * .14, br: .85 + rnd(t + 3) * .4 });
    var t0 = performance.now();
    function drawGlass(now) {
      var vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
      var scale = Math.max(cw / vw, ch / vh), dw = vw * scale, dh = vh * scale, ox = (cw - dw) / 2, oy = (ch - dh) / 2;
      ctx.clearRect(0, 0, cw, ch);
      var tw = cw / COLS, th = ch / ROWS;
      ctx.filter = 'grayscale(1) contrast(1.25) brightness(0.62)';
      for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
        var j = jit[r * COLS + c], dX = c * tw, dY = r * th;
        var sx = (dX - ox) / scale + j.dx, sy = (dY - oy) / scale + j.dy, sw = (tw / scale) / j.sc, sh = (th / scale) / j.sc;
        ctx.globalAlpha = j.br;
        try { ctx.drawImage(video, sx, sy, sw, sh, dX + GAP, dY + GAP, tw - 2 * GAP, th - 2 * GAP); } catch (e) { }
      }
      ctx.filter = 'none'; ctx.globalAlpha = 1;
      for (var r2 = 0; r2 < ROWS; r2++) for (var c2 = 0; c2 < COLS; c2++) {
        var x = c2 * tw + GAP, y = r2 * th + GAP, w = tw - 2 * GAP, h = th - 2 * GAP;
        var g = ctx.createLinearGradient(x, y, x + w, y + h);
        g.addColorStop(0, 'rgba(255,255,255,0.10)'); g.addColorStop(.5, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,0.28)');
        ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
      }
      var p = ((now - t0) % 3400) / 2600, band = -cw + p * cw * 2.4;
      var sg = ctx.createLinearGradient(band, 0, band + cw * .5, ch);
      sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,120,90,.1)'); sg.addColorStop(.52, 'rgba(255,255,255,.14)'); sg.addColorStop(.54, 'rgba(90,150,255,.1)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sg; ctx.fillRect(0, 0, cw, ch);
    }
    function drawPrism(now) {
      var vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
      ctx.globalCompositeOperation = 'source-over';
      // 1) 세로 스펙트럼 배경 (딥블루 → 화이트 → accent 레드)
      var sp = ctx.createLinearGradient(0, 0, 0, ch);
      sp.addColorStop(0.00, '#05060a');
      sp.addColorStop(0.22, '#15316f');
      sp.addColorStop(0.42, '#5fb8e0');
      sp.addColorStop(0.52, '#eef2f8');
      sp.addColorStop(0.66, '#ff6a44');
      sp.addColorStop(1.00, '#2a0705');
      ctx.fillStyle = sp; ctx.fillRect(0, 0, cw, ch);
      // 2) 좌우 어둡게 → 중앙 세로 블룸 집중
      var bl = ctx.createLinearGradient(0, 0, cw, 0);
      bl.addColorStop(0, 'rgba(0,0,0,0.78)'); bl.addColorStop(0.5, 'rgba(0,0,0,0)'); bl.addColorStop(1, 'rgba(0,0,0,0.78)');
      ctx.fillStyle = bl; ctx.fillRect(0, 0, cw, ch);
      // 3) 러너 실루엣 — multiply 로 어두운 형상만 스펙트럼 위에 각인
      ctx.globalCompositeOperation = 'multiply';
      ctx.filter = 'grayscale(1) contrast(1.5) brightness(1.15)';
      var scale = Math.max(cw / vw, ch / vh), dw = vw * scale, dh = vh * scale;
      ctx.drawImage(video, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
      ctx.filter = 'none';
      // 4) 미세 세로 슬랫 결(블라인드) — 천천히 흐름
      ctx.globalCompositeOperation = 'source-over';
      var SL = 7, off = (now * 0.02) % SL;
      ctx.fillStyle = 'rgba(0,0,0,0.42)';
      for (var x = -SL + off; x < cw; x += SL) ctx.fillRect(x, 0, 2, ch);
      // 5) 중앙 세로 하이라이트 코어
      var core = ctx.createLinearGradient(0, 0, cw, 0);
      core.addColorStop(0.42, 'rgba(255,255,255,0)'); core.addColorStop(0.5, 'rgba(255,255,255,0.14)'); core.addColorStop(0.58, 'rgba(255,255,255,0)');
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = core; ctx.fillRect(0, 0, cw, ch);
      ctx.globalCompositeOperation = 'source-over';
    }
    function loop(now) { raf = requestAnimationFrame(loop); if (mode === 'dot') drawDot(); else if (mode === 'glass') drawGlass(now); else drawPrism(now); }
    function setMode(m) {
      mode = m;
      document.getElementById('b-dot').classList.toggle('on', m === 'dot');
      document.getElementById('b-glass').classList.toggle('on', m === 'glass');
      document.getElementById('b-prism').classList.toggle('on', m === 'prism');
    }
    function replay() { video.currentTime = 0; video.play().catch(function () { }); }
    video.play().catch(function () { });
    requestAnimationFrame(loop);
  </script>
</body>
</html>
